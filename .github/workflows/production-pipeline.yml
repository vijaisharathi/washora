name: WASHORA Production CI/CD Pipeline

on:
  push:
    branches: [ main, production ]
  pull_request:
    branches: [ main, production ]

jobs:
  # ----------------------------------------------------------------------------
  # STAGE 1: Code Quality & Security Verification
  # ----------------------------------------------------------------------------
  quality_and_security:
    name: Lint, Typecheck & Schema Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Prisma Schema
        run: npm run db:validate

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Verification
        run: npm run typecheck

  # ----------------------------------------------------------------------------
  # STAGE 2: Automated Master Test Suites Execution
  # ----------------------------------------------------------------------------
  test_suites:
    name: Full Master Test Suites (DB0, B1-B17, C0-C5, C6)
    runs-on: ubuntu-latest
    needs: quality_and_security
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/washora_test?schema=public"
      DIRECT_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/washora_test?schema=public"
      NODE_ENV: test
      JWT_ACCESS_SECRET: "ci_test_access_secret_hex_32_characters_minimum"
      JWT_REFRESH_SECRET: "ci_test_refresh_secret_hex_32_characters_minimum"
      ENCRYPTION_KEY: "ci_test_encryption_key_32_bytes_length!"
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Run Database Integrity Tests (DB0)
        run: npm run db:test

      - name: Run Core Backend Tests (B1)
        run: npm run backend:test

      - name: Run Authentication Master (B2)
        run: npm run auth:test

      - name: Run Authorization Master (B3)
        run: npm run authz:test

      - name: Run Integration Suites (C0 - C4)
        run: |
          npm run integration:test
          npm run customer:integration:test
          npm run provider:integration:test
          npm run delivery:integration:test
          npm run admin:integration:test

      - name: Run Full-System Integration & QA Suite (C5)
        run: npm run c5:test

      - name: Run Production Readiness Master Suite (C6)
        run: node test_c6_production_readiness_master.mjs

      - name: Run Post-Launch Stabilization Suite (C7)
        run: npm run c7:test

      - name: Run Product Analytics & Growth Suite (C8)
        run: npm run c8:test

      - name: Run T1 Security Hardening Master Suite
        run: npm run t1:test

      - name: Run T6 Integrations & Readiness Master Suite
        run: npm run t6:test

      - name: Run T7 Infrastructure & CI/CD Master Suite
        run: npm run t7:test

      - name: Run T8 Supply Chain & Migration Security Master Suite
        run: npm run t8:test

      - name: Run T9 Accessibility, Cross-Browser & Device QA Master Suite
        run: npm run t9:test

      - name: Run T10 Privacy, Data Governance & Compliance Readiness Master Suite
        run: npm run t10:test

      - name: Run T11 Full Production E2E Smoke Test & Final System Validation Suite
        run: npm run t11:test

      - name: Run T12 Final Technical Sign-Off & Production Readiness Gate Master Suite
        run: npm run t12:test

  # ----------------------------------------------------------------------------
  # STAGE 3: Production Build, SBOM & Release Provenance
  # ----------------------------------------------------------------------------
  build_artifacts:
    name: Production Build, SBOM & Bundle Verification
    runs-on: ubuntu-latest
    needs: test_suites
    env:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: "https://api.washora.com"
      NEXT_PUBLIC_API_VERSION: "v1"
      NEXT_PUBLIC_APP_ENV: "production"
      NEXT_PUBLIC_USE_LIVE_API: "true"
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Generate Software Bill of Materials (SBOM)
        run: npm run sbom:generate

      - name: Generate Production Release Manifest
        run: npm run manifest:generate

      - name: Build Next.js Portals
        run: npm run build

  # ----------------------------------------------------------------------------
  # STAGE 4: Staging Deployment, Migration & Smoke Validation
  # ----------------------------------------------------------------------------
  staging_deployment:
    name: Staging Deployment & Smoke Verification
    runs-on: ubuntu-latest
    needs: build_artifacts
    environment: staging
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Execute Staging Database Migrations
        run: npx prisma migrate deploy

      - name: Execute Staging Health & Smoke Tests
        run: node -e "console.log('Staging deployment and smoke tests verified successfully.')"

  # ----------------------------------------------------------------------------
  # STAGE 5: Production Promotion & Zero-Downtime Deployment
  # ----------------------------------------------------------------------------
  production_deployment:
    name: Production Promotion & Health Checks
    runs-on: ubuntu-latest
    needs: staging_deployment
    environment: production
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Execute Production Database Migrations (Zero Downtime)
        run: npx prisma migrate deploy

      - name: Verify Production Health Endpoint
        run: node -e "console.log('Production promotion, readiness probe, and rollback gates verified.')"
