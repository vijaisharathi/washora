<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Add New Address</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet"/>
<style>
        @font-face {
            font-family: 'Geist';
            src: url('https://cdn.jsdelivr.net/npm/geist@1.0.0/fonts/geist-sans/Geist-Regular.woff2') format('woff2');
            font-weight: 400;
            font-style: normal;
        }
        @font-face {
            font-family: 'Geist';
            src: url('https://cdn.jsdelivr.net/npm/geist@1.0.0/fonts/geist-sans/Geist-Medium.woff2') format('woff2');
            font-weight: 500;
            font-style: normal;
        }
        @font-face {
            font-family: 'Geist';
            src: url('https://cdn.jsdelivr.net/npm/geist@1.0.0/fonts/geist-sans/Geist-SemiBold.woff2') format('woff2');
            font-weight: 600;
            font-style: normal;
        }
        @font-face {
            font-family: 'Geist';
            src: url('https://cdn.jsdelivr.net/npm/geist@1.0.0/fonts/geist-sans/Geist-Bold.woff2') format('woff2');
            font-weight: 700;
            font-style: normal;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-surface-variant": "#cfc2d7",
                        "error-red": "#ffb4ab",
                        "success-bg": "#1A3D24",
                        "primary-container": "#8a2be2",
                        "on-background": "#e5e2e3",
                        "secondary-container": "#49494b",
                        "error-container": "#93000a",
                        "surface-bright": "#39393a",
                        "error": "#ffb4ab",
                        "surface-container-high": "#2a2a2b",
                        "surface-container-low": "#1c1b1c",
                        "on-secondary-fixed-variant": "#474648",
                        "tertiary-fixed": "#e4e2e4",
                        "inverse-on-surface": "#313031",
                        "inverse-primary": "#8422dc",
                        "primary-fixed": "#efdbff",
                        "background": "#131314",
                        "surface-variant": "#353436",
                        "surface-tint": "#dcb8ff",
                        "on-tertiary": "#303032",
                        "primary": "#dcb8ff",
                        "tertiary": "#c8c6c8",
                        "on-secondary-container": "#b9b8ba",
                        "on-primary-container": "#eed9ff",
                        "secondary-fixed-dim": "#c8c6c8",
                        "on-error": "#690005",
                        "on-primary-fixed-variant": "#6700b5",
                        "on-error-container": "#ffdad6",
                        "surface-container-lowest": "#0e0e0f",
                        "on-tertiary-fixed": "#1b1b1d",
                        "surface-container": "#201f20",
                        "outline-variant": "#4c4354",
                        "tertiary-container": "#646365",
                        "primary-fixed-dim": "#dcb8ff",
                        "on-primary": "#480081",
                        "on-tertiary-fixed-variant": "#474648",
                        "on-secondary": "#303032",
                        "on-surface": "#e5e2e3",
                        "electric-violet": "#8a2be2",
                        "tertiary-fixed-dim": "#c8c6c8",
                        "surface-dim": "#131314",
                        "secondary": "#c8c6c8",
                        "on-tertiary-container": "#e3e0e2",
                        "on-secondary-fixed": "#1b1b1d",
                        "surface-container-highest": "#353436",
                        "surface": "#131314",
                        "secondary-fixed": "#e4e2e4",
                        "outline": "#988ca0",
                        "on-primary-fixed": "#2c0051",
                        "inverse-surface": "#e5e2e3",
                        "success-green": "#81C784"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xl": "32px",
                        "lg": "24px",
                        "2xl": "48px",
                        "sm": "8px",
                        "3xl": "64px",
                        "xs": "4px",
                        "md": "16px"
                    },
                    "fontFamily": {
                        "label-md": ["Geist"],
                        "headline-lg": ["Geist"],
                        "h1": ["Geist"],
                        "h3": ["Geist"],
                        "caption": ["Geist"],
                        "display-lg": ["Geist"],
                        "mono-display": ["monospace"],
                        "body-md": ["Geist"]
                    },
                    "fontSize": {
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "h1": ["28px", { "lineHeight": "36px", "fontWeight": "700" }],
                        "h3": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "caption": ["12px", { "lineHeight": "16px", "fontWeight": "400" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "mono-display": ["18px", { "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background text-on-surface font-body-md min-h-screen flex flex-col md:flex-row">
<!-- Top Navigation (Mobile) / Side Navigation (Desktop) - Suppressed as this is a task-focused screen (adding address implies a specific, linear task or sub-page with a close/cancel action). -->
<!-- Main Content Area -->
<main class="flex-1 w-full max-w-[800px] mx-auto p-md md:p-xl flex flex-col">
<!-- Header -->
<header class="flex items-center gap-sm mb-lg md:mb-xl">
<button class="text-on-surface-variant hover:text-primary transition-colors p-sm -ml-sm rounded-full hover:bg-surface-container">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-h1 text-h1 text-on-surface">Add New Address</h1>
</header>
<!-- Form Container -->
<div class="bg-surface-container rounded-xl border border-outline-variant/20 p-lg shadow-sm flex flex-col gap-lg">
<!-- Coverage Indicator -->
<div class="flex items-center gap-sm bg-success-bg/20 border border-success-green/30 p-sm rounded-lg text-success-green">
<span class="material-symbols-outlined" data-icon="check_circle">check_circle</span>
<span class="font-label-md text-label-md">Pickup available in this area.</span>
</div>
<!-- Form -->
<form class="flex flex-col gap-md">
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<!-- Full Name -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="fullName">Full Name</label>
<input class="bg-surface-container-low border border-outline-variant/50 rounded-lg p-sm text-on-surface font-body-md focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-colors placeholder:text-on-surface-variant/50" id="fullName" placeholder="John Doe" type="text"/>
</div>
<!-- Phone Number -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="phone">Phone Number</label>
<input class="bg-surface-container-low border border-outline-variant/50 rounded-lg p-sm text-on-surface font-body-md focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-colors placeholder:text-on-surface-variant/50" id="phone" placeholder="+1 (555) 000-0000" type="tel"/>
</div>
</div>
<!-- House/Flat/Unit & Street/Area -->
<div class="grid grid-cols-1 gap-md">
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="addressLine1">House/Flat/Unit</label>
<input class="bg-surface-container-low border border-outline-variant/50 rounded-lg p-sm text-on-surface font-body-md focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-colors placeholder:text-on-surface-variant/50" id="addressLine1" placeholder="Apt 4B" type="text"/>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="street">Street/Area</label>
<input class="bg-surface-container-low border border-outline-variant/50 rounded-lg p-sm text-on-surface font-body-md focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-colors placeholder:text-on-surface-variant/50" id="street" placeholder="123 Tech Boulevard" type="text"/>
</div>
</div>
<!-- Landmark -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="landmark">Landmark (Optional)</label>
<input class="bg-surface-container-low border border-outline-variant/50 rounded-lg p-sm text-on-surface font-body-md focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-colors placeholder:text-on-surface-variant/50" id="landmark" placeholder="Near the central park" type="text"/>
</div>
<!-- City, State, Pincode -->
<div class="grid grid-cols-1 md:grid-cols-3 gap-md">
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="city">City</label>
<input class="bg-surface-container-low border border-outline-variant/50 rounded-lg p-sm text-on-surface font-body-md focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-colors placeholder:text-on-surface-variant/50" id="city" placeholder="San Francisco" type="text"/>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="state">State</label>
<input class="bg-surface-container-low border border-outline-variant/50 rounded-lg p-sm text-on-surface font-body-md focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-colors placeholder:text-on-surface-variant/50" id="state" placeholder="CA" type="text"/>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="pincode">Pincode</label>
<input class="bg-surface-container-low border border-outline-variant/50 rounded-lg p-sm text-on-surface font-body-md focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-colors placeholder:text-on-surface-variant/50" id="pincode" placeholder="94105" type="text"/>
</div>
</div>
<!-- Address Type Labels -->
<div class="flex flex-col gap-sm mt-sm">
<span class="font-label-md text-label-md text-on-surface-variant">Save as</span>
<div class="flex gap-sm">
<label class="cursor-pointer">
<input checked="" class="peer sr-only" name="addressType" type="radio" value="home"/>
<div class="px-md py-sm rounded-full border border-outline-variant/50 text-on-surface-variant font-label-md text-label-md peer-checked:bg-primary/20 peer-checked:border-primary peer-checked:text-primary transition-all flex items-center gap-xs">
<span class="material-symbols-outlined text-[18px]" data-icon="home">home</span>
                                Home
                            </div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="addressType" type="radio" value="work"/>
<div class="px-md py-sm rounded-full border border-outline-variant/50 text-on-surface-variant font-label-md text-label-md peer-checked:bg-primary/20 peer-checked:border-primary peer-checked:text-primary transition-all flex items-center gap-xs">
<span class="material-symbols-outlined text-[18px]" data-icon="work">work</span>
                                Work
                            </div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="addressType" type="radio" value="other"/>
<div class="px-md py-sm rounded-full border border-outline-variant/50 text-on-surface-variant font-label-md text-label-md peer-checked:bg-primary/20 peer-checked:border-primary peer-checked:text-primary transition-all flex items-center gap-xs">
<span class="material-symbols-outlined text-[18px]" data-icon="location_on">location_on</span>
                                Other
                            </div>
</label>
</div>
</div>
<!-- Actions -->
<div class="flex items-center justify-end gap-md mt-lg pt-md border-t border-outline-variant/20">
<button class="font-label-md text-label-md text-on-surface px-lg py-sm rounded-lg border border-outline-variant hover:bg-surface-container transition-colors" type="button">
                        Cancel
                    </button>
<button class="bg-electric-violet text-white font-label-md text-label-md font-bold px-lg py-sm rounded-lg shadow-lg shadow-primary-container/20 hover:opacity-90 transition-opacity flex items-center gap-xs" type="submit">
                        SAVE ADDRESS
                    </button>
</div>
</form>
</div>
</main>
</body></html>
