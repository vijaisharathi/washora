<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Add-ons & Extra Services - Anything Clean</title>

                        "on-surface": "#e5e2e3",

                        "tertiary-fixed": "#e4e2e4",
                        "on-tertiary": "#303032",

                        "secondary-fixed": "#e4e2e4",

                        "outline": "#988ca0",
                        "secondary": "#c8c6c8",
                        "surface-dim": "#131314",
                        "background": "#131314",
                        "primary-container": "#8a2be2",
                        "surface": "#131314",
                        "surface-container-lowest": "#0e0e0f",
                        "surface-container-highest": "#353436",
                        "surface-variant": "#353436",
                        "success-bg": "#1A3D24"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "md": "16px",
                        "sm": "8px",
                        "3xl": "64px",
                        "2xl": "48px",
                        "xs": "4px",

                        "lg": "24px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Geist"],
                        "h3": ["Geist"],

                        "h1": ["28px", { "lineHeight": "36px", "fontWeight": "700" }]

                }
            }
        }
    </script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .filled-icon { font-variation-settings: 'FILL' 1; }
    </style>
</head>
<body class="bg-background text-on-surface font-body-md min-h-screen flex flex-col md:flex-row">
<!-- Nav Shell Suppressed per Semantic Shell Mandate (Linear/Transactional Checkout Flow) -->
<main class="flex-1 max-w-[1200px] mx-auto w-full px-md py-xl md:px-xl md:py-3xl flex flex-col gap-2xl">
<!-- Header -->
<header class="flex flex-col gap-sm">
<h1 class="font-display-lg text-display-lg text-on-surface">Add More Care</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-2xl">Optional extras for your service.</p>
</header>
<!-- Add-ons Grid -->
<section class="grid grid-cols-1 md:grid-cols-3 gap-md">
<!-- Card 1: Water & Stain Protection -->
<div class="bg-surface-container border border-outline-variant/20 rounded-xl p-lg flex flex-col justify-between gap-md relative overflow-hidden group">
<div class="flex flex-col gap-sm relative z-10">
<div class="flex justify-between items-start">
<span class="material-symbols-outlined text-primary text-3xl">water_drop</span>
<span class="font-mono-display text-mono-display text-primary">₹99</span>
</div>
<h3 class="font-h3 text-h3 text-on-surface mt-sm">Water & Stain Protection</h3>
<p class="font-caption text-caption text-on-surface-variant">Helps protect the surface after cleaning.</p>
</div>
<button class="w-full mt-md py-sm px-md rounded-lg border border-outline-variant text-on-surface hover:bg-surface-container-high transition-colors font-label-md text-label-md flex items-center justify-center gap-sm group-data-[added=true]:bg-success-bg group-data-[added=true]:text-success-green group-data-[added=true]:border-success-green/30" onclick="toggleAddon(this, 99)">
<span class="material-symbols-outlined text-[18px] group-data-[added=true]:hidden">add</span>
<span class="material-symbols-outlined text-[18px] hidden group-data-[added=true]:block">check</span>
<span class="group-data-[added=true]:hidden">Add</span>
<span class="hidden group-data-[added=true]:block">Added</span>
</button>
</div>
<!-- Card 2: Odor Treatment -->
<div class="bg-surface-container border border-outline-variant/20 rounded-xl p-lg flex flex-col justify-between gap-md relative overflow-hidden group">
<div class="flex flex-col gap-sm relative z-10">
<div class="flex justify-between items-start">
<span class="material-symbols-outlined text-primary text-3xl">air</span>
<span class="font-mono-display text-mono-display text-primary">₹79</span>
</div>
<h3 class="font-h3 text-h3 text-on-surface mt-sm">Odor Treatment</h3>
<p class="font-caption text-caption text-on-surface-variant">Additional odor treatment.</p>
</div>
<button class="w-full mt-md py-sm px-md rounded-lg border border-outline-variant text-on-surface hover:bg-surface-container-high transition-colors font-label-md text-label-md flex items-center justify-center gap-sm group-data-[added=true]:bg-success-bg group-data-[added=true]:text-success-green group-data-[added=true]:border-success-green/30" onclick="toggleAddon(this, 79)">
<span class="material-symbols-outlined text-[18px] group-data-[added=true]:hidden">add</span>
<span class="material-symbols-outlined text-[18px] hidden group-data-[added=true]:block">check</span>
<span class="group-data-[added=true]:hidden">Add</span>
<span class="hidden group-data-[added=true]:block">Added</span>
</button>
</div>
<!-- Card 3: Premium Finishing -->
<div class="bg-surface-container border border-outline-variant/20 rounded-xl p-lg flex flex-col justify-between gap-md relative overflow-hidden group">
<div class="flex flex-col gap-sm relative z-10">
<div class="flex justify-between items-start">
<span class="material-symbols-outlined text-primary text-3xl">star</span>
<span class="font-mono-display text-mono-display text-primary">₹129</span>
</div>
<h3 class="font-h3 text-h3 text-on-surface mt-sm">Premium Finishing</h3>
<p class="font-caption text-caption text-on-surface-variant">Enhanced finishing after cleaning.</p>
</div>
<button class="w-full mt-md py-sm px-md rounded-lg border border-outline-variant text-on-surface hover:bg-surface-container-high transition-colors font-label-md text-label-md flex items-center justify-center gap-sm group-data-[added=true]:bg-success-bg group-data-[added=true]:text-success-green group-data-[added=true]:border-success-green/30" onclick="toggleAddon(this, 129)">
<span class="material-symbols-outlined text-[18px] group-data-[added=true]:hidden">add</span>
<span class="material-symbols-outlined text-[18px] hidden group-data-[added=true]:block">check</span>
<span class="group-data-[added=true]:hidden">Add</span>
<span class="hidden group-data-[added=true]:block">Added</span>
</button>
</div>
</section>
<!-- Spacer for fixed footer -->
<div class="h-32"></div>
</main>
<!-- Fixed Footer -->
<footer class="fixed bottom-0 left-0 w-full bg-surface-container-low border-t border-outline-variant/30 px-md py-md z-40 backdrop-blur-md bg-opacity-90">
<div class="max-w-[1200px] mx-auto flex flex-col md:flex-row justify-between items-center gap-md">
<!-- Live Price Update -->
<div class="flex items-center gap-md font-label-md text-label-md">
<div class="flex flex-col">
<span class="text-on-surface-variant">Service</span>
<span class="text-on-surface font-mono-display text-mono-display">₹449</span>
</div>
<span class="text-outline-variant text-2xl">+</span>
<div class="flex flex-col">
<span class="text-on-surface-variant">Add-ons</span>
<span class="text-on-surface font-mono-display text-mono-display" id="addons-total">₹0</span>
</div>
<span class="text-outline-variant text-2xl">=</span>
<div class="flex flex-col bg-primary/10 px-sm py-xs rounded">
<span class="text-primary font-bold">Total</span>
<span class="text-primary font-mono-display text-mono-display font-bold" id="grand-total">₹449</span>
</div>
</div>
<!-- CTAs -->
<div class="flex w-full md:w-auto gap-md">
<button class="flex-1 md:flex-none py-sm px-lg rounded-lg border border-outline-variant text-on-surface hover:bg-surface-container transition-colors font-label-md text-label-md">
                    Skip Add-ons
                </button>
<button class="flex-1 md:flex-none bg-electric-violet text-white py-sm px-lg rounded-lg font-label-md text-label-md font-bold shadow-lg shadow-primary/20 hover:opacity-90 transition-opacity">
                    Continue
                </button>
</div>
</div>
</footer>
<script>
        let basePrice = 449;
        let addonsTotal = 0;

        function toggleAddon(button, price) {
            const card = button.closest('.group');
            const isAdded = card.getAttribute('data-added') === 'true';

            if (isAdded) {
                card.setAttribute('data-added', 'false');
                addonsTotal -= price;
            } else {
                card.setAttribute('data-added', 'true');
                addonsTotal += price;
            }

            document.getElementById('addons-total').textContent = `₹${addonsTotal}`;
            document.getElementById('grand-total').textContent = `₹${basePrice + addonsTotal}`;
        }
    </script>
</body></html>
