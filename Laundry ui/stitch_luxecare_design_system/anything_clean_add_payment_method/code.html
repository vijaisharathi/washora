<body class="antialiased min-h-screen flex flex-col font-body-md bg-background text-on-background relative overflow-x-hidden">
<!-- Decorative Background Elements -->

<div class="absolute bottom-[-10%] left-[-10%] w-[500px] h-[500px] rounded-full bg-primary/5 blur-[100px]"></div>
</div>
<!-- Main Content Canvas -->

<div class="w-full max-w-[480px] flex flex-col gap-lg">

<button class="w-10 h-10 rounded-full flex items-center justify-center hover:bg-surface-container transition-colors border border-transparent hover:border-outline-variant/30 text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<div>
<h1 class="font-h1 text-h1 text-on-surface">Add Payment Method</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-xs">Anything Clean Checkout</p>
</div>
</div>
<!-- Form Card -->
<form class="glass-card rounded-xl p-lg flex flex-col gap-lg">
<!-- Card Display Mockup -->
<div class="w-full h-48 rounded-lg bg-gradient-to-br from-surface-container-high to-surface-container relative overflow-hidden border border-outline-variant/20 p-md flex flex-col justify-between shadow-lg">
<div class="absolute top-0 right-0 w-32 h-32 bg-primary/10 rounded-full blur-[40px] translate-x-1/2 -translate-y-1/2 pointer-events-none"></div>
<div class="absolute bottom-0 left-0 w-24 h-24 bg-electric-violet/10 rounded-full blur-[30px] -translate-x-1/3 translate-y-1/3 pointer-events-none"></div>
<div class="flex justify-between items-start relative z-10">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="contactless">contactless</span>
<div class="flex gap-2">
<div class="w-8 h-8 rounded-full bg-red-500/80 mix-blend-screen relative left-2"></div>
<div class="w-8 h-8 rounded-full bg-yellow-500/80 mix-blend-screen"></div>
</div>
</div>
<div class="relative z-10 mt-auto">
<div class="font-mono-display text-mono-display text-on-surface tracking-[0.15em] mb-sm opacity-80" id="card-display">
                            •••• •••• •••• ••••
                        </div>
<div class="flex justify-between items-end">
<div>
<div class="font-caption text-caption text-on-surface-variant uppercase tracking-wider mb-xs">Cardholder</div>
<div class="font-label-md text-label-md text-on-surface truncate w-32 opacity-90" id="name-display">JOHN DOE</div>
</div>
<div>
<div class="font-caption text-caption text-on-surface-variant uppercase tracking-wider mb-xs">Expires</div>
<div class="font-label-md text-label-md text-on-surface opacity-90" id="expiry-display">MM/YY</div>
</div>
</div>
</div>
</div>
<!-- Inputs -->
<div class="flex flex-col gap-md">
<!-- Card Number -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="cardNumber">Card Number</label>
<div class="relative flex items-center group input-glow rounded-lg border border-outline-variant/50 bg-surface-container-low transition-all">
<span class="material-symbols-outlined absolute left-md text-on-surface-variant" data-icon="credit_card">credit_card</span>
<input class="w-full bg-transparent border-none py-sm pl-[48px] pr-md text-on-surface font-body-md placeholder:text-on-surface-variant/50 focus:ring-0 focus:outline-none" id="cardNumber" maxlength="19" placeholder="4242 4242 4242 4242" type="text"/>
</div>
</div>

<div class="flex gap-md">

<label class="font-label-md text-label-md text-on-surface-variant" for="expiry">Expiry (MM/YY)</label>

<span class="material-symbols-outlined absolute left-md text-on-surface-variant" data-icon="calendar_month">calendar_month</span>
<input class="w-full bg-transparent border-none py-sm pl-[48px] pr-md text-on-surface font-body-md placeholder:text-on-surface-variant/50 focus:ring-0 focus:outline-none" id="expiry" maxlength="5" placeholder="MM/YY" type="text"/>
</div>
</div>

<input class="w-full bg-transparent border-none py-sm pl-[48px] pr-md text-on-surface font-body-md placeholder:text-on-surface-variant/50 focus:ring-0 focus:outline-none" id="cvv" maxlength="4" placeholder="123" type="text"/>
<span class="material-symbols-outlined absolute right-md text-on-surface-variant/50 text-sm cursor-help" data-icon="info" title="3 or 4 digits on the back of your card">info</span>
</div>
</div>
</div>
<!-- Name on Card -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="cardName">Cardholder Name</label>
<div class="relative flex items-center group input-glow rounded-lg border border-outline-variant/50 bg-surface-container-low transition-all">
<span class="material-symbols-outlined absolute left-md text-on-surface-variant" data-icon="person">person</span>
<input class="w-full bg-transparent border-none py-sm pl-[48px] pr-md text-on-surface font-body-md placeholder:text-on-surface-variant/50 focus:ring-0 focus:outline-none" id="cardName" placeholder="Name as it appears on card" type="text"/>
</div>

</div>
</div>

<!-- Security Message & CTA -->
<div class="flex flex-col gap-md">
<div class="flex items-start gap-sm p-sm rounded-lg bg-surface-container-low/50 border border-outline-variant/20">
<span class="material-symbols-outlined text-success-green mt-xs" data-icon="verified_user">verified_user</span>
<p class="font-caption text-caption text-on-surface-variant">Your payment information is securely handled by the payment provider. Anything Clean does not store your full card details.</p>
</div>
<button class="w-full py-md px-xl bg-electric-violet hover:bg-primary-container text-white font-label-md font-bold text-label-md rounded-lg shadow-lg shadow-primary/20 transition-all duration-200 active:scale-[0.98] flex items-center justify-center gap-sm group" type="button">
<span class="material-symbols-outlined group-hover:translate-x-1 transition-transform" data-icon="lock_open">lock_open</span>
                    Pay ₹502
                </button>
</div>

</main>
<script>
        // Simple input formatting script for visual feedback
        const ccInput = document.getElementById('cardNumber');
        const ccDisplay = document.getElementById('card-display');
        
        ccInput.addEventListener('input', function (e) {
            let val = e.target.value.replace(/\D/g, '');
            let formatted = '';
            for (let i = 0; i < val.length; i++) {
                if (i > 0 && i % 4 === 0) formatted += ' ';
                formatted += val[i];
            }
            e.target.value = formatted;
            ccDisplay.textContent = formatted || '•••• •••• •••• ••••';
            if(!formatted) ccDisplay.classList.add('opacity-80');
            else ccDisplay.classList.remove('opacity-80');
        });

        const expInput = document.getElementById('expiry');
        const expDisplay = document.getElementById('expiry-display');
        
        expInput.addEventListener('input', function (e) {
            let val = e.target.value.replace(/\D/g, '');
            if (val.length > 2) {
                val = val.substring(0, 2) + '/' + val.substring(2);
            }
            e.target.value = val;
            expDisplay.textContent = val || 'MM/YY';
        });

        const nameInput = document.getElementById('cardName');
        const nameDisplay = document.getElementById('name-display');
        
        nameInput.addEventListener('input', function (e) {
            nameDisplay.textContent = e.target.value.toUpperCase() || 'JOHN DOE';
        });
        
        const cvvInput = document.getElementById('cvv');
        cvvInput.addEventListener('input', function (e) {
            e.target.value = e.target.value.replace(/\D/g, '');
        });
    </script>
</body></html>
