<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Bank / Payout Details - Delivery Pro</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-fixed-dim": "#dcb8ff",
                        "on-surface": "#e5e2e3",
                        "on-secondary-container": "#b7b4b7",
                        "on-error": "#690005",
                        "inverse-primary": "#8422dc",
                        "on-secondary-fixed-variant": "#474649",
                        "primary-fixed": "#efdbff",
                        "on-tertiary-container": "#e3e0e2",
                        "surface-bright": "#3a393a",
                        "inverse-on-surface": "#313031",
                        "tertiary-container": "#646365",
                        "surface-container-low": "#1c1b1c",
                        "surface-container-lowest": "#0e0e0f",
                        "on-tertiary": "#303032",
                        "on-primary-fixed-variant": "#6700b5",
                        "on-primary-fixed": "#2c0051",
                        "inverse-surface": "#e5e2e3",
                        "surface-tint": "#dcb8ff",
                        "surface-variant": "#353436",
                        "on-secondary": "#303032",
                        "tertiary": "#c8c6c8",
                        "secondary-container": "#474649",
                        "on-tertiary-fixed": "#1b1b1d",
                        "surface": "#131314",
                        "on-background": "#e5e2e3",
                        "tertiary-fixed": "#e4e2e4",
                        "primary": "#dcb8ff",
                        "secondary-fixed-dim": "#c8c6c8",
                        "error-container": "#93000a",
                        "on-secondary-fixed": "#1b1b1d",
                        "outline-variant": "#4c4354",
                        "on-tertiary-fixed-variant": "#474649",
                        "background": "#131314",
                        "surface-dim": "#131314",
                        "primary-container": "#8a2be2",
                        "outline": "#988ca0",
                        "surface-container-highest": "#353436",
                        "on-primary": "#480081",
                        "secondary": "#c8c6c8",
                        "tertiary-fixed-dim": "#c8c6c8",
                        "error": "#ffb4ab",
                        "surface-container": "#201f20",
                        "on-primary-container": "#eed9ff",
                        "on-surface-variant": "#cfc2d7",
                        "secondary-fixed": "#e5e1e4",
                        "on-error-container": "#ffdad6",
                        "surface-container-high": "#2a2a2b"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "3xl": "64px",
                        "xl": "32px",
                        "lg": "24px",
                        "2xl": "48px",
                        "xs": "4px",
                        "sm": "8px",
                        "md": "16px"
                    },
                    "fontFamily": {
                        "body-md": ["Geist"],
                        "display-lg-mobile": ["Geist"],
                        "caption": ["Geist"],
                        "display-lg": ["Geist"],
                        "headline-md": ["Geist"],
                        "label-md": ["Geist"],
                        "headline-lg": ["Geist"],
                        "body-lg": ["Geist"]
                    },
                    "fontSize": {
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "display-lg-mobile": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "caption": ["12px", { "lineHeight": "16px", "fontWeight": "400" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],

                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            font-family: 'Geist', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        /* Custom Input Styles */
        input:focus {
            outline: none;
            box-shadow: none;
            border-color: #dcb8ff !important;
        }
        
        /* Floating Labels */
        .floating-input {
            transition: all 0.2s ease;
        }
        .floating-input:focus + label,
        .floating-input:not(:placeholder-shown) + label {
            transform: translateY(-24px) scale(0.85);
            color: #dcb8ff;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface antialiased min-h-screen flex flex-col items-center justify-center w-full max-w-[390px] mx-auto md:max-w-none md:p-8">
<!-- Mobile Container (Simulating 390px Device) -->
<main class="w-full h-full min-h-[844px] max-w-[390px] bg-background relative flex flex-col overflow-hidden shadow-2xl md:rounded-[32px] md:border border-white/5 md:h-[844px]">
<!-- TopAppBar (Transactional - Hidden Navigation Shell, Custom Back Header) -->
<header class="w-full px-md pt-12 pb-4 flex items-center justify-between z-10 sticky top-0 bg-background/90 backdrop-blur-md">
<button class="p-2 rounded-full hover:bg-surface-variant/50 transition-colors text-on-surface active:scale-95">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<div class="font-label-md text-label-md text-on-surface-variant">Step 5 of 6</div>
<div class="w-10"></div> <!-- Placeholder for balance -->
</header>
<!-- Progress Bar -->
<div class="w-full px-md mb-8">
<div class="h-1 w-full bg-surface-container rounded-full overflow-hidden">
<div class="h-full bg-primary rounded-full transition-all duration-500 ease-out" style="width: 83%;"></div>
</div>
</div>
<!-- Content Area -->
<div class="flex-1 px-md flex flex-col pb-safe scroll-smooth overflow-y-auto">
<div class="mb-10 animate-fade-in-up">
<h1 class="font-display-lg-mobile text-display-lg-mobile text-on-surface mb-2 tracking-tight">Set up your payouts</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Where should we send your earnings?</p>
</div>
<!-- Secure Badge -->
<div class="bg-surface-container-low rounded-xl p-4 mb-8 flex items-start gap-4 border border-white/5 shadow-sm">
<div class="p-2 bg-primary-container/20 rounded-full text-primary shrink-0 mt-0.5">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">lock</span>
</div>
<div>
<h3 class="font-label-md text-label-md text-on-surface mb-1">Bank-level Security</h3>
<p class="font-caption text-caption text-on-surface-variant">Your financial information is encrypted and securely stored. We never share these details.</p>
</div>
</div>
<!-- Form -->
<form class="flex flex-col gap-6 flex-1">
<!-- Account Holder Name -->
<div class="relative bg-surface rounded-xl border border-surface-variant focus-within:border-primary transition-colors">
<input class="floating-input peer w-full bg-transparent px-4 pt-6 pb-2 text-on-surface font-body-md text-body-md border-none focus:ring-0 rounded-xl" id="accHolder" placeholder=" " type="text"/>
<label class="absolute left-4 top-4 font-body-md text-body-md text-on-surface-variant transition-all origin-left pointer-events-none" for="accHolder">Account holder name</label>
</div>
<!-- Bank Name -->
<div class="relative bg-surface rounded-xl border border-surface-variant focus-within:border-primary transition-colors">
<input class="floating-input peer w-full bg-transparent px-4 pt-6 pb-2 text-on-surface font-body-md text-body-md border-none focus:ring-0 rounded-xl" id="bankName" placeholder=" " type="text"/>
<label class="absolute left-4 top-4 font-body-md text-body-md text-on-surface-variant transition-all origin-left pointer-events-none" for="bankName">Bank name</label>
</div>
<!-- Account Number -->
<div class="relative bg-surface rounded-xl border border-surface-variant focus-within:border-primary transition-colors">
<input class="floating-input peer w-full bg-transparent px-4 pt-6 pb-2 text-on-surface font-body-md text-body-md border-none focus:ring-0 rounded-xl" id="accNumber" inputmode="numeric" placeholder=" " type="password"/>
<label class="absolute left-4 top-4 font-body-md text-body-md text-on-surface-variant transition-all origin-left pointer-events-none" for="accNumber">Account number</label>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors p-1" onclick="toggleVisibility('accNumber')" type="button">
<span class="material-symbols-outlined" id="accNumber-icon" style="font-variation-settings: 'FILL' 0;">visibility_off</span>
</button>
</div>
<!-- IFSC Code -->
<div class="relative bg-surface rounded-xl border border-surface-variant focus-within:border-primary transition-colors">
<input class="floating-input peer w-full bg-transparent px-4 pt-6 pb-2 text-on-surface font-body-md text-body-md border-none focus:ring-0 rounded-xl uppercase" id="ifscCode" placeholder=" " type="text"/>
<label class="absolute left-4 top-4 font-body-md text-body-md text-on-surface-variant transition-all origin-left pointer-events-none" for="ifscCode">IFSC code</label>
<div class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant/50">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">account_balance</span>
</div>
</div>
<div class="mt-auto pt-8 pb-8">
<button class="w-full bg-primary text-on-primary font-label-md text-label-md font-bold py-4 rounded-xl hover:bg-primary-fixed transition-colors active:scale-95 shadow-[0_0_20px_rgba(220,184,255,0.15)] flex items-center justify-center gap-2" type="button">
<span>Save & Continue</span>
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
</div>
</form>
</div>
</main>
<script>
        // Micro-interaction: Toggle password visibility
        function toggleVisibility(inputId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(inputId + '-icon');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility';
            } else {
                input.type = 'password';
                icon.textContent = 'visibility_off';
            }
        }
    </script>
</body></html>
