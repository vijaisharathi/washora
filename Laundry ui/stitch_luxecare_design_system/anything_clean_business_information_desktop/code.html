<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Business Information Onboarding</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

            darkMode: "class",

                extend: {

                        "surface-container-highest": "#353436",
                        "secondary-fixed": "#e5e1e4",
                        "on-primary": "#480081",
                        "on-tertiary-fixed-variant": "#474649",
                        "tertiary": "#c8c6c8",
                        "on-secondary": "#303032",
                        "surface-dim": "#131314",
                        "tertiary-container": "#646365",
                        "surface-container-high": "#2a2a2b",
                        "tertiary-fixed-dim": "#c8c6c8",
                        "primary": "#dcb8ff",
                        "inverse-surface": "#e5e2e3",
                        "tertiary-fixed": "#e4e2e4",
                        "secondary-fixed-dim": "#c8c6c8",
                        "on-tertiary-container": "#e3e0e2",
                        "on-tertiary": "#303032",
                        "surface-tint": "#dcb8ff",

                    },
                    borderRadius: {

                    fontFamily: {

<style>
        body {
            font-family: 'Geist', sans-serif;
            background-color: #0A0A0B;
            color: #e5e2e3;
        }
        .glass-panel {
            background: rgba(18, 18, 20, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .form-input {
            background-color: #1c1b1c;
            border: 1px solid transparent;
            color: #e5e2e3;
            transition: all 0.2s ease-in-out;
        }
        .form-input:focus {
            outline: none;
            border-color: #8a2be2;
            box-shadow: 0 0 0 1px #8a2be2;
        }
        
        .upload-area {
            border: 1px dashed rgba(255, 255, 255, 0.2);
            transition: all 0.2s ease;
        }
        .upload-area:hover {
            border-color: #dcb8ff;
            background-color: rgba(220, 184, 255, 0.05);
        }
        
        .progress-line {
            height: 2px;
            background-color: rgba(255, 255, 255, 0.1);
            position: relative;
        }
        .progress-line::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 28.5%; /* Step 2 of 7 */
            background-color: #dcb8ff;
            box-shadow: 0 0 8px #dcb8ff;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-md md:p-2xl relative overflow-x-hidden">
<!-- Decorative ambient background -->
<div class="fixed inset-0 z-0 pointer-events-none opacity-20" style="background: radial-gradient(circle at top right, #8a2be2 0%, transparent 40%), radial-gradient(circle at bottom left, #480081 0%, transparent 40%);"></div>
<div class="w-full max-w-[800px] z-10 glass-panel rounded-xl p-lg md:p-2xl shadow-[0_8px_32px_rgba(138,43,226,0.05)]">
<!-- Header & Progress -->
<div class="mb-2xl">
<div class="flex justify-between items-end mb-sm">
<div>
<h1 class="font-headline-lg text-headline-lg md:font-display-lg md:text-display-lg text-primary mb-xs">Business Information</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Tell us about your services.</p>
</div>
<div class="text-right">
<span class="font-label-md text-label-md text-primary">Step 2 of 7</span>
</div>
</div>
<div class="progress-line w-full rounded-full"></div>
</div>
<form class="space-y-xl">
<!-- Basic Info Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-lg">
<div class="space-y-sm">
<label class="font-label-md text-label-md text-on-surface block">Business Name *</label>
<input class="form-input w-full rounded-lg px-md py-sm font-body-md text-body-md h-[48px]" placeholder="e.g. Pristine Cleaners LLC" type="text"/>
</div>
<div class="space-y-sm">
<label class="font-label-md text-label-md text-on-surface block">Business Type *</label>
<div class="relative">
<select class="form-input w-full rounded-lg px-md py-sm font-body-md text-body-md h-[48px] appearance-none cursor-pointer">
<option disabled="" selected="" value="">Select category...</option>
<option value="residential">Residential Cleaning</option>
<option value="commercial">Commercial Cleaning</option>
<option value="specialty">Specialty Services (Carpet, Windows)</option>
<option value="full">Full Service Management</option>
</select>
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
</div>
</div>
<!-- Description -->
<div class="space-y-sm">
<label class="font-label-md text-label-md text-on-surface block">Business Description</label>
<textarea class="form-input w-full rounded-lg px-md py-sm font-body-md text-body-md min-h-[120px] resize-y" placeholder="Briefly describe your services, specialties, and what makes your business unique..."></textarea>
<p class="font-caption text-caption text-on-surface-variant text-right">0/500</p>
</div>
<!-- Contact & Meta Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-lg">
<div class="space-y-sm">
<label class="font-label-md text-label-md text-on-surface block">Years in Business</label>
<input class="form-input w-full rounded-lg px-md py-sm font-body-md text-body-md h-[48px]" min="0" placeholder="e.g. 5" type="number"/>
</div>
<div class="space-y-sm">
<label class="font-label-md text-label-md text-on-surface block">Contact Number *</label>
<input class="form-input w-full rounded-lg px-md py-sm font-body-md text-body-md h-[48px]" placeholder="+1 (555) 000-0000" type="tel"/>
</div>
<div class="space-y-sm">
<label class="font-label-md text-label-md text-on-surface block">Business Email *</label>
<input class="form-input w-full rounded-lg px-md py-sm font-body-md text-body-md h-[48px]" placeholder="hello@yourbusiness.com" type="email"/>
</div>
<div class="space-y-sm">
<label class="font-label-md text-label-md text-on-surface block">Website / Social Link</label>
<input class="form-input w-full rounded-lg px-md py-sm font-body-md text-body-md h-[48px]" placeholder="https://" type="url"/>
</div>
</div>
<!-- Media Uploads -->
<div class="space-y-lg pt-md">
<h3 class="font-headline-md text-headline-md text-on-surface">Brand Imagery</h3>
<div class="grid grid-cols-1 md:grid-cols-3 gap-lg">
<!-- Logo Upload -->
<div class="col-span-1 space-y-sm">
<label class="font-label-md text-label-md text-on-surface block">Business Logo</label>
<div class="upload-area rounded-lg h-[160px] flex flex-col items-center justify-center bg-surface-container-low cursor-pointer relative overflow-hidden group">
<span class="material-symbols-outlined text-[32px] text-on-surface-variant mb-sm group-hover:text-primary transition-colors" data-weight="fill">add_photo_alternate</span>
<span class="font-caption text-caption text-on-surface-variant group-hover:text-primary transition-colors text-center px-sm">Upload Logo<br/>(1:1 Ratio)</span>
<input accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer" type="file"/>
</div>
</div>
<!-- Cover Image Upload -->
<div class="col-span-1 md:col-span-2 space-y-sm">
<label class="font-label-md text-label-md text-on-surface block">Cover Image</label>
<div class="upload-area rounded-lg h-[160px] flex flex-col items-center justify-center bg-surface-container-low cursor-pointer relative overflow-hidden group">
<span class="material-symbols-outlined text-[32px] text-on-surface-variant mb-sm group-hover:text-primary transition-colors" data-weight="fill">wallpaper</span>
<span class="font-caption text-caption text-on-surface-variant group-hover:text-primary transition-colors text-center">Upload high-quality cover photo<br/>(16:9 Recommended)</span>
<input accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer" type="file"/>
</div>
</div>
</div>
</div>
<!-- Actions -->
<div class="flex justify-between items-center pt-2xl mt-xl border-t border-white/5">
<button class="font-label-md text-label-md px-lg py-sm rounded-full text-on-surface-variant hover:text-on-surface transition-colors" type="button">
                    Back
                </button>
<button class="bg-primary-container text-on-primary-container font-label-md text-label-md px-xl py-md rounded-full hover:bg-primary transition-colors flex items-center gap-sm" type="button">
                    Continue to Services
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</form>
</div>
</body></html>
