<style>
        /* Custom Styles for Inputs and Map */
        .input-glass {
            background-color: rgba(35, 34, 36, 0.5); /* surface-variant slightly transparent */
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #e5e2e3; /* on-surface */
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }
        .input-glass:focus {
            outline: none;
            border-color: #dcb8ff; /* primary */
            box-shadow: 0 0 0 1px #dcb8ff;
        }
        .input-glass::placeholder {
            color: #cfc2d7; /* on-surface-variant */
            opacity: 0.7;
        }

        .map-container {
            position: relative;
            border-radius: 0.75rem; /* xl */
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .map-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.7) contrast(1.2); /* Dark mode map simulation */
        }

        .draggable-pin {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -100%);
            cursor: grab;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.5));
            z-index: 10;
        }
        
        .draggable-pin:active {
            cursor: grabbing;
        }

        .radius-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 2px solid rgba(220, 184, 255, 0.4); /* primary tint */
            background-color: rgba(220, 184, 255, 0.1);
            border-radius: 50%;
            pointer-events: none;
            transition: width 0.3s ease, height 0.3s ease;
        }

        /* Radius Selector Buttons */
        .radius-btn {
            background-color: transparent;
            border: 1px solid #4c4354; /* outline-variant */
            color: #e5e2e3; /* on-surface */
            transition: all 0.2s ease;
        }
        .radius-btn.active {
            background-color: #8a2be2; /* primary-container */
            border-color: #8a2be2;
            color: #eed9ff; /* on-primary-container */
        }
        
        /* Stepper */
        .stepper-line {
            height: 2px;
            background: linear-gradient(to right, #dcb8ff 50%, #353436 50%);
            background-size: 200% 100%;
            background-position: right bottom;
            transition: all 0.5s ease-out;
        }
    </style>

<!-- Main Content Container -->
<main class="w-full max-w-[1024px] mx-auto flex flex-col md:flex-row gap-2xl">
<!-- Left Column: Form -->

<!-- Stepper -->

<span>Services</span>

<div class="h-full bg-primary w-1/3 rounded-full relative shadow-[0_0_10px_rgba(220,184,255,0.5)]"></div>
</div>
</div>
<div class="mb-lg">

<p class="font-body-md text-body-md text-on-surface-variant">Customers within this area can discover your business. A precise location helps match you with the right local clients.</p>

<script>
        // Simple script to handle radius button clicks and simulate map radius change
        document.addEventListener('DOMContentLoaded', () => {
            const buttons = document.querySelectorAll('.radius-btn[data-radius]');
            const radiusRing = document.getElementById('map-radius-ring');
            
            // Base pixel size for 1km in this simulated map
            const baseSize = 30; 

            buttons.forEach(button => {
                button.addEventListener('click', (e) => {
                    // Remove active class from all
                    buttons.forEach(btn => btn.classList.remove('active'));
                    // Add active class to clicked
                    e.target.classList.add('active');
                    
                    // Update simulated ring size
                    const radius = parseInt(e.target.getAttribute('data-radius'));
                    const newSize = baseSize * radius;
                    
                    // Cap visual size to keep it in container for demo
                    const cappedSize = Math.min(newSize, 400);
                    
                    radiusRing.style.width = `${cappedSize}px`;
                    radiusRing.style.height = `${cappedSize}px`;
                });
            });
        });
    </script>
