<style>
        body {
            background-color: #131314;
            color: #e5e2e3;
        }
        /* Custom radio button styling */
        .radio-custom:checked + label .radio-indicator {
            border-color: #dcb8ff;
            background-color: #1c1b1c; /* surface-container-low */
        }
        .radio-custom:checked + label .radio-indicator::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #dcb8ff;
        }

    body {
      min-height: max(884px, 100dvh);

<body class="flex justify-center bg-background min-h-screen">
<!-- Main Mobile Container (390px) -->
<main class="w-[390px] h-full min-h-screen bg-surface-dim relative flex flex-col shadow-2xl border-x border-outline-variant/20">
<!-- Header: Linear flow, non-global nav -->
<header class="flex items-center px-lg h-16 w-full border-b border-outline-variant/30 bg-surface-dim/90 backdrop-blur-sm sticky top-0 z-40">
<button aria-label="Go Back" class="text-on-surface hover:text-primary transition-colors active:scale-95 p-xs rounded-full" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="flex-1 text-center font-h3 text-h3 text-on-surface mr-8">Cancel Delivery</h1>
</header>
<!-- Content Canvas -->
<div class="flex-1 flex flex-col p-lg gap-lg overflow-y-auto pb-3xl">
<section class="flex flex-col gap-sm">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Tell us why you cannot complete this delivery.
                </p>
</section>
<!-- Reason Options (Radio List) -->
<section class="flex flex-col gap-xs bg-surface-container rounded-xl p-xs border border-outline-variant/20 shadow-sm">
<!-- Option 1 -->
<div class="relative">
<input class="radio-custom sr-only peer" id="reason_vehicle" name="cancel_reason" type="radio" value="vehicle_issue"/>
<label class="flex items-center gap-md p-md rounded-lg cursor-pointer hover:bg-surface-container-high transition-colors peer-checked:bg-surface-container-high peer-checked:border-primary/50 border border-transparent" for="reason_vehicle">
<div class="radio-indicator relative w-5 h-5 rounded-full border-2 border-outline-variant transition-colors flex-shrink-0"></div>
<span class="material-symbols-outlined text-on-surface-variant" style="font-variation-settings: 'FILL' 0;">car_crash</span>
<span class="font-body-md text-body-md text-on-surface">Vehicle Issue</span>
</label>
</div>
<!-- Option 2 -->
<div class="relative">
<input class="radio-custom sr-only peer" id="reason_pickup" name="cancel_reason" type="radio" value="unable_pickup"/>
<label class="flex items-center gap-md p-md rounded-lg cursor-pointer hover:bg-surface-container-high transition-colors peer-checked:bg-surface-container-high peer-checked:border-primary/50 border border-transparent" for="reason_pickup">
<div class="radio-indicator relative w-5 h-5 rounded-full border-2 border-outline-variant transition-colors flex-shrink-0"></div>
<span class="material-symbols-outlined text-on-surface-variant" style="font-variation-settings: 'FILL' 0;">store_mall_directory</span>
<span class="font-body-md text-body-md text-on-surface">Unable to Reach Pickup</span>
</label>
</div>
<!-- Option 3 -->
<div class="relative">
<input class="radio-custom sr-only peer" id="reason_customer" name="cancel_reason" type="radio" value="unable_customer"/>
<label class="flex items-center gap-md p-md rounded-lg cursor-pointer hover:bg-surface-container-high transition-colors peer-checked:bg-surface-container-high peer-checked:border-primary/50 border border-transparent" for="reason_customer">
<div class="radio-indicator relative w-5 h-5 rounded-full border-2 border-outline-variant transition-colors flex-shrink-0"></div>
<span class="material-symbols-outlined text-on-surface-variant" style="font-variation-settings: 'FILL' 0;">person_off</span>
<span class="font-body-md text-body-md text-on-surface">Unable to Reach Customer</span>
</label>
</div>
<!-- Option 4 -->
<div class="relative">
<input class="radio-custom sr-only peer" id="reason_safety" name="cancel_reason" type="radio" value="safety_issue"/>
<label class="flex items-center gap-md p-md rounded-lg cursor-pointer hover:bg-surface-container-high transition-colors peer-checked:bg-surface-container-high peer-checked:border-primary/50 border border-transparent" for="reason_safety">
<div class="radio-indicator relative w-5 h-5 rounded-full border-2 border-outline-variant transition-colors flex-shrink-0"></div>
<span class="material-symbols-outlined text-error" style="font-variation-settings: 'FILL' 0;">health_and_safety</span>
<span class="font-body-md text-body-md text-on-surface">Safety Issue</span>
</label>
</div>
<!-- Option 5 -->
<div class="relative">
<input class="radio-custom sr-only peer" id="reason_info" name="cancel_reason" type="radio" value="incorrect_info"/>
<label class="flex items-center gap-md p-md rounded-lg cursor-pointer hover:bg-surface-container-high transition-colors peer-checked:bg-surface-container-high peer-checked:border-primary/50 border border-transparent" for="reason_info">
<div class="radio-indicator relative w-5 h-5 rounded-full border-2 border-outline-variant transition-colors flex-shrink-0"></div>
<span class="material-symbols-outlined text-on-surface-variant" style="font-variation-settings: 'FILL' 0;">wrong_location</span>
<span class="font-body-md text-body-md text-on-surface">Incorrect Information</span>
</label>
</div>
<!-- Option 6 -->
<div class="relative">
<input checked="" class="radio-custom sr-only peer" id="reason_other" name="cancel_reason" type="radio" value="other"/>
<label class="flex items-center gap-md p-md rounded-lg cursor-pointer hover:bg-surface-container-high transition-colors peer-checked:bg-surface-container-high peer-checked:border-primary/50 border border-transparent" for="reason_other">
<div class="radio-indicator relative w-5 h-5 rounded-full border-2 border-outline-variant transition-colors flex-shrink-0"></div>
<span class="material-symbols-outlined text-on-surface-variant" style="font-variation-settings: 'FILL' 0;">more_horiz</span>
<span class="font-body-md text-body-md text-on-surface">Other</span>
</label>
</div>
</section>
<!-- Details Text Area -->
<section class="flex flex-col gap-xs mt-sm">
<label class="sr-only" for="details">Details</label>
<textarea class="w-full bg-surface-container-low border border-outline-variant/50 rounded-lg p-md text-on-surface font-body-md text-body-md focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-colors placeholder-on-surface-variant" id="details" name="details" placeholder="Details..." rows="4"></textarea>
</section>
<!-- Warning Callout -->
<div class="flex items-start gap-md bg-error-container/10 border border-error/30 rounded-xl p-md mt-sm">
<span class="material-symbols-outlined text-error mt-xs" style="font-variation-settings: 'FILL' 1;">warning</span>
<p class="font-caption text-caption text-on-surface-variant leading-relaxed">
                    Cancellation may affect your partner performance rating.
                </p>
</div>
</div>
<!-- Sticky Bottom Actions -->
<div class="mt-auto bg-surface border-t border-outline-variant/30 p-lg pb-safe shadow-[0_-4px_16px_rgba(0,0,0,0.5)] z-40">
<div class="flex flex-col gap-md">
<button class="w-full h-12 bg-error text-on-error font-label-md text-label-md font-bold rounded-lg shadow-lg shadow-error/10 hover:bg-error-red transition-all active:scale-[0.98] flex items-center justify-center gap-sm" type="button">
                    Request Cancellation
                </button>
<button class="w-full h-12 bg-transparent border border-outline-variant text-primary font-label-md text-label-md font-bold rounded-lg hover:bg-surface-container transition-colors active:scale-[0.98] flex items-center justify-center gap-sm" type="button">
                    Keep Delivery
                </button>
</div>
</div>
</main>
</body></html>
