<body class="bg-background text-on-surface w-[390px] mx-auto min-h-screen flex flex-col overflow-x-hidden">
<!-- Top Navigation (Task Focused, hides BottomNav) -->
<header class="fixed top-0 w-full z-50 bg-surface-dim/80 backdrop-blur-md border-b border-outline-variant/30 flex justify-between items-center px-lg h-16 w-[390px] mx-auto">
<button class="text-primary hover:bg-surface-container-high transition-colors active:scale-95 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-h3 text-h3 font-bold text-on-surface">Delivery Details</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 mt-16 px-md py-lg flex flex-col gap-lg pb-32">
<!-- Customer & Destination Card -->
<section class="bg-surface-container border border-outline-variant/20 rounded-xl p-md flex flex-col gap-md">
<div class="flex items-center justify-between">
<div>
<p class="font-caption text-caption text-on-surface-variant">Customer</p>
<p class="font-body-md text-body-md font-semibold text-on-surface">Arun</p>
</div>
<div class="h-10 w-10 bg-primary-container/20 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-primary" data-icon="person">person</span>
</div>
</div>
<div class="w-full h-px bg-outline-variant/30"></div>
<div>
<p class="font-caption text-caption text-on-surface-variant mb-xs">Destination</p>
<div class="flex items-start gap-sm">
<span class="material-symbols-outlined text-primary mt-1" data-icon="location_on" style="font-variation-settings: 'FILL' 1;">location_on</span>
<p class="font-body-md text-body-md text-on-surface">Anna Nagar</p>
</div>
</div>
<!-- Large Navigate Action -->
<button class="w-full mt-sm py-sm px-md bg-surface-container-high hover:bg-surface-container-highest border border-outline-variant/50 rounded-lg flex items-center justify-center gap-sm transition-colors group">
<span class="material-symbols-outlined text-primary group-hover:text-electric-violet transition-colors" data-icon="navigation">navigation</span>
<span class="font-label-md text-label-md font-bold text-on-surface">Navigate</span>
</button>
</section>
<!-- Communication Section -->
<section class="flex flex-col gap-sm">
<button class="w-full py-md px-md bg-surface-container border border-outline-variant/20 hover:border-primary/50 rounded-xl flex items-center justify-between transition-all group">
<div class="flex items-center gap-md">
<div class="h-10 w-10 bg-surface-container-high rounded-full flex items-center justify-center group-hover:bg-primary-container/20 transition-colors">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors" data-icon="call">call</span>
</div>
<span class="font-label-md text-label-md font-semibold text-on-surface">Contact Customer</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant" data-icon="chevron_right">chevron_right</span>
</button>
</section>
<!-- Order Card -->
<section class="bg-surface-container border border-outline-variant/20 rounded-xl p-md flex flex-col gap-md relative overflow-hidden">
<!-- Subtle accent line -->
<div class="absolute left-0 top-0 bottom-0 w-1 bg-electric-violet"></div>
<div class="flex justify-between items-start">
<div>
<p class="font-caption text-caption text-on-surface-variant mb-xs">Order ID</p>
<p class="font-mono-display text-mono-display text-on-surface tracking-tight">QH-20260902-1041</p>
</div>
<div class="bg-surface-container-high px-sm py-xs rounded flex items-center gap-xs">
<span class="material-symbols-outlined text-caption text-primary" data-icon="inventory_2" style="font-variation-settings: 'FILL' 1;">inventory_2</span>
<span class="font-caption text-caption font-bold text-on-surface">1 Pair</span>
</div>
</div>
<div class="bg-surface-container-low rounded-lg p-sm border border-outline-variant/30 flex items-center gap-md">
<div class="w-12 h-12 bg-surface-dim rounded-md flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="cleaning_services">cleaning_services</span>
</div>
<div>
<p class="font-label-md text-label-md font-bold text-on-surface">Sneaker Deep Clean</p>
</div>
</div>
</section>
<!-- Delivery Instructions -->
<section class="bg-surface-container border border-outline-variant/20 rounded-xl p-md flex flex-col gap-sm">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-electric-violet" data-icon="info">info</span>
<h3 class="font-label-md text-label-md font-bold text-on-surface">Delivery Instructions</h3>
</div>
<p class="font-body-md text-body-md text-on-surface-variant italic border-l-2 border-outline-variant pl-sm ml-sm mt-xs">
                "Please hand the package directly to the customer."
            </p>
</section>
</main>
<!-- Sticky Primary Footer CTA -->
<div class="fixed bottom-0 w-full bg-surface-dim/95 backdrop-blur-md border-t border-outline-variant/30 p-lg w-[390px] mx-auto z-50 pb-safe shadow-[0_-10px_40px_rgba(0,0,0,0.5)]">
<button class="w-full bg-electric-violet text-on-primary font-h3 text-h3 font-bold py-md rounded-xl shadow-lg shadow-electric-violet/20 active:scale-[0.98] transition-transform flex items-center justify-center gap-sm">
<span class="material-symbols-outlined" data-icon="check_circle">check_circle</span>
            Arrived
        </button>
