<body class="bg-background text-on-background min-h-screen flex flex-col antialiased w-full max-w-[390px] mx-auto relative overflow-x-hidden">
<!-- Header -->
<header class="flex items-center justify-between px-md h-16 w-full max-w-full bg-surface/80 backdrop-blur-xl border-b border-white/5 shadow-sm sticky top-0 z-50">
<button class="text-on-surface-variant hover:opacity-80 transition-all duration-200 active:scale-95 p-2 -ml-2 rounded-full">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="flex flex-col items-center">
<h1 class="font-headline-md text-[18px] leading-[24px] font-bold text-primary">Delivery declined</h1>
<span class="font-caption text-caption text-on-surface-variant">Order #QH1024</span>
</div>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content -->
<main class="flex-1 flex flex-col px-[20px] py-lg gap-lg overflow-y-auto pb-[100px]">
<!-- Context Message -->
<div class="bg-surface-container-low p-md rounded-xl border border-white/5 flex gap-md items-start">
<span class="material-symbols-outlined text-error mt-1">warning</span>
<p class="font-body-md text-body-md text-on-surface">Customer does not want to accept this order.</p>
</div>
<!-- Reason Selector -->
<section class="flex flex-col gap-sm">
<h2 class="font-label-md text-label-md text-on-surface-variant mb-xs uppercase tracking-wider">Select Reason</h2>
<div class="flex flex-col gap-xs">
<label class="flex items-center gap-md p-md bg-surface-container rounded-lg border border-transparent hover:border-primary/30 transition-colors cursor-pointer group">
<input class="w-5 h-5 text-primary bg-surface-container-high border-outline focus:ring-primary focus:ring-offset-surface" name="reason" type="radio"/>
<span class="font-body-md text-body-md text-on-surface group-hover:text-primary transition-colors">Wrong item</span>
</label>
<label class="flex items-center gap-md p-md bg-surface-container rounded-lg border border-transparent hover:border-primary/30 transition-colors cursor-pointer group">
<input class="w-5 h-5 text-primary bg-surface-container-high border-outline focus:ring-primary focus:ring-offset-surface" name="reason" type="radio"/>
<span class="font-body-md text-body-md text-on-surface group-hover:text-primary transition-colors">Package damaged</span>
</label>
<label class="flex items-center gap-md p-md bg-surface-container rounded-lg border border-transparent hover:border-primary/30 transition-colors cursor-pointer group">
<input class="w-5 h-5 text-primary bg-surface-container-high border-outline focus:ring-primary focus:ring-offset-surface" name="reason" type="radio"/>
<span class="font-body-md text-body-md text-on-surface group-hover:text-primary transition-colors">Order cancelled</span>
</label>
<label class="flex items-center gap-md p-md bg-surface-container rounded-lg border border-transparent hover:border-primary/30 transition-colors cursor-pointer group">
<input class="w-5 h-5 text-primary bg-surface-container-high border-outline focus:ring-primary focus:ring-offset-surface" name="reason" type="radio"/>
<span class="font-body-md text-body-md text-on-surface group-hover:text-primary transition-colors">Customer changed mind</span>
</label>
<label class="flex items-center gap-md p-md bg-surface-container rounded-lg border border-transparent hover:border-primary/30 transition-colors cursor-pointer group">
<input class="w-5 h-5 text-primary bg-surface-container-high border-outline focus:ring-primary focus:ring-offset-surface" name="reason" type="radio"/>
<span class="font-body-md text-body-md text-on-surface group-hover:text-primary transition-colors">Other</span>
</label>
</div>
</section>
<!-- Possession Toggle -->
<section class="bg-surface-container p-md rounded-xl border border-white/5 flex items-center justify-between">
<span class="font-body-md text-body-md text-on-surface w-2/3">Is the package still in your possession?</span>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-surface-container-highest peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
</label>
</section>

<button class="w-full h-[120px] bg-surface-container-high border border-dashed border-outline-variant rounded-xl flex flex-col items-center justify-center gap-xs text-on-surface-variant hover:bg-surface-container-highest hover:border-primary/50 transition-all">

<div class="fixed bottom-0 w-full max-w-[390px] p-[20px] bg-surface/90 backdrop-blur-2xl border-t border-white/5 shadow-lg z-50">
