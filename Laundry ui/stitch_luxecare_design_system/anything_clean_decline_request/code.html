<!DOCTYPE html>

<html class="dark" lang="en"><head>

<style>
        .glass-panel {
            background: rgba(18, 18, 20, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 -8px 32px 0 rgba(138, 43, 226, 0.1);
        }
        
        .radio-custom:checked + div {
            border-color: #dcb8ff;
            background-color: rgba(220, 184, 255, 0.1);
        }
        
        .radio-custom:checked + div .radio-inner {
            background-color: #dcb8ff;
            transform: scale(1);
        }
        
        .radio-inner {
            transform: scale(0);
            transition: transform 0.2s ease-in-out;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen relative overflow-hidden font-body-md select-none">
<!-- Dimmed Background (Simulating Request Details Screen) -->
<div class="absolute inset-0 opacity-40 blur-sm flex flex-col pointer-events-none">
<!-- Mock Map Area -->
<div class="h-2/5 bg-surface-container-high w-full relative" data-alt="A detailed, modern dark mode map interface showing a city grid with glowing neon purple and blue routes. The style is sleek, cyber-inspired, and high-tech, fitting a premium service app. Subtle highlights mark key intersections, creating a sense of dynamic movement across the urban landscape. 8k resolution, ui elements removed." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDsSwv4yDOOsdbgbgiGnRkVmt08n26g_ZbjAiIzFmAsKG8tnr5I2nQgTEmnJvnFOgXa6bOO2PR4OEjn6KcJz-5NPgH_YXnWOtVPY7r91MZMKzT_i0Q48tnITmodePBEMmoLqJhLG-R-BbIyJRgShYi6-l-ft89urgPF5bk1j0ghdN7-Bc4hrMt-9-ySOrrSeIDy4AWs2vif8HKlpRiiaiC1sNO8MwoJPkfW5o_KFZto5qGuW6KHGUjTow')"></div>
<!-- Mock Details Area -->
<div class="h-3/5 bg-surface p-lg flex flex-col gap-md">
<div class="w-1/3 h-8 bg-surface-container-high rounded animate-pulse"></div>
<div class="w-full h-24 bg-surface-container-highest rounded-lg animate-pulse"></div>
<div class="w-2/3 h-6 bg-surface-container-high rounded animate-pulse"></div>
</div>
</div>
<!-- Modal Overlay -->
<div class="absolute inset-0 bg-black/60 z-40 transition-opacity flex flex-col justify-end">
<!-- Bottom Sheet -->
<div class="glass-panel w-full rounded-t-3xl pt-sm pb-safe px-md flex flex-col animate-[slideUp_0.3s_ease-out]">
<!-- Drag Handle -->
<div class="w-12 h-1.5 bg-surface-variant rounded-full mx-auto my-md"></div>
<!-- Header -->
<div class="mb-lg px-sm">
<h2 class="font-headline-md text-headline-md text-on-surface mb-xs">Why are you declining?</h2>
<p class="font-body-md text-body-md text-on-surface-variant">You can continue receiving other requests.</p>
</div>
<!-- Options Form -->
<form class="flex flex-col gap-sm mb-xl px-sm overflow-y-auto max-h-[442px]" onsubmit="event.preventDefault();">
<!-- Option 1 -->
<label class="relative cursor-pointer group">
<input class="radio-custom sr-only" name="decline_reason" type="radio" value="too_far"/>
<div class="flex items-center justify-between p-md rounded-xl border border-outline-variant bg-surface-container-low transition-all duration-200 group-hover:border-primary-fixed-dim/50">
<span class="font-body-lg text-body-lg text-on-surface">Too far</span>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center">
<div class="w-3 h-3 rounded-full radio-inner"></div>
</div>
</div>
</label>
<!-- Option 2 -->
<label class="relative cursor-pointer group">
<input class="radio-custom sr-only" name="decline_reason" type="radio" value="not_available"/>
<div class="flex items-center justify-between p-md rounded-xl border border-outline-variant bg-surface-container-low transition-all duration-200 group-hover:border-primary-fixed-dim/50">
<span class="font-body-lg text-body-lg text-on-surface">Not available</span>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center">
<div class="w-3 h-3 rounded-full radio-inner"></div>
</div>
</div>
</label>
<!-- Option 3 -->
<label class="relative cursor-pointer group">
<input class="radio-custom sr-only" name="decline_reason" type="radio" value="vehicle_issue"/>
<div class="flex items-center justify-between p-md rounded-xl border border-outline-variant bg-surface-container-low transition-all duration-200 group-hover:border-primary-fixed-dim/50">
<span class="font-body-lg text-body-lg text-on-surface">Vehicle issue</span>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center">
<div class="w-3 h-3 rounded-full radio-inner"></div>
</div>
</div>
</label>
<!-- Option 4 -->
<label class="relative cursor-pointer group">
<input class="radio-custom sr-only" name="decline_reason" type="radio" value="area_issue"/>
<div class="flex items-center justify-between p-md rounded-xl border border-outline-variant bg-surface-container-low transition-all duration-200 group-hover:border-primary-fixed-dim/50">
<span class="font-body-lg text-body-lg text-on-surface">Delivery area issue</span>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center">
<div class="w-3 h-3 rounded-full radio-inner"></div>
</div>
</div>
</label>
<!-- Option 5 -->
<label class="relative cursor-pointer group">
<input class="radio-custom sr-only" name="decline_reason" type="radio" value="not_suitable"/>
<div class="flex items-center justify-between p-md rounded-xl border border-outline-variant bg-surface-container-low transition-all duration-200 group-hover:border-primary-fixed-dim/50">
<span class="font-body-lg text-body-lg text-on-surface">Item / job type not suitable</span>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center">
<div class="w-3 h-3 rounded-full radio-inner"></div>
</div>
</div>
</label>
<!-- Option 6 (Other) -->
<div class="flex flex-col gap-xs">
<label class="relative cursor-pointer group">
<input class="radio-custom sr-only" id="radio-other" name="decline_reason" type="radio" value="other"/>
<div class="flex items-center justify-between p-md rounded-xl border border-outline-variant bg-surface-container-low transition-all duration-200 group-hover:border-primary-fixed-dim/50">
<span class="font-body-lg text-body-lg text-on-surface">Other</span>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center">
<div class="w-3 h-3 rounded-full radio-inner"></div>
</div>
</div>
</label>
<!-- Text field for 'Other' (hidden by default) -->
<div class="hidden pl-md pr-xs py-xs transition-all duration-300" id="other-text-field">
<textarea class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg p-sm font-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary transition-colors resize-none h-24" placeholder="Please specify..."></textarea>
</div>
</div>
</form>
<!-- Actions -->
<div class="flex flex-col gap-md px-sm pb-xl">
<button class="w-full bg-error-container text-on-error-container font-label-md text-label-md py-md rounded-full active:scale-95 transition-transform uppercase tracking-wider font-bold">
                    DECLINE REQUEST
                </button>
<button class="w-full bg-transparent border border-outline-variant text-on-surface font-label-md text-label-md py-md rounded-full active:scale-95 transition-transform uppercase tracking-wider">
                    GO BACK
                </button>
</div>
</div>
</div>
<script>
        // Toggle 'Other' text field visibility
        const radios = document.querySelectorAll('input[name="decline_reason"]');
        const otherTextField = document.getElementById('other-text-field');
        const otherRadio = document.getElementById('radio-other');

        radios.forEach(radio => {
            radio.addEventListener('change', () => {
                if (otherRadio.checked) {
                    otherTextField.classList.remove('hidden');
                    // Add a slight delay for smooth animation feeling if we were using height transitions
                } else {
                    otherTextField.classList.add('hidden');
                }
            });
        });
        
        // Add Tailwind custom animation for slide up
        tailwind.config.theme.extend.keyframes = {
            ...tailwind.config.theme.extend.keyframes,
            slideUp: {
                '0%': { transform: 'translateY(100%)' },
                '100%': { transform: 'translateY(0)' },
            }
        }
    </script>
</body></html>
