<script>
        // Simple drag simulation for the bottom sheet handle
        const bottomSheet = document.getElementById('bottomSheet');
        const dragHandle = document.getElementById('dragHandle');
        let startY;

        dragHandle.addEventListener('touchstart', (e) => {
            startY = e.touches[0].clientY;
        }, {passive: true});

        dragHandle.addEventListener('touchmove', (e) => {
            const currentY = e.touches[0].clientY;
            const diff = currentY - startY;
            if (diff > 0) {
                bottomSheet.style.transform = `translateY(${diff}px)`;
            }
        }, {passive: true});

        dragHandle.addEventListener('touchend', (e) => {
            const endY = e.changedTouches[0].clientY;
            const diff = endY - startY;
            if (diff > 100) {
                // If dragged down enough, dismiss (simulate)
                bottomSheet.style.transform = `translateY(100%)`;
                setTimeout(() => {
                    bottomSheet.style.transform = `translateY(0)`; // Reset for demo purposes
                }, 1000);
            } else {
                // Snap back
                bottomSheet.style.transform = `translateY(0)`;
            }
            bottomSheet.style.transition = 'transform 0.3s ease-out';
        });

        dragHandle.addEventListener('touchstart', () => {
             bottomSheet.style.transition = 'none';
        }, {passive: true});
    </script>
