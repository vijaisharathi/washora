<body class="bg-background text-on-surface antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Mobile App Container -->
<main class="w-full max-w-[480px] mx-auto h-[100dvh] flex flex-col bg-surface relative overflow-hidden border-x border-outline-variant/10 shadow-2xl">
<!-- Task Header (Suppresses standard nav for focused flow) -->
<header class="flex items-center justify-between px-md h-16 shrink-0 border-b border-outline-variant/20 bg-surface-container-low/50 backdrop-blur-md z-10">
<button class="w-10 h-10 flex items-center justify-center rounded-full text-on-surface-variant hover:bg-surface-variant/30 hover:text-on-surface transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
<h1 class="font-h3 text-h3 text-on-surface tracking-tight">Delivery Issue</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<!-- Scrollable Content Area -->
<div class="flex-1 overflow-y-auto px-lg py-lg space-y-xl pb-32">
<!-- Tracking Context (Brief) -->
<div class="flex items-center gap-md p-md rounded-xl bg-surface-container-low border border-outline-variant/30">
<div class="w-12 h-12 rounded-lg bg-surface-variant flex items-center justify-center border border-outline-variant/50 shrink-0">
<span class="material-symbols-outlined text-primary text-[24px]">box</span>
</div>
<div class="flex-1 min-w-0">
<p class="font-mono-display text-caption text-on-surface-variant truncate">TRK-8924-XL9</p>
<p class="font-label-md text-label-md text-on-surface truncate">MacBook Pro 16" - Signature Req.</p>
</div>
</div>
<!-- 1. Reason for Failure -->
<section class="space-y-md">
<h2 class="font-h3 text-h3 text-on-surface flex items-center gap-sm">
<span class="material-symbols-outlined text-error-red text-[20px]" style="font-variation-settings: 'FILL' 1;">error</span>
                    Select Reason
                </h2>
<div class="flex flex-col gap-sm">
<!-- Option 1 (Selected) -->
<label class="flex items-center p-md rounded-xl border-2 border-primary bg-primary/10 cursor-pointer transition-all">
<div class="flex items-center justify-center w-8 h-8 rounded-full bg-primary/20 mr-md shrink-0">
<span class="material-symbols-outlined text-primary text-[18px]">person_off</span>
</div>
<span class="font-body-md text-body-md text-on-surface flex-1 font-medium">Customer Unavailable</span>
<div class="w-5 h-5 rounded-full border-2 border-primary flex items-center justify-center shrink-0">
<div class="w-2.5 h-2.5 rounded-full bg-primary"></div>
</div>
</label>
<!-- Option 2 -->
<label class="flex items-center p-md rounded-xl border border-outline-variant/50 bg-surface-container-low hover:bg-surface-variant/30 cursor-pointer transition-colors group">
<div class="flex items-center justify-center w-8 h-8 rounded-full bg-surface-variant group-hover:bg-surface-container-high mr-md shrink-0 transition-colors">
<span class="material-symbols-outlined text-on-surface-variant text-[18px]">wrong_location</span>
</div>
<span class="font-body-md text-body-md text-on-surface-variant flex-1">Incorrect Address</span>
<div class="w-5 h-5 rounded-full border-2 border-outline-variant/50 flex items-center justify-center shrink-0"></div>
</label>
<!-- Option 3 -->
<label class="flex items-center p-md rounded-xl border border-outline-variant/50 bg-surface-container-low hover:bg-surface-variant/30 cursor-pointer transition-colors group">
<div class="flex items-center justify-center w-8 h-8 rounded-full bg-surface-variant group-hover:bg-surface-container-high mr-md shrink-0 transition-colors">
<span class="material-symbols-outlined text-on-surface-variant text-[18px]">perm_phone_msg</span>
</div>
<span class="font-body-md text-body-md text-on-surface-variant flex-1">Unable to Contact</span>
<div class="w-5 h-5 rounded-full border-2 border-outline-variant/50 flex items-center justify-center shrink-0"></div>
</label>
<!-- Option 4 -->
<label class="flex items-center p-md rounded-xl border border-outline-variant/50 bg-surface-container-low hover:bg-surface-variant/30 cursor-pointer transition-colors group">
<div class="flex items-center justify-center w-8 h-8 rounded-full bg-surface-variant group-hover:bg-surface-container-high mr-md shrink-0 transition-colors">
<span class="material-symbols-outlined text-on-surface-variant text-[18px]">block</span>
</div>
<span class="font-body-md text-body-md text-on-surface-variant flex-1">Customer Refused</span>
<div class="w-5 h-5 rounded-full border-2 border-outline-variant/50 flex items-center justify-center shrink-0"></div>
</label>
<!-- Option 5 -->
<label class="flex items-center p-md rounded-xl border border-outline-variant/50 bg-surface-container-low hover:bg-surface-variant/30 cursor-pointer transition-colors group">
<div class="flex items-center justify-center w-8 h-8 rounded-full bg-surface-variant group-hover:bg-surface-container-high mr-md shrink-0 transition-colors">
<span class="material-symbols-outlined text-on-surface-variant text-[18px]">local_shipping</span>
</div>
<span class="font-body-md text-body-md text-on-surface-variant flex-1">Vehicle/Operational Issue</span>
<div class="w-5 h-5 rounded-full border-2 border-outline-variant/50 flex items-center justify-center shrink-0"></div>
</label>
</div>
</section>
<!-- 2. Additional Description -->
<section class="space-y-sm">
<div class="flex justify-between items-end">
<label class="font-label-md text-label-md text-on-surface font-medium">Additional Notes</label>
<span class="font-caption text-caption text-on-surface-variant">Optional</span>
</div>
<div class="relative group">
<textarea class="w-full bg-surface-container-low border border-outline-variant/50 rounded-xl p-md pt-3 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary/50 placeholder:text-on-surface-variant/40 resize-none transition-all" placeholder="E.g., Gate code required, vicious dog in yard..." rows="3"></textarea>
<div class="absolute bottom-3 right-3 text-on-surface-variant/30">
<span class="material-symbols-outlined text-[18px]">edit_note</span>
</div>
</div>
</section>
<!-- Divider -->
<div class="h-px w-full bg-gradient-to-r from-transparent via-outline-variant/30 to-transparent"></div>
<!-- 3. Next Action & Reschedule UI -->
<section class="space-y-md">
<h2 class="font-h3 text-h3 text-on-surface">Resolution Action</h2>
<!-- Action Segmented Control (Bento Grid Style) -->
<div class="grid grid-cols-3 gap-sm">
<!-- Action: Retry -->
<button class="flex flex-col items-center justify-center p-md rounded-xl border border-outline-variant/50 bg-surface-container-low hover:bg-surface-variant/50 transition-colors gap-2 text-on-surface-variant">
<span class="material-symbols-outlined">refresh</span>
<span class="font-label-md text-label-md">Retry Later</span>
</button>
<!-- Action: Reschedule (Active State) -->
<button class="flex flex-col items-center justify-center p-md rounded-xl border-2 border-primary bg-primary/10 transition-colors gap-2 text-primary shadow-[0_0_15px_rgba(220,184,255,0.05)]">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">edit_calendar</span>
<span class="font-label-md text-label-md font-bold">Reschedule</span>
</button>
<!-- Action: Return -->
<button class="flex flex-col items-center justify-center p-md rounded-xl border border-outline-variant/50 bg-surface-container-low hover:bg-surface-variant/50 transition-colors gap-2 text-on-surface-variant">
<span class="material-symbols-outlined">assignment_return</span>
<span class="font-label-md text-label-md">Return Hub</span>
</button>
</div>
<!-- Reschedule Context Panel (Visible because Reschedule is active) -->
<div class="mt-md p-md bg-surface-container rounded-xl border border-outline-variant/30 relative overflow-hidden">
<!-- Decorative subtle glow -->
<div class="absolute top-0 right-0 w-32 h-32 bg-primary/5 rounded-full blur-2xl -mr-10 -mt-10 pointer-events-none"></div>
<h3 class="font-label-md text-label-md font-bold text-on-surface mb-md flex items-center gap-xs">
<span class="material-symbols-outlined text-primary text-[18px]">schedule</span>
                        New Delivery Window
                    </h3>
<div class="flex flex-col gap-md relative z-10">
<!-- Date Selector -->
<div class="space-y-xs">
<label class="font-caption text-caption text-on-surface-variant ml-1">Date</label>
<button class="w-full flex items-center justify-between bg-surface border border-outline-variant/50 hover:border-outline-variant rounded-lg p-3 px-4 transition-colors">
<div class="flex items-center text-on-surface">
<span class="material-symbols-outlined text-on-surface-variant mr-3 text-[20px]">calendar_today</span>
<span class="font-body-md text-body-md font-medium">Tomorrow, Oct 25</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant text-[20px]">keyboard_arrow_down</span>
</button>
</div>
<!-- Time Selector -->
<div class="space-y-xs">
<label class="font-caption text-caption text-on-surface-variant ml-1">Time Preference</label>
<button class="w-full flex items-center justify-between bg-surface border border-outline-variant/50 hover:border-outline-variant rounded-lg p-3 px-4 transition-colors">
<div class="flex items-center text-on-surface">
<span class="material-symbols-outlined text-on-surface-variant mr-3 text-[20px]">nest_clock_farsight_analog</span>
<span class="font-body-md text-body-md font-medium">Morning (08:00 - 12:00)</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant text-[20px]">keyboard_arrow_down</span>
</button>
</div>
</div>
</div>
</section>
</div>
<!-- Sticky Footer Action -->
<div class="absolute bottom-0 left-0 w-full p-lg bg-surface/80 backdrop-blur-xl border-t border-outline-variant/20 pb-safe z-20">
<button class="w-full bg-primary text-on-primary font-label-md text-label-md font-bold py-4 rounded-xl shadow-[0_4px_24px_rgba(220,184,255,0.25)] hover:bg-primary-fixed transition-all active:scale-[0.98] flex items-center justify-center gap-2">
                Submit Issue Report
                <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">arrow_forward</span>
</button>
</div>
</main>
