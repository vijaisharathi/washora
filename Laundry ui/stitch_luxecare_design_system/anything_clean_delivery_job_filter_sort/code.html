<style>
        /* Custom scrollbar for webkit */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #4c4354; /* outline-variant */
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #988ca0; /* outline */
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-surface-dim text-on-surface font-body-md antialiased overflow-hidden min-h-screen flex justify-center items-center">
<!-- Mock Background App Content (Blurred) -->
<div class="fixed inset-0 bg-background pointer-events-none flex flex-col items-center justify-start pt-16">
<div class="w-full max-w-[390px] h-full opacity-30 filter blur-sm flex flex-col gap-4 p-4">
<div class="w-full h-32 bg-surface-container rounded-xl"></div>
<div class="w-full h-32 bg-surface-container rounded-xl"></div>
<div class="w-full h-32 bg-surface-container rounded-xl"></div>
</div>
</div>
<!-- Mobile Device Container -->
<div class="relative w-full max-w-[390px] h-full max-h-[844px] bg-transparent flex flex-col justify-end mx-auto shadow-2xl overflow-hidden rounded-[40px] md:rounded-[40px] border-8 border-surface-container-highest">
<!-- Backdrop Overlay -->
<div class="absolute inset-0 bg-black/60 backdrop-blur-sm z-40 transition-opacity"></div>
<!-- Bottom Sheet -->
<div class="relative z-50 bg-surface-container w-full h-[85%] rounded-t-3xl flex flex-col shadow-[0_-8px_32px_rgba(0,0,0,0.5)] border-t border-outline-variant/30">
<!-- Drag Handle -->
<div class="w-full flex justify-center pt-3 pb-1 shrink-0">
<div class="w-12 h-1.5 bg-outline-variant/50 rounded-full"></div>
</div>
<!-- Header -->
<div class="flex items-center justify-between px-md py-sm shrink-0 border-b border-outline-variant/20">
<h2 class="font-h3 text-h3 text-on-surface">Filter Deliveries</h2>
<button class="text-primary font-label-md text-label-md hover:text-primary-fixed-dim transition-colors">Clear All</button>
</div>
<!-- Scrollable Content -->
<div class="flex-1 overflow-y-auto p-md flex flex-col gap-xl">
<!-- Sort Section -->
<section class="flex flex-col gap-sm">
<h3 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider mb-xs">Sort By</h3>
<div class="grid grid-cols-2 gap-sm">
<label class="flex items-center gap-2 p-sm rounded-lg border border-primary bg-primary/10 cursor-pointer transition-colors">
<input checked="" class="form-radio text-primary bg-surface border-outline focus:ring-primary focus:ring-offset-surface-container" name="sort" type="radio"/>
<span class="font-body-md text-body-md text-primary">Recommended</span>
</label>
<label class="flex items-center gap-2 p-sm rounded-lg border border-outline-variant/50 hover:bg-surface-container-high cursor-pointer transition-colors">
<input class="form-radio text-primary bg-surface border-outline focus:ring-primary focus:ring-offset-surface-container" name="sort" type="radio"/>
<span class="font-body-md text-body-md text-on-surface">Nearest</span>
</label>
<label class="flex items-center gap-2 p-sm rounded-lg border border-outline-variant/50 hover:bg-surface-container-high cursor-pointer transition-colors">
<input class="form-radio text-primary bg-surface border-outline focus:ring-primary focus:ring-offset-surface-container" name="sort" type="radio"/>
<span class="font-body-md text-body-md text-on-surface">Highest Earnings</span>
</label>
<label class="flex items-center gap-2 p-sm rounded-lg border border-outline-variant/50 hover:bg-surface-container-high cursor-pointer transition-colors">
<input class="form-radio text-primary bg-surface border-outline focus:ring-primary focus:ring-offset-surface-container" name="sort" type="radio"/>
<span class="font-body-md text-body-md text-on-surface">Newest</span>
</label>
</div>
</section>
<hr class="border-outline-variant/20"/>
<!-- Type Section -->
<section class="flex flex-col gap-sm">
<h3 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider mb-xs">Type</h3>
<div class="flex flex-wrap gap-sm">
<button class="px-md py-sm rounded-full bg-primary text-on-primary font-label-md text-label-md transition-colors">All</button>
<button class="px-md py-sm rounded-full bg-surface-container-highest border border-outline-variant/50 text-on-surface font-label-md text-label-md hover:border-primary/50 transition-colors">Pickup</button>
<button class="px-md py-sm rounded-full bg-surface-container-highest border border-outline-variant/50 text-on-surface font-label-md text-label-md hover:border-primary/50 transition-colors">Delivery</button>
<button class="px-md py-sm rounded-full bg-surface-container-highest border border-outline-variant/50 text-on-surface font-label-md text-label-md hover:border-primary/50 transition-colors">Pickup + Delivery</button>
</div>
</section>
<hr class="border-outline-variant/20"/>
<!-- Distance Section -->
<section class="flex flex-col gap-sm">
<h3 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider mb-xs">Distance</h3>
<div class="flex flex-wrap gap-sm">
<button class="px-md py-sm rounded-full bg-primary text-on-primary font-label-md text-label-md transition-colors">Under 2 km</button>
<button class="px-md py-sm rounded-full bg-surface-container-highest border border-outline-variant/50 text-on-surface font-label-md text-label-md hover:border-primary/50 transition-colors">2–5 km</button>
<button class="px-md py-sm rounded-full bg-surface-container-highest border border-outline-variant/50 text-on-surface font-label-md text-label-md hover:border-primary/50 transition-colors">5+ km</button>
</div>
</section>
<hr class="border-outline-variant/20"/>
<!-- Earnings Section -->
<section class="flex flex-col gap-sm">
<h3 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider mb-xs">Earnings</h3>
<div class="flex gap-sm">
<button class="flex-1 py-sm rounded-lg border border-primary bg-primary/10 text-primary font-label-md text-label-md transition-colors text-center">Highest</button>
<button class="flex-1 py-sm rounded-lg border border-outline-variant/50 bg-surface-container-highest text-on-surface font-label-md text-label-md hover:bg-surface-container-high transition-colors text-center">Lowest</button>
</div>
</section>
<hr class="border-outline-variant/20"/>
<!-- Service Type Section -->
<section class="flex flex-col gap-sm pb-xl">
<h3 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider mb-xs">Service Type</h3>
<div class="grid grid-cols-2 gap-sm">
<label class="flex items-center gap-3 p-sm rounded-lg hover:bg-surface-container-high cursor-pointer transition-colors group">
<input checked="" class="form-checkbox rounded text-primary bg-surface border-outline-variant focus:ring-primary focus:ring-offset-surface-container h-5 w-5" type="checkbox"/>
<span class="font-body-md text-body-md text-on-surface group-hover:text-primary transition-colors">Laundry</span>
</label>
<label class="flex items-center gap-3 p-sm rounded-lg hover:bg-surface-container-high cursor-pointer transition-colors group">
<input class="form-checkbox rounded text-primary bg-surface border-outline-variant focus:ring-primary focus:ring-offset-surface-container h-5 w-5" type="checkbox"/>
<span class="font-body-md text-body-md text-on-surface group-hover:text-primary transition-colors">Shoes</span>
</label>
<label class="flex items-center gap-3 p-sm rounded-lg hover:bg-surface-container-high cursor-pointer transition-colors group">
<input checked="" class="form-checkbox rounded text-primary bg-surface border-outline-variant focus:ring-primary focus:ring-offset-surface-container h-5 w-5" type="checkbox"/>
<span class="font-body-md text-body-md text-on-surface group-hover:text-primary transition-colors">Sneakers</span>
</label>
<label class="flex items-center gap-3 p-sm rounded-lg hover:bg-surface-container-high cursor-pointer transition-colors group">
<input class="form-checkbox rounded text-primary bg-surface border-outline-variant focus:ring-primary focus:ring-offset-surface-container h-5 w-5" type="checkbox"/>
<span class="font-body-md text-body-md text-on-surface group-hover:text-primary transition-colors">Helmets</span>
</label>
<label class="flex items-center gap-3 p-sm rounded-lg hover:bg-surface-container-high cursor-pointer transition-colors group">
<input class="form-checkbox rounded text-primary bg-surface border-outline-variant focus:ring-primary focus:ring-offset-surface-container h-5 w-5" type="checkbox"/>
<span class="font-body-md text-body-md text-on-surface group-hover:text-primary transition-colors">Bikes</span>
</label>
<label class="flex items-center gap-3 p-sm rounded-lg hover:bg-surface-container-high cursor-pointer transition-colors group">
<input class="form-checkbox rounded text-primary bg-surface border-outline-variant focus:ring-primary focus:ring-offset-surface-container h-5 w-5" type="checkbox"/>
<span class="font-body-md text-body-md text-on-surface group-hover:text-primary transition-colors">Cars</span>
</label>
<label class="flex items-center gap-3 p-sm rounded-lg hover:bg-surface-container-high cursor-pointer transition-colors group">
<input class="form-checkbox rounded text-primary bg-surface border-outline-variant focus:ring-primary focus:ring-offset-surface-container h-5 w-5" type="checkbox"/>
<span class="font-body-md text-body-md text-on-surface group-hover:text-primary transition-colors">Bags</span>
</label>
</div>
</section>
</div>
<!-- Footer Actions -->
<div class="px-md py-md border-t border-outline-variant/30 bg-surface-container/95 backdrop-blur shrink-0 pb-safe">
<button class="w-full py-md rounded-xl bg-electric-violet text-white font-h3 text-h3 shadow-lg shadow-electric-violet/20 hover:bg-electric-violet/90 transition-all active:scale-95">
                    Apply Filters
                </button>
</div>
</div>
</div>
