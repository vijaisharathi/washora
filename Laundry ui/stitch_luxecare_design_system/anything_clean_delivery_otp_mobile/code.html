<!-- This is a transactional flow (OTP entry), so nav shell is suppressed based on "Task-Focused" rule. -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('.otp-input');
            const verifyBtn = document.getElementById('verify-btn');
            const successOverlay = document.getElementById('success-overlay');

            // OTP Input Logic
            inputs.forEach((input, index) => {
                input.addEventListener('input', (e) => {
                    if (e.target.value.length > 0) {
                        if (index < inputs.length - 1) {
                            inputs[index + 1].focus();
                        }
                    }
                    checkOTPComplete();
                });

                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && e.target.value === '') {
                        if (index > 0) {
                            inputs[index - 1].focus();
                        }
                    }
                });
                
                // Allow pasting 6 digits
                input.addEventListener('paste', (e) => {
                    e.preventDefault();
                    const pastedData = e.clipboardData.getData('text').slice(0, 6);
                    for (let i = 0; i < pastedData.length; i++) {
                        if (i < inputs.length) {
                            inputs[i].value = pastedData[i];
                        }
                    }
                    if (pastedData.length > 0) {
                        const nextFocus = Math.min(pastedData.length, inputs.length - 1);
                        inputs[nextFocus].focus();
                    }
                    checkOTPComplete();
                });
            });

            function checkOTPComplete() {
                const isComplete = Array.from(inputs).every(input => input.value.length === 1);
                // Optional: Enable/disable button visually based on completion
            }

            // Verify Button Logic
            verifyBtn.addEventListener('click', () => {
                const isComplete = Array.from(inputs).every(input => input.value.length === 1);
                
                // For demo purposes, we'll show success even if incomplete, but in a real app:
                // if (!isComplete) return;

                successOverlay.classList.add('active');
                
                // Auto hide after 3 seconds and navigate back or to next step
                setTimeout(() => {
                    successOverlay.classList.remove('active');
                    // history.back();
                }, 3000);
            });
        });
    </script>
