<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Earnings Breakdown</title>

        tailwind.config = {

                        "secondary-fixed": "#e4e2e4",

                        "error": "#ffb4ab",
                        "primary-fixed": "#efdbff",
                        "outline": "#988ca0",
                        "surface-dim": "#131314",
                        "success-green": "#81C784",
                        "inverse-primary": "#8422dc",
                        "inverse-surface": "#e5e2e3",
                        "secondary-container": "#49494b",
                        "surface-container-lowest": "#0e0e0f",
                        "on-primary": "#480081",
                        "inverse-on-surface": "#313031",
                        "background": "#131314",
                        "on-background": "#e5e2e3",
                        "surface-bright": "#39393a",
                        "surface-container-highest": "#353436",
                        "on-secondary-container": "#b9b8ba",
                        "success-bg": "#1A3D24",
                        "on-surface": "#e5e2e3",
                        "on-tertiary-fixed-variant": "#474648",
                        "on-primary-fixed": "#2c0051",
                        "surface-container-low": "#1c1b1c",
                        "on-secondary-fixed-variant": "#474648",
                        "on-error": "#690005",
                        "on-secondary-fixed": "#1b1b1d",
                        "surface": "#131314",
                        "tertiary-fixed-dim": "#c8c6c8",
                        "tertiary-container": "#646365",
                        "surface-tint": "#dcb8ff",
                        "on-tertiary": "#303032",

                        "tertiary": "#c8c6c8",

                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",

                        "full": "9999px"
                    },
                    "spacing": {
                        "xl": "32px",
                        "xs": "4px",
                        "sm": "8px",
                        "lg": "24px",
                        "md": "16px",

                        "3xl": "64px"

                    "fontFamily": {
                        "h1": ["Geist", "sans-serif"],

                }
            }
        }
    </script>
<style>
        body {
            background-color: #131314; /* surface-dim */
            color: #e5e2e3; /* on-surface */
            font-family: 'Geist', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
    </style>
</head>
<body class="flex justify-center items-start min-h-screen pt-4 pb-12 bg-background">
<!-- Mobile Container Wrapper -->
<div class="w-full max-w-[390px] relative flex flex-col bg-surface shadow-2xl overflow-hidden min-h-[844px] border border-outline-variant/20 rounded-[2rem]">
<!-- Top App Bar (Custom for sub-page) -->
<header class="flex justify-between items-center px-lg h-16 w-full backdrop-blur-md border-b border-outline-variant/30 sticky top-0 z-50 bg-surface-dim/80">
<button class="text-on-surface-variant hover:bg-surface-container-high transition-colors active:scale-95 p-2 -ml-2 rounded-full">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-h3 text-h3 font-bold text-on-surface">Earnings Breakdown</h1>
<div class="w-8"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col p-lg gap-lg overflow-y-auto">
<!-- Order Context Card -->
<section class="bg-surface-container-low border border-outline-variant/20 rounded-xl p-md flex flex-col gap-sm">
<div class="flex justify-between items-start">
<div class="flex flex-col gap-xs">
<span class="font-caption text-caption text-on-surface-variant uppercase tracking-wider">Order ID</span>
<span class="font-mono-display text-mono-display text-on-surface">QH-20260902-1041</span>
</div>
<div class="bg-success-bg text-success-green px-2 py-1 rounded-full font-label-md text-label-md flex items-center gap-1 border border-success-green/20">
<span class="material-symbols-outlined text-[14px]">check_circle</span>
                        Completed
                    </div>
</div>
<div class="border-t border-outline-variant/30 pt-sm mt-xs">
<span class="font-body-md text-body-md text-on-surface font-medium">Sneaker Deep Clean</span>
</div>
</section>
<!-- Financial Breakdown Bento -->
<section class="flex flex-col gap-sm">
<h2 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider pl-xs mb-1">Financial Summary</h2>
<div class="bg-surface-container border border-outline-variant/20 rounded-xl overflow-hidden">
<!-- Base Fee -->
<div class="flex justify-between items-center p-md border-b border-outline-variant/10">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-on-surface-variant">delivery_dining</span>
<span class="font-body-md text-body-md text-on-surface">Base Delivery Fee</span>
</div>
<span class="font-mono-display text-mono-display text-on-surface">₹70</span>
</div>
<!-- Incentive -->
<div class="flex justify-between items-center p-md border-b border-outline-variant/10">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-on-surface-variant">trending_up</span>
<span class="font-body-md text-body-md text-on-surface-variant">Incentive</span>
</div>
<span class="font-mono-display text-mono-display text-on-surface-variant">₹0</span>
</div>
<!-- Adjustment -->
<div class="flex justify-between items-center p-md">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-on-surface-variant">tune</span>
<span class="font-body-md text-body-md text-on-surface-variant">Adjustment</span>
</div>
<span class="font-mono-display text-mono-display text-on-surface-variant">₹0</span>
</div>
</div>
</section>
<!-- Highlighted Total -->
<section class="mt-4 bg-primary-container/10 border border-primary/30 rounded-xl p-lg flex justify-between items-center shadow-[0_0_20px_rgba(138,43,226,0.1)] relative overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-r from-electric-violet/5 to-transparent pointer-events-none"></div>
<div class="flex flex-col z-10">
<span class="font-label-md text-label-md text-primary tracking-wide">Net Earnings</span>
<span class="font-display-lg text-display-lg text-primary mt-1 font-bold">₹70</span>
</div>
<div class="h-12 w-12 rounded-full bg-primary/20 flex items-center justify-center z-10 border border-primary/30">
<span class="material-symbols-outlined text-primary text-[28px]" data-weight="fill">account_balance_wallet</span>
</div>
</section>
</main>
<!-- Bottom padding for aesthetics on mobile -->
<div class="h-8 bg-surface-dim"></div>
</div>
</body></html>
