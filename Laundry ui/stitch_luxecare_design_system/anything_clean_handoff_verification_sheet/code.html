<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>

<title>Handoff Verification Sheet</title>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-container": "#eed9ff",
                        "error-container": "#93000a",
                        "on-tertiary-container": "#e3e0e2",
                        "surface-container": "#201f20",
                        "error-red": "#ffb4ab",
                        "secondary": "#c8c6c8",
                        "primary-fixed-dim": "#dcb8ff",
                        "surface-container-high": "#2a2a2b",
                        "secondary-fixed": "#e4e2e4",
                        "tertiary-fixed": "#e4e2e4",
                        "error": "#ffb4ab",
                        "primary-fixed": "#efdbff",
                        "outline": "#988ca0",
                        "surface-dim": "#131314",
                        "success-green": "#81C784",
                        "inverse-primary": "#8422dc",
                        "inverse-surface": "#e5e2e3",
                        "secondary-container": "#49494b",
                        "surface-container-lowest": "#0e0e0f",
                        "on-primary": "#480081",
                        "inverse-on-surface": "#313031",
                        "background": "#131314",
                        "on-background": "#e5e2e3",
                        "surface-bright": "#39393a",
                        "surface-container-highest": "#353436",
                        "on-secondary-container": "#b9b8ba",
                        "success-bg": "#1A3D24",
                        "on-surface": "#e5e2e3",
                        "on-tertiary-fixed-variant": "#474648",
                        "on-primary-fixed": "#2c0051",
                        "surface-container-low": "#1c1b1c",
                        "on-secondary-fixed-variant": "#474648",
                        "on-error": "#690005",
                        "on-secondary-fixed": "#1b1b1d",
                        "surface": "#131314",
                        "tertiary-fixed-dim": "#c8c6c8",
                        "tertiary-container": "#646365",
                        "surface-tint": "#dcb8ff",
                        "on-tertiary": "#303032",
                        "surface-variant": "#353436",
                        "tertiary": "#c8c6c8",
                        "electric-violet": "#8a2be2",
                        "secondary-fixed-dim": "#c8c6c8",
                        "outline-variant": "#4c4354",
                        "on-error-container": "#ffdad6",
                        "primary": "#dcb8ff",
                        "on-primary-fixed-variant": "#6700b5",
                        "on-tertiary-fixed": "#1b1b1d",
                        "on-surface-variant": "#cfc2d7",
                        "on-secondary": "#303032",
                        "primary-container": "#8a2be2"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xl": "32px",
                        "xs": "4px",
                        "sm": "8px",
                        "lg": "24px",
                        "md": "16px",
                        "2xl": "48px",
                        "3xl": "64px"
                    },
                    "fontFamily": {
                        "h1": ["Geist"],
                        "caption": ["Geist"],
                        "body-md": ["Geist"],

                        "h3": ["Geist"],
                        "display-lg": ["Geist"]
                    },
                    "fontSize": {
                        "h1": ["28px", { "lineHeight": "36px", "fontWeight": "700" }],
                        "caption": ["12px", { "lineHeight": "16px", "fontWeight": "400" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500" }],
                        "mono-display": ["18px", { "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "h3": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        @import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap');
        body { font-family: 'Geist', sans-serif; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface-dim text-on-surface h-screen w-screen flex justify-center items-end m-0 overflow-hidden">
<!-- Backdrop -->
<div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40"></div>
<!-- Bottom Sheet Container -->
<div class="relative w-[390px] max-w-full bg-surface-container rounded-t-[32px] z-50 flex flex-col shadow-[0_-8px_32px_rgba(0,0,0,0.4)] border-t border-outline-variant/30 animate-[slideUp_0.3s_ease-out]">
<!-- Drag Handle -->
<div class="w-full flex justify-center pt-sm pb-md">
<div class="w-12 h-1.5 bg-outline-variant/50 rounded-full"></div>
</div>
<!-- Header -->
<div class="px-xl pb-md border-b border-outline-variant/30 flex items-center justify-between">
<h2 class="font-h3 text-h3 text-on-surface">Confirm Handoff</h2>
<button class="text-on-surface-variant hover:text-on-surface transition-colors p-sm rounded-full hover:bg-surface-container-high">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
<!-- Content Scrollable Area -->
<div class="px-xl py-lg overflow-y-auto max-h-[618px] flex flex-col gap-lg">
<!-- Order Summary Card -->
<div class="bg-surface-container-low border border-outline-variant/30 rounded-xl p-md flex flex-col gap-sm">
<div class="flex justify-between items-start">
<span class="font-label-md text-label-md text-on-surface-variant">Order ID</span>
<span class="font-mono-display text-[14px] text-primary">QH-20260902-1041</span>
</div>
<div class="w-full h-px bg-outline-variant/20"></div>
<div class="flex justify-between items-center pt-xs">
<div>
<p class="font-body-md text-body-md text-on-surface font-medium">Sneaker Deep Clean</p>
<p class="font-caption text-caption text-on-surface-variant">1 Pair</p>
</div>
<div class="bg-surface-container-high px-sm py-xs rounded text-xs text-secondary">
                        Provider
                    </div>
</div>
</div>
<!-- Verification Checklist -->
<div class="flex flex-col gap-md">
<h3 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Verification Checklist</h3>
<div class="flex flex-col gap-sm">
<label class="flex items-center gap-md p-md rounded-lg border border-outline-variant/20 bg-surface-container-lowest cursor-pointer hover:bg-surface-container-high transition-colors group">
<input class="w-5 h-5 rounded border-outline-variant/50 bg-transparent text-electric-violet focus:ring-electric-violet focus:ring-offset-surface-container-lowest check-item" type="checkbox"/>
<span class="font-body-md text-body-md text-on-surface group-hover:text-primary transition-colors">Booking ID matches</span>
</label>
<label class="flex items-center gap-md p-md rounded-lg border border-outline-variant/20 bg-surface-container-lowest cursor-pointer hover:bg-surface-container-high transition-colors group">
<input class="w-5 h-5 rounded border-outline-variant/50 bg-transparent text-electric-violet focus:ring-electric-violet focus:ring-offset-surface-container-lowest check-item" type="checkbox"/>
<span class="font-body-md text-body-md text-on-surface group-hover:text-primary transition-colors">Item matches</span>
</label>
<label class="flex items-center gap-md p-md rounded-lg border border-outline-variant/20 bg-surface-container-lowest cursor-pointer hover:bg-surface-container-high transition-colors group">
<input class="w-5 h-5 rounded border-outline-variant/50 bg-transparent text-electric-violet focus:ring-electric-violet focus:ring-offset-surface-container-lowest check-item" type="checkbox"/>
<span class="font-body-md text-body-md text-on-surface group-hover:text-primary transition-colors">Quantity matches</span>
</label>
</div>
</div>
<!-- Final Confirmation -->
<div class="pt-sm">
<label class="flex items-start gap-md p-md rounded-xl bg-surface-container-high border border-primary/20 cursor-pointer">
<input class="mt-1 w-5 h-5 rounded border-outline-variant/50 bg-transparent text-electric-violet focus:ring-electric-violet focus:ring-offset-surface-container-high" id="finalConfirm" type="checkbox"/>
<span class="font-body-md text-body-md text-on-surface">I confirm the correct item has been handed over.</span>
</label>
</div>
</div>
<!-- Sticky Footer -->
<div class="p-xl border-t border-outline-variant/20 bg-surface-container pb-safe">
<button class="w-full py-md rounded-lg font-label-md text-label-md font-bold transition-all duration-300 disabled:opacity-50 disabled:bg-surface-container-highest disabled:text-on-surface-variant disabled:shadow-none bg-electric-violet text-white shadow-[0_4px_12px_rgba(138,43,226,0.3)] hover:shadow-[0_6px_16px_rgba(138,43,226,0.4)] active:scale-[0.98]" disabled="" id="confirmBtn">
                Confirm Handoff
            </button>
</div>
</div>
<style>
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        
        /* Padding safe area for modern mobile browsers */
        @supports (padding-bottom: env(safe-area-inset-bottom)) {
            .pb-safe { padding-bottom: calc(32px + env(safe-area-inset-bottom)); }
        }
    </style>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const finalConfirm = document.getElementById('finalConfirm');
            const confirmBtn = document.getElementById('confirmBtn');
            const checkItems = document.querySelectorAll('.check-item');

            function updateButtonState() {
                // Example logic: Only require the final confirmation checkbox to enable the button.
                // You could also require all checklist items to be checked before the final confirm is valid.
                if (finalConfirm.checked) {
                    confirmBtn.removeAttribute('disabled');
                    confirmBtn.classList.remove('opacity-50', 'bg-surface-container-highest', 'text-on-surface-variant', 'shadow-none');
                    confirmBtn.classList.add('bg-electric-violet', 'text-white', 'shadow-[0_4px_12px_rgba(138,43,226,0.3)]');
                } else {
                    confirmBtn.setAttribute('disabled', 'true');
                    confirmBtn.classList.add('opacity-50', 'bg-surface-container-highest', 'text-on-surface-variant', 'shadow-none');
                    confirmBtn.classList.remove('bg-electric-violet', 'text-white', 'shadow-[0_4px_12px_rgba(138,43,226,0.3)]');
                }
            }

            finalConfirm.addEventListener('change', updateButtonState);
        });
    </script>
</body></html>
