        body { font-family: 'Geist', sans-serif; }

    body {
      min-height: max(884px, 100dvh);

<body class="bg-background text-on-surface antialiased min-h-screen pb-24 md:hidden">
<!-- TopAppBar (From JSON) -->
<header class="fixed top-0 w-full z-50 bg-surface/80 dark:bg-surface/80 backdrop-blur-xl border-b border-white/5 flex items-center justify-between px-md h-16 max-w-7xl mx-auto">
<button class="text-on-surface-variant hover:opacity-80 transition-opacity active:scale-95 transition-transform">
<span class="material-symbols-outlined">menu</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary">Incentives</h1>
<button class="text-on-surface-variant hover:opacity-80 transition-opacity active:scale-95 transition-transform relative">
<span class="material-symbols-outlined">notifications</span>
<span class="absolute top-1 right-1 w-2 h-2 bg-error rounded-full"></span>
</button>
</header>
<main class="pt-24 px-5">
<!-- Tabs -->
<div class="flex space-x-2 mb-lg bg-surface-container rounded-lg p-1">
<button class="flex-1 py-2 text-center rounded-md bg-primary-container text-on-primary-container font-label-md text-label-md font-semibold transition-all">Active</button>
<button class="flex-1 py-2 text-center rounded-md text-on-surface-variant font-label-md text-label-md hover:bg-surface-variant/50 transition-all">Completed</button>
<button class="flex-1 py-2 text-center rounded-md text-on-surface-variant font-label-md text-label-md hover:bg-surface-variant/50 transition-all">Expired</button>
</div>
<!-- Featured Challenge -->
<section class="mb-lg">
<div class="glass-panel glow-border rounded-xl p-lg relative overflow-hidden">
<!-- Abstract Background Detail -->
<div class="absolute -top-10 -right-10 w-32 h-32 bg-primary/10 rounded-full blur-2xl"></div>
<div class="flex justify-between items-start mb-md relative z-10">
<div>
<span class="inline-block px-2 py-1 bg-primary/20 text-primary font-caption text-caption rounded-sm mb-2">Featured</span>
<h2 class="font-headline-md text-headline-md leading-tight text-on-surface font-semibold">Weekend Delivery Challenge</h2>
</div>
<div class="text-right">
<span class="block font-headline-md text-headline-md text-primary font-bold">₹500</span>
<span class="font-caption text-caption text-on-surface-variant">Bonus</span>
</div>
</div>
<div class="mb-sm relative z-10">
<div class="flex justify-between font-label-md text-label-md mb-2">
<span class="text-on-surface-variant">Progress</span>
<span class="text-primary font-semibold">12 / 20</span>
</div>
<div class="w-full bg-surface-container-highest rounded-full h-2 overflow-hidden">
<div class="bg-primary h-2 rounded-full w-[60%] shadow-[0_0_10px_rgba(220,184,255,0.5)]"></div>
</div>
</div>
<div class="flex items-center text-error font-caption text-caption relative z-10 mt-md">
<span class="material-symbols-outlined text-[16px] mr-1">timer</span>
<span>Ends today</span>
</div>
</div>
</section>
<!-- Other Active Incentives -->
<section>
<h3 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider mb-md ml-1">Other Active</h3>
<div class="space-y-md">
<!-- List Item 1 -->
<div class="bg-surface rounded-lg p-md flex items-center justify-between border border-white/5 active:scale-[0.98] transition-transform">
<div class="flex-1">
<h4 class="font-body-lg text-body-lg text-on-surface font-medium mb-1">Complete 10 Deliveries</h4>
<div class="flex items-center space-x-3">
<span class="font-label-md text-label-md text-on-surface-variant">7 / 10</span>
<div class="w-20 bg-surface-container-highest rounded-full h-1.5 overflow-hidden">
<div class="bg-primary h-1.5 rounded-full w-[70%]"></div>
</div>
</div>
</div>
<div class="text-right pl-md border-l border-white/10">
<span class="block font-body-lg text-body-lg text-primary font-semibold">₹200</span>
</div>
</div>
<!-- List Item 2 -->
<div class="bg-surface rounded-lg p-md flex items-center justify-between border border-white/5 active:scale-[0.98] transition-transform relative overflow-hidden">
<div class="absolute left-0 top-0 bottom-0 w-1 bg-primary/50"></div>
<div class="flex-1 pl-2">
<div class="flex items-center space-x-2 mb-1">
<h4 class="font-body-lg text-body-lg text-on-surface font-medium">Peak Hour Bonus</h4>
<span class="w-2 h-2 rounded-full bg-primary animate-pulse"></span>
</div>
<span class="font-label-md text-label-md text-on-surface-variant">Active now</span>
</div>
<div class="text-right pl-md">
<span class="block font-body-lg text-body-lg text-primary font-semibold">+₹20</span>
<span class="font-caption text-caption text-on-surface-variant">/delivery</span>
</div>
</div>
</div>
</section>
</main>
<!-- BottomNavBar (From JSON) -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center py-sm px-xs pb-safe bg-surface/90 dark:bg-surface/90 backdrop-blur-xl border-t border-white/5 shadow-[0_-4px_20px_rgba(0,0,0,0.4)] z-50 rounded-t-xl">

<span class="font-label-md text-[10px] leading-tight">Home</span>

<span class="font-label-md text-[10px] leading-tight">Deliveries</span>
</a>
<a class="flex flex-col items-center justify-center text-primary font-bold hover:bg-surface-variant/20 rounded-lg transition-colors active:scale-90 duration-200 p-2 w-16" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">payments</span>
<span class="font-label-md text-[10px] leading-tight">Earnings</span>

<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant/20 rounded-lg transition-colors active:scale-90 duration-200 p-2 w-16" href="#">
<span class="material-symbols-outlined mb-1">notifications</span>
<span class="font-label-md text-[10px] leading-tight">Alerts</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant/20 rounded-lg transition-colors active:scale-90 duration-200 p-2 w-16" href="#">
<span class="material-symbols-outlined mb-1">person</span>
<span class="font-label-md text-[10px] leading-tight">Profile</span>
</a>
</nav>
