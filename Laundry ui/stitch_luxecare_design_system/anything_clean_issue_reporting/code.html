<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Report Delivery Issue</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-surface": "#e5e2e3",
                        "error": "#ffb4ab",
                        "surface-container-highest": "#353436",
                        "surface-container": "#201f20",
                        "primary-fixed": "#efdbff",
                        "primary": "#dcb8ff",
                        "tertiary": "#c8c6c8",
                        "outline": "#988ca0",
                        "tertiary-container": "#646365",
                        "surface-container-low": "#1c1b1c",
                        "on-secondary": "#303032",
                        "surface-container-lowest": "#0e0e0f",
                        "primary-fixed-dim": "#dcb8ff",
                        "surface": "#131314",
                        "on-tertiary-container": "#e3e0e2",
                        "secondary-fixed-dim": "#c8c6c8",
                        "on-error-container": "#ffdad6",
                        "success-bg": "#1A3D24",
                        "on-tertiary": "#303032",
                        "on-primary-fixed": "#2c0051",
                        "on-secondary-fixed": "#1b1b1d",
                        "inverse-surface": "#e5e2e3",
                        "on-tertiary-fixed": "#1b1b1d",
                        "surface-variant": "#353436",
                        "on-error": "#690005",
                        "on-primary-container": "#eed9ff",
                        "primary-container": "#8a2be2",
                        "on-background": "#e5e2e3",
                        "error-container": "#93000a",
                        "on-secondary-fixed-variant": "#474648",
                        "outline-variant": "#4c4354",
                        "error-red": "#ffb4ab",
                        "tertiary-fixed": "#e4e2e4",
                        "surface-dim": "#131314",
                        "secondary-fixed": "#e4e2e4",
                        "secondary-container": "#49494b",
                        "on-secondary-container": "#b9b8ba",
                        "surface-bright": "#39393a",
                        "inverse-on-surface": "#313031",
                        "electric-violet": "#8a2be2",
                        "on-tertiary-fixed-variant": "#474648",
                        "surface-tint": "#dcb8ff",
                        "success-green": "#81C784",
                        "tertiary-fixed-dim": "#c8c6c8",
                        "on-primary-fixed-variant": "#6700b5",
                        "background": "#131314",
                        "on-surface-variant": "#cfc2d7",
                        "surface-container-high": "#2a2a2b",
                        "inverse-primary": "#8422dc",
                        "secondary": "#c8c6c8",
                        "on-primary": "#480081"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"

                    "spacing": {
                        "lg": "24px",
                        "xl": "32px",
                        "3xl": "64px",
                        "md": "16px",
                        "sm": "8px",
                        "xs": "4px",
                        "2xl": "48px"
                    },
                    "fontFamily": {
                        "mono-display": ["monospace"],
                        "h3": ["Geist", "sans-serif"],
                        "label-md": ["Geist", "sans-serif"],
                        "display-lg": ["Geist", "sans-serif"],
                        "headline-lg": ["Geist", "sans-serif"],
                        "caption": ["Geist", "sans-serif"],

                        "h1": ["Geist", "sans-serif"]

                    "fontSize": {

                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],

                        "h1": ["28px", { "lineHeight": "36px", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Geist', sans-serif; background-color: #131314; color: #e5e2e3; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        [data-weight="fill"] .material-symbols-outlined { font-variation-settings: 'FILL' 1; }
        
        /* Custom Scrollbar for Textarea */
        textarea::-webkit-scrollbar { width: 6px; }
        textarea::-webkit-scrollbar-track { background: transparent; }
        textarea::-webkit-scrollbar-thumb { background: #353436; border-radius: 4px; }
        textarea::-webkit-scrollbar-thumb:hover { background: #4c4354; }

        /* Success Animation */
        @keyframes scaleIn {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .success-state { display: none; animation: scaleIn 0.3s ease-out forwards; }
        .form-state.hidden { display: none; }
    </style>
</head>
<body class="bg-background min-h-screen pb-safe">
<!-- App Bar -->
<header class="fixed top-0 w-full z-50 bg-surface/80 dark:bg-surface/80 backdrop-blur-xl border-b border-white/5">
<div class="flex items-center justify-between px-md h-16 w-full max-w-7xl mx-auto">
<button class="text-on-surface-variant hover:opacity-80 transition-opacity active:scale-95 flex items-center justify-center p-sm" onclick="window.history.back()">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-h1 text-h1 text-primary">Report an Issue</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</div>
</header>
<!-- Main Content -->
<main class="pt-2xl px-md max-w-xl mx-auto pb-3xl">
<!-- Form State -->
<div class="form-state space-y-lg mt-md" id="reportForm">
<!-- Booking Reference -->
<div class="bg-surface-container-low rounded-lg p-md border border-outline-variant/30 flex items-center justify-between">
<div>
<p class="font-caption text-caption text-on-surface-variant uppercase tracking-wider">Booking Reference</p>
<p class="font-mono-display text-mono-display text-on-surface mt-xs">QH-20260902-1041</p>
</div>
<span class="material-symbols-outlined text-outline" data-weight="fill">local_shipping</span>
</div>
<!-- Issue Type Selection -->
<section class="space-y-sm">
<h2 class="font-h3 text-h3 text-on-surface">What went wrong?</h2>
<div class="grid grid-cols-1 gap-sm">
<label class="relative flex items-center p-md bg-surface-container rounded-lg border border-outline-variant/20 cursor-pointer hover:bg-surface-container-high transition-colors focus-within:border-primary focus-within:ring-1 focus-within:ring-primary">
<input class="w-4 h-4 text-primary bg-surface-container-low border-outline-variant/50 focus:ring-primary focus:ring-offset-surface focus:ring-2" name="issueType" type="radio" value="wrong_item"/>
<span class="ml-md font-body-md text-body-md text-on-surface flex-1">Wrong Item</span>
<span class="material-symbols-outlined text-on-surface-variant">swap_horiz</span>
</label>
<label class="relative flex items-center p-md bg-surface-container rounded-lg border border-outline-variant/20 cursor-pointer hover:bg-surface-container-high transition-colors focus-within:border-primary focus-within:ring-1 focus-within:ring-primary">
<input class="w-4 h-4 text-primary bg-surface-container-low border-outline-variant/50 focus:ring-primary focus:ring-offset-surface focus:ring-2" name="issueType" type="radio" value="damaged_item"/>
<span class="ml-md font-body-md text-body-md text-on-surface flex-1">Damaged Item</span>
<span class="material-symbols-outlined text-on-surface-variant">broken_image</span>
</label>
<label class="relative flex items-center p-md bg-surface-container rounded-lg border border-outline-variant/20 cursor-pointer hover:bg-surface-container-high transition-colors focus-within:border-primary focus-within:ring-1 focus-within:ring-primary">
<input class="w-4 h-4 text-primary bg-surface-container-low border-outline-variant/50 focus:ring-primary focus:ring-offset-surface focus:ring-2" name="issueType" type="radio" value="customer_unavailable"/>
<span class="ml-md font-body-md text-body-md text-on-surface flex-1">Customer Unavailable</span>
<span class="material-symbols-outlined text-on-surface-variant">person_off</span>
</label>
<label class="relative flex items-center p-md bg-surface-container rounded-lg border border-outline-variant/20 cursor-pointer hover:bg-surface-container-high transition-colors focus-within:border-primary focus-within:ring-1 focus-within:ring-primary">
<input class="w-4 h-4 text-primary bg-surface-container-low border-outline-variant/50 focus:ring-primary focus:ring-offset-surface focus:ring-2" name="issueType" type="radio" value="safety_issue"/>
<span class="ml-md font-body-md text-body-md text-on-surface flex-1">Safety Issue</span>
<span class="material-symbols-outlined text-error">warning</span>
</label>
</div>
</section>
<!-- Description -->
<section class="space-y-sm">
<label class="font-h3 text-h3 text-on-surface block" for="description">Description</label>
<textarea class="w-full bg-surface-container-low border border-outline-variant/50 rounded-lg p-md font-body-md text-body-md text-on-surface placeholder:text-outline focus:border-primary focus:ring-1 focus:ring-primary transition-all resize-none" id="description" placeholder="Please provide additional details..." rows="4"></textarea>
</section>
<!-- Photo Upload -->
<section class="space-y-sm">
<h3 class="font-h3 text-h3 text-on-surface">Evidence</h3>
<div class="grid grid-cols-3 gap-sm">
<!-- Add Photo Button -->
<button class="aspect-square bg-surface-container-low border-2 border-dashed border-outline-variant rounded-lg flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-high hover:border-outline hover:text-on-surface transition-all group">
<span class="material-symbols-outlined mb-xs group-hover:scale-110 transition-transform">add_a_photo</span>
<span class="font-caption text-caption">Add Photo</span>
</button>
<!-- Image Preview Placeholder (Hidden initially in a real app, shown for design representation) -->
<div class="aspect-square rounded-lg bg-surface-container border border-outline-variant/30 overflow-hidden relative group">
<img class="w-full h-full object-cover opacity-80 group-hover:opacity-100 transition-opacity" data-alt="A macro shot of a damaged cardboard delivery box showing a dented corner. Corporate modern dark mode aesthetic, deep blacks, high-tech utilitarian style." src="https://lh3.googleusercontent.com/aida-public/AB6AXuC-5lHVfWgAd3LMhYlJzrHBmMSHN1mvc04UtSEx62jS_meMVckWTp3R-VinGGnQ2dwFafX5fl1CXdZamQxqcm50cUsiAi_nKsvXzwjoELAeSbkXFn2NyG9Ld6GE4j2z3UY79mqMqZHHt2oNpm4JsPFmDFyklX6EhzFkOuMJcOPuYdqcXoM6UebG-0WZpAovLnFMqwe-uwm3eNC5wbhDXIgpuP_NiAcrJ66HUXOZYFkxM_YsPT9uyI3Xiw"/>
<button class="absolute top-1 right-1 bg-surface-container-high/80 rounded-full p-1 text-on-surface opacity-0 group-hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-[16px]">close</span>
</button>
</div>
</div>
</section>
<!-- Submit Action -->
<div class="pt-md">
<button class="w-full bg-electric-violet hover:bg-primary-container text-white font-label-md text-label-md font-bold py-md rounded-lg shadow-lg shadow-primary/20 active:scale-95 transition-all flex items-center justify-center space-x-sm" id="submitBtn" type="button">
<span>Submit Issue</span>
<span class="material-symbols-outlined text-[20px]">send</span>
</button>
</div>
</div>
<!-- Success State -->
<div class="success-state flex flex-col items-center justify-center py-3xl text-center h-[60vh]" id="successState">
<div class="w-20 h-20 bg-success-bg rounded-full flex items-center justify-center mb-lg border-4 border-success-green/20">
<span class="material-symbols-outlined text-success-green text-[40px]">check_circle</span>
</div>
<h2 class="font-display-lg text-display-lg text-on-surface mb-sm">Report Submitted</h2>
<p class="font-body-md text-body-md text-on-surface-variant max-w-sm mx-auto mb-xl">
                Your issue for booking <span class="font-mono-display text-mono-display text-on-surface">QH-20260902-1041</span> has been recorded. Support will review it shortly.
            </p>
<button class="border border-outline-variant text-on-surface font-label-md text-label-md font-bold py-sm px-lg rounded-lg hover:bg-surface-container transition-colors" onclick="window.location.reload()">
                Return to Dashboard
            </button>
</div>
</main>
<!-- Navigation Shell (Hidden on this transactional screen per guidelines, but included structurally if needed later. Intentionally commented out or omitted entirely based on "Automatic Suppression" rule for Linear/Transactional/Task-Focused screens with a "Back" action.) -->
<script>
        document.getElementById('submitBtn').addEventListener('click', function() {
            // Simple interaction to show success state
            const btn = this;
            const originalContent = btn.innerHTML;
            
            // Loading state
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[20px]">progress_activity</span><span>Submitting...</span>';
            btn.disabled = true;
            btn.classList.add('opacity-80');

            setTimeout(() => {
                document.getElementById('reportForm').classList.add('hidden');
                document.getElementById('successState').style.display = 'flex';
                // Optional: Scroll to top
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }, 1500);
        });
    </script>
</body></html>
