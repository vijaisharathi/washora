<body class="bg-background text-on-surface font-body-md min-h-screen flex antialiased">
<!-- TopNavBar for Web -->
<nav class="hidden md:flex justify-between items-center px-xl py-md w-full max-w-[1200px] mx-auto bg-surface-container-low/80 backdrop-blur-md font-display-lg text-display-lg font-bold text-electric-violet docked full-width top-0 sticky z-50 border-b border-outline-variant/30 flat no shadows absolute left-0 right-0">
<div class="flex items-center gap-xl">
<span>Lumina Marketplace</span>
<div class="flex items-center gap-lg ml-xl font-label-md text-label-md">
<a class="text-on-surface-variant font-medium hover:text-primary transition-colors duration-200" href="#">Orders</a>
<a class="text-on-surface-variant font-medium hover:text-primary transition-colors duration-200" href="#">Inventory</a>
<a class="text-on-surface-variant font-medium hover:text-primary transition-colors duration-200" href="#">Analytics</a>
<a class="text-on-surface-variant font-medium hover:text-primary transition-colors duration-200" href="#">Vendors</a>
<a class="text-on-surface-variant font-medium hover:text-primary transition-colors duration-200" href="#">Settings</a>
</div>
</div>
<div class="flex items-center gap-lg">
<button class="bg-electric-violet text-on-primary font-bold px-lg py-sm rounded-full shadow-lg shadow-primary/20 scale-95 active:scale-90 transition-transform">Create Order</button>
<button class="text-electric-violet hover:text-primary transition-colors duration-200"><span class="material-symbols-outlined" data-icon="notifications">notifications</span></button>
<button class="text-electric-violet hover:text-primary transition-colors duration-200"><span class="material-symbols-outlined" data-icon="help_outline">help_outline</span></button>
<img alt="Administrator Profile" class="w-10 h-10 rounded-full border border-outline-variant/30 object-cover" data-alt="Administrator Profile avatar placeholder, futuristic lumina aesthetic, high tech user profile image, dark background with electric violet glow, 100 words" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBHRHxjaLXuIiqb83D0FmBS0_saWPeVzu6CgiuNThFu5u85kht4LZW8Z0SbvUm5XcEqnIlSgxiBr5Yx4JXZUMW2aMOchpQmXEPkGxJs9ke4mKBU61xqxIHa-nrrEwujp8bLw5GiTP7qEx1qrAFrYCOOavrSEIrGyCvIWtayszD3Xgasad6snqu8gqUvWSKaUoK_O1UY4YaaBRwuqmdwkLiaCT7MFNLhUYbHAkMaZB8S9In9i3QoEADvUw"/>
</div>
</nav>
<!-- SideNavBar for Context if needed, but per instructions 'Task-Focused: Any sub-page featuring a 'Close' or 'Back' action that implies a temporary departure from the main navigation flow.' Nav is suppressed. We are managing an order. -->
<main class="flex-1 w-full max-w-[1200px] mx-auto p-xl mt-3xl md:mt-0 flex flex-col gap-lg">
<!-- Header -->
<header class="flex flex-col gap-sm">
<div class="flex items-center gap-sm text-on-surface-variant cursor-pointer hover:text-primary transition-colors w-fit">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
<span class="font-label-md text-label-md">Back to Orders</span>
</div>
<h1 class="font-h1 text-h1 text-on-surface">Manage Order</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Choose what you'd like to do.</p>
</header>
<!-- Order Summary Bar -->
<section class="bg-surface-container border border-outline-variant/20 rounded-xl p-lg flex flex-col sm:flex-row justify-between items-start sm:items-center gap-md">
<div class="flex flex-col gap-xs">
<span class="font-h3 text-h3 text-on-surface">Sneaker Deep Clean</span>
<span class="font-label-md text-label-md text-on-surface-variant">at CleanX Service Center</span>
</div>
<div class="bg-success-bg text-success-green px-md py-sm rounded-full font-label-md text-label-md font-bold uppercase tracking-wider text-[10px] flex items-center gap-xs">
<span class="w-2 h-2 rounded-full bg-success-green"></span>
                Pickup Scheduled
            </div>
</section>
<!-- Action Grid (Visual Tiles) -->
<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-md">
<!-- Track Order -->
<button class="group bg-surface-container-low border border-outline-variant/30 rounded-xl p-lg flex flex-col items-start gap-md hover:border-primary/50 hover:bg-surface-container transition-all text-left">
<div class="bg-surface-container-highest p-sm rounded-lg text-primary group-hover:bg-electric-violet/20 transition-colors">
<span class="material-symbols-outlined" data-icon="map">map</span>
</div>
<div class="flex flex-col gap-xs">
<span class="font-h3 text-h3 text-on-surface">Track Order</span>
<span class="font-caption text-caption text-on-surface-variant">View live status and location updates.</span>
</div>
</button>
<!-- Reschedule Pickup -->
<button class="group bg-surface-container-low border border-outline-variant/30 rounded-xl p-lg flex flex-col items-start gap-md hover:border-primary/50 hover:bg-surface-container transition-all text-left">
<div class="bg-surface-container-highest p-sm rounded-lg text-primary group-hover:bg-electric-violet/20 transition-colors">
<span class="material-symbols-outlined" data-icon="calendar_month">calendar_month</span>
</div>
<div class="flex flex-col gap-xs">
<span class="font-h3 text-h3 text-on-surface">Reschedule Pickup</span>
<span class="font-caption text-caption text-on-surface-variant">Choose a new time for collection.</span>
</div>
</button>
<!-- Change Address -->
<button class="group bg-surface-container-low border border-outline-variant/30 rounded-xl p-lg flex flex-col items-start gap-md hover:border-primary/50 hover:bg-surface-container transition-all text-left relative overflow-hidden">
<div class="bg-surface-container-highest p-sm rounded-lg text-primary group-hover:bg-electric-violet/20 transition-colors">
<span class="material-symbols-outlined" data-icon="location_on">location_on</span>
</div>
<div class="flex flex-col gap-xs">
<span class="font-h3 text-h3 text-on-surface">Change Address</span>
<span class="font-caption text-caption text-on-surface-variant">Modify your delivery or pickup details.</span>
</div>
<div class="mt-auto pt-sm w-full border-t border-outline-variant/20">
<span class="font-caption text-caption text-error-red flex items-center gap-xs">
<span class="material-symbols-outlined text-[14px]" data-icon="info">info</span>
                        Address changes are no longer available after pickup.
                    </span>
</div>
</button>
<!-- View Receipt -->
<button class="group bg-surface-container-low border border-outline-variant/30 rounded-xl p-lg flex flex-col items-start gap-md hover:border-primary/50 hover:bg-surface-container transition-all text-left">
<div class="bg-surface-container-highest p-sm rounded-lg text-primary group-hover:bg-electric-violet/20 transition-colors">
<span class="material-symbols-outlined" data-icon="receipt_long">receipt_long</span>
</div>
<div class="flex flex-col gap-xs">
<span class="font-h3 text-h3 text-on-surface">View Receipt</span>
<span class="font-caption text-caption text-on-surface-variant">Download or print your order invoice.</span>
</div>
</button>
<!-- Contact Support -->
<button class="group bg-surface-container-low border border-outline-variant/30 rounded-xl p-lg flex flex-col items-start gap-md hover:border-primary/50 hover:bg-surface-container transition-all text-left">
<div class="bg-surface-container-highest p-sm rounded-lg text-primary group-hover:bg-electric-violet/20 transition-colors">
<span class="material-symbols-outlined" data-icon="help">help</span>
</div>
<div class="flex flex-col gap-xs">
<span class="font-h3 text-h3 text-on-surface">Contact Support</span>
<span class="font-caption text-caption text-on-surface-variant">Get help with your order from our team.</span>
</div>
</button>
<!-- Cancel Order (Destructive) -->
<button class="group bg-error-container/10 border border-error-red/30 rounded-xl p-lg flex flex-col items-start gap-md hover:bg-error-container/20 hover:border-error-red/50 transition-all text-left">
<div class="bg-error-red/20 p-sm rounded-lg text-error-red">
<span class="material-symbols-outlined" data-icon="cancel">cancel</span>
</div>
<div class="flex flex-col gap-xs">
<span class="font-h3 text-h3 text-error-red">Cancel Order</span>
<span class="font-caption text-caption text-error-red/80">Stop this service and request a refund.</span>
</div>
</button>
</div>
</main>
</body></html>
