<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>

<title>Delivery Pro - Active Delivery</title>

                        "surface-variant": "#353436",
                        "on-primary-fixed": "#2c0051",

                    },
                    "fontFamily": {
                        "display-lg-mobile": ["Geist"],

<style>
        @import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap');
        body { font-family: 'Geist', sans-serif; }
        
        /* Utility for safe areas on mobile devices */
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        .pt-safe { padding-top: env(safe-area-inset-top); }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col antialiased selection:bg-primary/30 selection:text-primary">
<!-- Active Delivery Top Bar -->
<header class="fixed top-0 w-full z-50 shadow-sm border-b border-white/5 bg-surface/80 backdrop-blur-md">
<div class="flex items-center justify-between px-md h-16 w-full pt-safe">
<button aria-label="Back" class="text-on-surface-variant hover:bg-surface-variant/50 p-2 rounded-full active:scale-95 transition-transform">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="flex flex-col items-center justify-center">
<span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Pickup</span>
<span class="font-headline-md text-headline-md-mobile font-bold text-primary dark:text-primary">#ORD-2024-88A</span>
</div>
<button aria-label="Support" class="text-on-surface-variant hover:bg-surface-variant/50 p-2 rounded-full active:scale-95 transition-transform">
<span class="material-symbols-outlined">help</span>
</button>
</div>
</header>
<!-- Map Canvas Area -->
<main class="flex-grow relative w-full h-full">
<!-- Interactive Map Background -->
<div class="absolute inset-0 w-full h-full bg-surface-container-lowest" data-alt="A detailed, modern dark mode map view of a city grid. The map uses deep blacks and grays, with bright, high-contrast neon purple and blue routes indicating a delivery path. Glowing location pins highlight pickup and drop-off points. The style is sleek, technological, and premium glassmorphism." data-location="New York City" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDLdIOqDe3LPKw5H1jJGFUDOuRd-M113xke-O1ypYzenyWPkeKgs-HOpcENe1LkwYZWYQWDeHeBsYsOOxrzRUPrQ2jLeqxOUlxpuH6kOEvjdr7soVFjQvdTolYp_kZCjSPmQf7s4yHxYz-C7FHDwJY1WgbvHw28qQ8yAhfBbeYDBsBle_a6_z-ICPFERBrP8NqhXkCCmh6Ctle44XHv8I_txODbHYuguMkUTAfEZIm_nLtJcy_Y6mn8vA'); background-size: cover; background-position: center;">
<!-- Simulated Map UI Elements -->
<!-- Origin Pin -->
<div class="absolute top-1/2 left-1/3 transform -translate-x-1/2 -translate-y-1/2 z-10">
<div class="w-12 h-12 bg-surface/80 backdrop-blur-md rounded-full border border-white/10 shadow-lg flex items-center justify-center relative">
<div class="w-4 h-4 bg-tertiary rounded-full"></div>
<!-- Pulse effect -->
<div class="absolute inset-0 w-full h-full bg-tertiary/20 rounded-full animate-ping"></div>
</div>
</div>
<!-- Route Line Simulation -->
<svg class="absolute inset-0 w-full h-full pointer-events-none" preserveaspectratio="none" viewbox="0 0 1000 1000">
<path class="opacity-70 animate-[dash_20s_linear_infinite]" d="M 333 500 C 400 450, 500 600, 666 400" fill="none" stroke="#dcb8ff" stroke-dasharray="10 15" stroke-linecap="round" stroke-width="6"></path>
</svg>
<!-- Destination Pin -->
<div class="absolute top-[40%] left-[66%] transform -translate-x-1/2 -translate-y-1/2 z-10">
<div class="w-16 h-16 bg-primary-container/20 backdrop-blur-xl rounded-full border border-primary/30 shadow-[0_0_20px_rgba(220,184,255,0.3)] flex items-center justify-center relative">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">storefront</span>
<!-- Distance Badge Floating -->
<div class="absolute -top-6 bg-surface-container-high px-3 py-1 rounded-full border border-white/5 shadow-md flex items-center gap-1">
<span class="font-label-md text-label-md text-primary">1.2 km</span>
</div>
</div>
</div>
<!-- Recenter Button -->
<button class="absolute bottom-[280px] right-md w-12 h-12 bg-surface/90 backdrop-blur-md rounded-full border border-white/10 shadow-lg flex items-center justify-center text-on-surface hover:bg-surface-variant transition-colors z-20">
<span class="material-symbols-outlined">my_location</span>
</button>
</div>
</main>
<!-- Bottom Action Card (Drawer) -->
<div class="fixed bottom-0 w-full z-40">
<div class="bg-surface/90 backdrop-blur-2xl border-t border-white/10 shadow-[0_-8px_30px_rgba(0,0,0,0.5)] rounded-t-[32px] px-lg pt-sm pb-xl flex flex-col">
<!-- Drag Handle -->
<div class="w-12 h-1.5 bg-surface-variant rounded-full mx-auto mb-md"></div>
<!-- ETA and Info Header -->
<div class="flex items-end justify-between mb-lg">
<div>
<h2 class="font-display-lg-mobile text-display-lg-mobile text-on-surface mb-1">5 <span class="font-headline-lg text-headline-lg text-on-surface-variant">min</span></h2>
<p class="font-body-md text-body-md text-on-surface-variant flex items-center gap-1">
<span class="material-symbols-outlined text-sm">schedule</span> Arrive by 14:35
                    </p>
</div>
<!-- Navigation Shortcuts -->
<div class="flex gap-sm">
<button class="w-10 h-10 rounded-full bg-surface-container-high border border-white/5 flex items-center justify-center text-on-surface hover:bg-surface-variant transition-colors group">
<span class="material-symbols-outlined text-lg group-hover:text-primary transition-colors">map</span>
</button>
<button class="w-10 h-10 rounded-full bg-surface-container-high border border-white/5 flex items-center justify-center text-on-surface hover:bg-surface-variant transition-colors group">
<span class="material-symbols-outlined text-lg group-hover:text-primary transition-colors">directions_car</span>
</button>
</div>
</div>
<!-- Pickup Details -->
<div class="bg-surface-container-low rounded-xl p-md border border-white/5 mb-lg flex items-center justify-between">
<div class="flex items-center gap-md">
<div class="w-12 h-12 bg-surface-container-highest rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">restaurant</span>
</div>
<div>
<h3 class="font-headline-md text-headline-md-mobile text-on-surface">Gourmet Kitchen</h3>
<p class="font-body-md text-body-md text-on-surface-variant line-clamp-1">128 Culinary Ave, Tech District</p>
</div>
</div>
<!-- Contact Options -->
<div class="flex gap-2">
<button class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-on-surface hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-lg">chat</span>
</button>
<button class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-on-surface hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-lg">call</span>
</button>
</div>
</div>
<!-- Primary Action -->
<button class="w-full bg-primary text-on-primary font-headline-md text-headline-md-mobile py-4 rounded-xl shadow-[0_0_20px_rgba(220,184,255,0.2)] active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-2">
<span class="material-symbols-outlined">navigation</span>
                Navigate to Pickup
            </button>
</div>
</div>
<style>
        @keyframes dash {
            to {
                stroke-dashoffset: -100;
            }
        }
    </style>
</body></html>
