<style>
        body { font-family: 'Geist', sans-serif; }
        .map-bg {
            background-color: #1a1a1c;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
        }
        
        .pulse-ring {
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            80%, 100% { opacity: 0; }
        }

        .countdown-svg {
            transform: rotate(-90deg);
        }
        .countdown-circle {
            stroke-dasharray: 283;
            stroke-dashoffset: 0;
            animation: countdown 30s linear forwards;
        }
        @keyframes countdown {
            from { stroke-dashoffset: 0; }
            to { stroke-dashoffset: 283; }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);

<body class="bg-background text-on-background h-screen w-screen overflow-hidden flex flex-col relative">
<!-- Map Background -->
<div class="absolute inset-0 z-0 map-bg flex items-center justify-center">
<!-- Mock Map Markers -->
<div class="absolute top-[30%] left-[40%] relative">
<div class="w-4 h-4 bg-primary rounded-full z-10 relative"></div>
<div class="absolute inset-0 rounded-full bg-primary pulse-ring w-12 h-12 -top-4 -left-4"></div>
<div class="absolute top-6 -left-8 bg-surface-container-high px-3 py-1 rounded-full text-caption font-caption whitespace-nowrap shadow-md border border-white/5">Pickup Location</div>
</div>
<!-- Route Line (Mock) -->
<svg class="absolute inset-0 w-full h-full pointer-events-none opacity-30" style="z-index: 5;">
<path class="animate-pulse" d="M 40% 30% Q 50% 50% 60% 70%" fill="none" stroke="#dcb8ff" stroke-dasharray="8 8" stroke-width="3"></path>
</svg>
<div class="absolute top-[70%] left-[60%]">
<span class="material-symbols-outlined text-primary text-3xl drop-shadow-lg" data-icon="navigation" data-weight="fill" style="font-variation-settings: 'FILL' 1;">navigation</span>
</div>
</div>
<!-- Top App Bar (Suppressed due to immersive transaction intent, using minimal header overlay) -->
<div class="absolute top-0 w-full z-20 px-md py-md flex justify-between items-center bg-gradient-to-b from-background/80 to-transparent">
<div class="font-headline-md text-headline-md-mobile font-bold text-primary drop-shadow-md">Delivery Pro</div>
</div>
<!-- Urgent Request Bottom Sheet -->
<div class="absolute bottom-0 w-full z-30 bg-surface/95 backdrop-blur-2xl rounded-t-3xl border-t border-white/10 shadow-[0_-8px_30px_rgba(0,0,0,0.5)] transform transition-transform duration-300 translate-y-0 flex flex-col">
<!-- Handle -->
<div class="w-full flex justify-center pt-sm pb-2">
<div class="w-12 h-1 bg-on-surface-variant/30 rounded-full"></div>
</div>
<div class="p-lg flex flex-col gap-lg">
<!-- Header & Countdown -->
<div class="flex justify-between items-start">
<div>
<div class="inline-flex items-center gap-xs px-2 py-1 rounded-sm bg-primary-container/20 text-primary mb-2">
<span class="material-symbols-outlined text-sm" data-icon="bolt">bolt</span>
<span class="font-label-md text-label-md font-bold uppercase tracking-wider">New Request</span>
</div>
<h2 class="font-display-lg-mobile text-display-lg-mobile text-on-surface mb-xs">Shoe Cleaning Pickup</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Residential Collection</p>
</div>
<!-- Countdown Ring -->
<div class="relative w-[64px] h-[64px] flex items-center justify-center">
<svg class="countdown-svg w-full h-full" viewbox="0 0 100 100">
<circle cx="50" cy="50" fill="none" r="45" stroke="#2a2a2b" stroke-width="6"></circle>
<circle class="countdown-circle" cx="50" cy="50" fill="none" r="45" stroke="#dcb8ff" stroke-linecap="round" stroke-width="6"></circle>
</svg>
<div class="absolute inset-0 flex items-center justify-center">
<span class="font-headline-md text-headline-md-mobile text-primary" id="timer">30</span>
</div>
</div>
</div>
<!-- Key Metrics -->
<div class="grid grid-cols-3 gap-sm bg-surface-container-low p-md rounded-xl border border-white/5">
<div class="flex flex-col items-center justify-center border-r border-white/10">
<span class="font-caption text-caption text-on-surface-variant mb-1">Earnings</span>
<span class="font-headline-lg text-headline-lg-mobile text-on-surface">₹48</span>
</div>
<div class="flex flex-col items-center justify-center border-r border-white/10">
<span class="font-caption text-caption text-on-surface-variant mb-1">Distance</span>
<span class="font-headline-lg text-headline-lg-mobile text-on-surface">2.4<span class="text-lg">km</span></span>
</div>
<div class="flex flex-col items-center justify-center">
<span class="font-caption text-caption text-on-surface-variant mb-1">Pickup In</span>
<span class="font-headline-lg text-headline-lg-mobile text-on-surface">8<span class="text-lg">m</span></span>
</div>
</div>
<!-- Actions -->
<div class="flex gap-md mt-sm mb-safe pb-md">
<button class="flex-1 py-lg border-2 border-outline-variant rounded-xl font-label-md text-label-md text-on-surface-variant hover:bg-surface-container-high transition-colors flex items-center justify-center gap-2">
<span class="material-symbols-outlined" data-icon="close">close</span>
                    Decline
                </button>
<button class="flex-[2] py-lg bg-primary text-on-primary rounded-xl font-headline-md text-headline-md-mobile shadow-lg shadow-primary/20 hover:bg-primary-fixed active:scale-[0.98] transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined" data-icon="check_circle">check_circle</span>
                    Accept Delivery
                </button>
</div>
</div>
</div>
<!-- Bottom Nav Bar (Suppressed due to transaction intent - "Automatic Suppression" rule) -->
<script>
        // Simple countdown logic for visual flair
        let timeLeft = 30;
        const timerEl = document.getElementById('timer');
        const interval = setInterval(() => {
            timeLeft--;
            timerEl.textContent = timeLeft;
            if (timeLeft <= 0) clearInterval(interval);
        }, 1000);
    </script>
