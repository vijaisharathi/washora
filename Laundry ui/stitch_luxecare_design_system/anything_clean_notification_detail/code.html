<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>

        tailwind.config = {

                      "error": "#ffb4ab",
                      "primary-fixed": "#efdbff",
                      "outline": "#988ca0",
                      "surface-dim": "#131314",
                      "success-green": "#81C784",

                      "inverse-surface": "#e5e2e3",
                      "secondary-container": "#49494b",
                      "surface-container-lowest": "#0e0e0f",
                      "on-primary": "#480081",
                      "inverse-on-surface": "#313031",
                      "background": "#131314",
                      "on-background": "#e5e2e3",
                      "surface-bright": "#39393a",
                      "surface-container-highest": "#353436",
                      "on-secondary-container": "#b9b8ba",
                      "success-bg": "#1A3D24",
                      "on-surface": "#e5e2e3",

                      "on-primary-fixed": "#2c0051",

                      "surface-tint": "#dcb8ff",

              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "xl": "32px",
                      "xs": "4px",
                      "sm": "8px",
                      "lg": "24px",
                      "md": "16px",
                      "2xl": "48px",
                      "3xl": "64px",
                      "safe": "env(safe-area-inset-bottom)"

              "fontFamily": {

<style>
        body { background-color: #131314; color: #e5e2e3; font-family: 'Geist', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined[data-weight="fill"] {
            font-variation-settings: 'FILL' 1;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex justify-center items-start pt-8 pb-8">
<!-- Mobile Container (390px) -->
<div class="w-[390px] h-[844px] bg-surface relative overflow-hidden flex flex-col shadow-2xl rounded-[40px] border-[8px] border-surface-container-highest box-border">
<!-- TopAppBar -->
<header class="fixed top-0 w-[374px] z-50 backdrop-blur-md border-b border-outline-variant/30 bg-surface-dim/80 flex justify-between items-center px-lg h-16 transition-transform">
<button aria-label="Go back" class="text-primary hover:bg-surface-container-high transition-colors p-sm rounded-full flex items-center justify-center active:scale-95 transition-transform">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-h3 text-h3 font-bold text-on-surface">Notification</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 mt-16 px-md py-lg overflow-y-auto flex flex-col gap-lg">
<!-- Context & Subject -->
<div class="flex flex-col gap-xs pt-sm">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary text-sm" data-icon="inventory_2" data-weight="fill">inventory_2</span>
<span class="font-label-md text-label-md text-primary uppercase tracking-wider">Delivery Update</span>
</div>
<h2 class="font-h1 text-h1 text-on-surface mt-sm">Your pickup for QH-20260902-1041 is ready to start.</h2>
<div class="font-caption text-caption text-on-surface-variant mt-xs">Sep 2, 2026 · 10:41 AM</div>
</div>
<hr class="border-outline-variant/30 border-t"/>
<!-- Status Block -->
<div class="bg-surface-container rounded-xl p-md border border-outline-variant/20 flex flex-col gap-sm">
<span class="font-label-md text-label-md text-on-surface-variant">Current Status</span>
<div class="flex items-center gap-sm">
<div class="px-3 py-1 rounded-full bg-electric-violet/20 text-electric-violet font-label-md text-label-md border border-electric-violet/30 flex items-center gap-xs">
<span class="material-symbols-outlined text-sm" data-icon="pending_actions">pending_actions</span>
                        Pickup Required
                    </div>
</div>
<p class="font-body-md text-body-md text-on-surface mt-xs">Please proceed to the pickup location as soon as possible to ensure timely delivery.</p>
</div>
<!-- Spacer -->
<div class="flex-1"></div>
<!-- Action Area -->
<div class="flex flex-col gap-md pb-md">
<button class="w-full bg-electric-violet text-on-primary font-label-md text-label-md font-bold py-md px-lg rounded-lg shadow-lg shadow-primary/20 hover:bg-electric-violet/90 active:scale-[0.98] transition-all flex justify-center items-center gap-sm">
<span class="material-symbols-outlined" data-icon="local_shipping">local_shipping</span>
                    View Delivery
                </button>
<button class="w-full bg-transparent text-on-surface-variant border border-outline-variant font-label-md text-label-md py-md px-lg rounded-lg hover:bg-surface-container active:scale-[0.98] transition-all flex justify-center items-center gap-sm">
<span class="material-symbols-outlined" data-icon="done_all">done_all</span>
                    Mark as Read
                </button>
</div>
</main>
<!-- Navigation Suppressed for Detail/Task-Focused View -->
</div>
</body></html>
