<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Notification Detail</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                    "surface": "#131314",

                    "primary-container": "#8a2be2",
                    "background": "#131314",
                    "surface-container-highest": "#353436",
                    "tertiary": "#c8c6c8",
                    "surface-container-high": "#2a2a2b",
                    "surface-tint": "#dcb8ff",
                    "on-secondary-fixed": "#1b1b1d",
                    "on-tertiary-container": "#e3e0e2",
                    "on-surface-variant": "#cfc2d7",

                    "2xl": "48px",

<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-background antialiased min-h-screen flex flex-col font-body-md overflow-x-hidden w-[390px] mx-auto relative border-x border-white/5">
<!-- Top App Bar -->
<header class="fixed top-0 w-[390px] z-50 flex items-center justify-between px-md h-16 border-b border-white/5 bg-surface/80 backdrop-blur-md shadow-sm">
<button class="flex items-center justify-center w-12 h-12 rounded-full hover:bg-surface-variant/50 active:scale-95 transition-transform text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary">Delivery Pro</h1>
<div class="w-12"></div> <!-- Spacer for balance -->
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col pt-24 pb-3xl px-md gap-lg z-10 relative mt-16">
<!-- Ambient Glow -->
<div class="absolute top-0 left-1/2 -translate-x-1/2 w-[250px] h-[250px] bg-primary/10 rounded-full blur-[80px] -z-10 pointer-events-none"></div>
<!-- Notification Header -->
<div class="flex flex-col items-center text-center gap-sm mt-lg">
<div class="w-24 h-24 rounded-full bg-surface-container flex items-center justify-center mb-md border border-white/5 shadow-[inset_0_1px_3px_rgba(255,255,255,0.05)] relative">
<div class="absolute inset-0 rounded-full bg-primary/5"></div>
<span class="material-symbols-outlined text-[48px] text-primary" data-weight="fill" style="font-variation-settings: 'FILL' 1;">account_balance</span>
</div>
<h2 class="font-headline-lg text-headline-lg text-on-surface">Payout completed</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Just now</p>
</div>
<!-- Context Card -->
<div class="bg-surface rounded-xl p-lg border border-white/5 shadow-[inset_0_1px_2px_rgba(255,255,255,0.02)] flex flex-col gap-md mt-md">
<div class="flex justify-between items-center py-sm border-b border-white/5">
<span class="font-body-md text-body-md text-on-surface-variant">Payout ID</span>
<span class="font-label-md text-label-md text-on-surface">PO-10242</span>
</div>
<div class="flex justify-between items-center py-sm border-b border-white/5">
<span class="font-body-md text-body-md text-on-surface-variant">Amount</span>
<span class="font-headline-md text-headline-md text-primary font-bold">₹860</span>
</div>
<div class="flex justify-between items-center py-sm">
<span class="font-body-md text-body-md text-on-surface-variant">Status</span>
<div class="flex items-center gap-xs bg-primary-container/20 px-sm py-[2px] rounded-full">
<span class="material-symbols-outlined text-[14px] text-primary" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-caption text-caption text-primary font-bold uppercase tracking-wider">COMPLETED</span>
</div>
</div>
</div>
<p class="font-body-md text-body-md text-on-surface-variant text-center px-md mt-sm">
            Your earnings have been successfully transferred to your registered bank account. It may take up to 24 hours to reflect in your statement.
        </p>
</main>
<!-- Bottom Action Area -->
<div class="fixed bottom-0 w-[390px] p-md bg-surface/90 backdrop-blur-xl border-t border-white/5 z-50 pb-safe">
<button class="w-full bg-primary text-on-primary font-label-md text-label-md h-14 rounded-xl flex items-center justify-center hover:bg-primary-fixed-dim transition-colors active:scale-[0.98]">
            View Payout
        </button>
</div>
</body></html>
