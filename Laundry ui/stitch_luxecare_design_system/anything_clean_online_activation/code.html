<style>

            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.filled {
            font-variation-settings: 'FILL' 1;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .animate-slide-up {
            animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        .animate-fade-in {
            animation: fadeIn 0.2s ease-out forwards;
        }

<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-background font-body-md min-h-screen relative overflow-hidden flex flex-col items-center antialiased">
<!-- Mock Background (Dashboard Dimmed) -->

<div class="flex items-center gap-sm">
<div class="w-8 h-8 rounded-full bg-surface-container overflow-hidden">
<img class="w-full h-full object-cover" data-alt="A close-up portrait of a professional delivery rider wearing a modern, subtle dark helmet and a sleek black jacket, looking confidently towards the camera. The lighting is moody and cinematic, highlighting their features against a blurred urban background at night, fitting a premium service app profile picture." src="https://lh3.googleusercontent.com/aida-public/AB6AXuB_mmqxIkx_Lc9ZpybkxCxBD_4egclw9p7c3_-BOyKyyfW3Nw6ye0nsxccidw6f9jUyH_eICxFTTLbUuzc-Qng-ZsFA3uIqCHGfNyR9J2AT9iK5H7Eil9cg1m2UCXAjD8FnLCOKYmYzD0hi8YK_DHk5nGC2WZqbJstCnY4waXNqYSi5joTb9o7IufAi27Ja75CXS8rGj9DySo4LYT7DnxBGwWHF3fFH0OsZuP2kCqOk4asWtBpMBP4WNg"/>

<h1 class="font-headline-md text-headline-md-mobile text-primary">Partner Portal</h1>
</div>
<span class="material-symbols-outlined text-on-surface-variant hover:opacity-80 transition-opacity active:scale-95">sensors</span>
</header>
<!-- Mock Bottom Nav (JSON) -->
<nav class="fixed bottom-0 w-full z-10 flex justify-around items-center h-20 px-md pb-safe bg-surface/90 backdrop-blur-xl border-t border-white/5 rounded-t-xl md:hidden">
<button class="flex flex-col items-center justify-center text-primary bg-primary-container/10 rounded-xl px-sm py-xs">
<span class="material-symbols-outlined">home</span>
<span class="font-label-md text-label-md">Home</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary/80 transition-colors active:scale-90">
<span class="material-symbols-outlined">local_shipping</span>
<span class="font-label-md text-label-md">Deliveries</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary/80 transition-colors active:scale-90">
<span class="material-symbols-outlined">payments</span>
<span class="font-label-md text-label-md">Earnings</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary/80 transition-colors active:scale-90">
<span class="material-symbols-outlined">notifications</span>
<span class="font-label-md text-label-md">Alerts</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary/80 transition-colors active:scale-90">
<span class="material-symbols-outlined">person</span>
<span class="font-label-md text-label-md">Profile</span>
</button>

<!-- Subtle Top Glow -->
<div class="absolute top-0 left-1/2 -translate-x-1/2 w-32 h-1 bg-primary/20 blur-md"></div>

<div class="w-12 h-1.5 bg-surface-variant rounded-full mx-auto mt-2 mb-sm"></div>
<!-- Header -->
<div class="text-center flex flex-col gap-sm">
<h2 class="font-headline-lg text-headline-lg-mobile text-on-surface">Ready to start delivering?</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Review your current settings before going online.</p>
</div>
<!-- Details Cards (Bento-style layout) -->
<div class="grid grid-cols-2 gap-sm">
<!-- Location -->
<div class="col-span-2 bg-surface-container-low rounded-2xl p-md border border-white/5 flex items-center gap-md">
<div class="w-12 h-12 rounded-xl bg-surface-container flex items-center justify-center text-primary-fixed">
<span class="material-symbols-outlined filled">location_on</span>
</div>
<div class="flex-1">
<p class="font-caption text-caption text-on-surface-variant uppercase tracking-wider">Current Zone</p>
<p class="font-body-lg text-body-lg text-on-surface">Anna Nagar, Chennai</p>
</div>
<button class="text-primary hover:text-primary-fixed transition-colors">
<span class="material-symbols-outlined">edit</span>
</button>
</div>
<!-- Vehicle -->
<div class="bg-surface-container-low rounded-2xl p-md border border-white/5 flex flex-col gap-sm items-start">
<div class="w-10 h-10 rounded-lg bg-surface-container flex items-center justify-center text-secondary">
<span class="material-symbols-outlined">two_wheeler</span>
</div>
<div>
<p class="font-caption text-caption text-on-surface-variant uppercase tracking-wider">Vehicle</p>
<p class="font-body-md text-body-md text-on-surface font-medium">Bike</p>
</div>
</div>

<div class="w-10 h-10 rounded-lg bg-surface-container flex items-center justify-center text-secondary">
<span class="material-symbols-outlined">radar</span>
</div>
<div>
<p class="font-caption text-caption text-on-surface-variant uppercase tracking-wider">Radius</p>
<p class="font-body-md text-body-md text-on-surface font-medium">Within 5 km</p>
</div>
</div>
</div>
<!-- Status -->
<div class="flex items-center justify-center gap-sm bg-primary-container/5 rounded-xl py-sm px-md border border-primary/10">
<span class="material-symbols-outlined text-primary text-xl filled">check_circle</span>
<span class="font-label-md text-label-md text-primary-fixed">Location access enabled</span>
</div>

<div class="flex flex-col gap-md mt-sm">
<button class="w-full bg-primary hover:bg-primary-fixed text-on-primary font-headline-md text-headline-md-mobile py-md rounded-2xl transition-all active:scale-[0.98] flex items-center justify-center gap-sm">
<span class="material-symbols-outlined">power_settings_new</span>
                    GO ONLINE

<button class="w-full bg-transparent border border-outline-variant hover:border-outline text-on-surface-variant hover:text-on-surface font-label-md text-label-md py-sm rounded-xl transition-all active:scale-[0.98]">
