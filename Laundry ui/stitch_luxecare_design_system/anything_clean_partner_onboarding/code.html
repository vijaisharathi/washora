<body class="bg-background text-on-surface font-body-md h-screen flex flex-col overflow-hidden">
<!-- Top Navigation for Onboarding (Simplified as it's a linear process) -->
<header class="flex items-center justify-between px-md h-16 w-full max-w-7xl mx-auto border-b border-outline-variant/30 bg-surface/80 backdrop-blur-xl shrink-0 z-50">
<button class="text-on-surface-variant hover:opacity-80 transition-opacity active:scale-95 flex items-center justify-center p-sm rounded-full bg-surface-container-low/50">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<div class="font-h3 text-h3 font-bold text-primary">Delivery Portal</div>
<div class="w-10"></div> <!-- Spacer for balance -->
</header>
<!-- Main Content Area -->
<main class="flex-1 overflow-y-auto pb-3xl">
<div class="max-w-md mx-auto px-md py-lg space-y-xl">
<!-- Header Section -->
<div class="space-y-sm text-center">
<h1 class="font-headline-lg text-headline-lg text-on-surface">Become a Delivery Partner</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Deliver better. Earn on your schedule.</p>
</div>
<!-- Progress Indicator -->
<div class="px-sm">
<div class="flex items-center justify-between mb-sm relative">
<!-- Progress Line -->
<div class="absolute top-1/2 left-0 w-full h-1 -translate-y-1/2 bg-surface-container-high rounded-full z-0"></div>
<div class="absolute top-1/2 left-0 w-1/4 h-1 -translate-y-1/2 bg-primary rounded-full z-0 shadow-[0_0_10px_rgba(220,184,255,0.4)]"></div>
<!-- Steps -->
<div class="relative z-10 flex flex-col items-center gap-2">
<div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center shadow-[0_0_15px_rgba(220,184,255,0.3)]">
<span class="material-symbols-outlined text-on-primary text-sm font-bold" data-icon="check">check</span>
</div>
<span class="font-caption text-caption text-primary absolute -bottom-6 whitespace-nowrap">Personal</span>
</div>
<div class="relative z-10 flex flex-col items-center gap-2">
<div class="w-8 h-8 rounded-full bg-surface-container-highest border-2 border-surface-variant flex items-center justify-center text-on-surface-variant font-label-md text-label-md">2</div>
</div>
<div class="relative z-10 flex flex-col items-center gap-2">
<div class="w-8 h-8 rounded-full bg-surface-container-highest border-2 border-surface-variant flex items-center justify-center text-on-surface-variant font-label-md text-label-md">3</div>
</div>
<div class="relative z-10 flex flex-col items-center gap-2">
<div class="w-8 h-8 rounded-full bg-surface-container-highest border-2 border-surface-variant flex items-center justify-center text-on-surface-variant font-label-md text-label-md">4</div>
</div>
<div class="relative z-10 flex flex-col items-center gap-2">
<div class="w-8 h-8 rounded-full bg-surface-container-highest border-2 border-surface-variant flex items-center justify-center text-on-surface-variant font-label-md text-label-md">
<span class="material-symbols-outlined text-sm" data-icon="flag">flag</span>
</div>
</div>
</div>
</div>
<!-- Form Card -->
<div class="bg-surface-container p-lg rounded-xl border border-outline-variant/20 shadow-lg mt-3xl relative overflow-hidden">
<!-- Subtle decorative background element -->
<div class="absolute top-0 right-0 w-32 h-32 bg-primary/5 rounded-bl-full blur-2xl pointer-events-none"></div>
<div class="space-y-md relative z-10">
<div>
<h2 class="font-h3 text-h3 text-on-surface mb-md">Personal Details</h2>
</div>
<!-- Input Fields -->
<div class="space-y-4">
<div class="space-y-1">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="fullName">Full Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant" data-icon="person">person</span>
<input class="w-full bg-surface-container-low border border-outline-variant/50 rounded-lg py-3 pl-10 pr-4 text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="fullName" placeholder="Jane Doe" type="text"/>
</div>
</div>
<div class="space-y-1">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="phone">Phone Number</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant" data-icon="phone_iphone">phone_iphone</span>
<input class="w-full bg-surface-container-low border border-outline-variant/50 rounded-lg py-3 pl-10 pr-4 text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="phone" placeholder="+1 (555) 000-0000" type="tel"/>
</div>
</div>
<div class="space-y-1">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant" data-icon="mail">mail</span>
<input class="w-full bg-surface-container-low border border-outline-variant/50 rounded-lg py-3 pl-10 pr-4 text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="email" placeholder="jane@example.com" type="email"/>
</div>
</div>
<div class="space-y-1">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="serviceArea">Service Area</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant" data-icon="location_on">location_on</span>
<select class="w-full bg-surface-container-low border border-outline-variant/50 rounded-lg py-3 pl-10 pr-10 text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors appearance-none" id="serviceArea">
<option disabled="" selected="" value="">Select a region</option>
<option value="downtown">Downtown Metro</option>
<option value="northside">Northside Suburbs</option>
<option value="eastside">Eastside Industrial</option>
<option value="westside">Westside Residential</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none" data-icon="arrow_drop_down">arrow_drop_down</span>
</div>
</div>
</div>
</div>
</div>
<!-- Image/Banner Section -->
<div class="w-full h-32 rounded-xl overflow-hidden relative border border-outline-variant/20 shadow-lg" data-alt="A modern electric delivery bicycle parked on a sleek, rain-slicked city street at night. High-key, cinematic lighting with bright neon purple and blue reflections in the puddles. The scene conveys a sense of speed, technology, and a premium modern service environment, rendered in a dark tech aesthetic." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuADWIkB7RdCYgk6_7gkupbj54zt2kBL2DcTz40bZNxgvK_BrjgA_7GxuzTHZruCShNtQtrpck_nLbDUUtEwkpEAYs4IlDz8GQrIist1FLSmTfHTPn4CDbCxnt8hAIbnU7zPAr1TAIGWvOKnoYqmhw9zR0-bc_XzAOsKUj-eNlT_9juSeS5H98eeM0_gFO1iGLjN2RJK1SVnwxFJzsaQQ2kAggx7umMMYxcp51oHngClOGPBZSAY64rSOw')">
<div class="absolute inset-0 bg-gradient-to-t from-surface-container-lowest to-transparent opacity-80"></div>
<div class="absolute bottom-md left-md right-md flex items-center gap-sm">
<span class="material-symbols-outlined text-primary bg-primary/10 p-sm rounded-full backdrop-blur-md border border-primary/20" data-icon="bolt">bolt</span>
<span class="font-label-md text-label-md text-on-surface font-semibold">Join the electric fleet.</span>
</div>
</div>
</div>
</main>
<!-- Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full p-md bg-surface/90 backdrop-blur-xl border-t border-outline-variant/30 pb-safe">
<div class="max-w-md mx-auto">
<button class="w-full bg-electric-violet hover:bg-primary-container text-white font-label-md text-label-md font-bold py-4 rounded-lg shadow-lg shadow-primary/20 transition-all active:scale-95 flex items-center justify-center gap-2">
                Continue to Vehicle Info
                <span class="material-symbols-outlined text-sm" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</div>
</body></html>
