<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Delivery Partner Sign Up</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-fixed-dim": "#dcb8ff",
                        "on-surface": "#e5e2e3",
                        "on-secondary-container": "#b7b4b7",
                        "on-error": "#690005",
                        "inverse-primary": "#8422dc",
                        "on-secondary-fixed-variant": "#474649",
                        "primary-fixed": "#efdbff",
                        "on-tertiary-container": "#e3e0e2",
                        "surface-bright": "#3a393a",
                        "inverse-on-surface": "#313031",
                        "tertiary-container": "#646365",
                        "surface-container-low": "#1c1b1c",
                        "surface-container-lowest": "#0e0e0f",
                        "on-tertiary": "#303032",
                        "on-primary-fixed-variant": "#6700b5",
                        "on-primary-fixed": "#2c0051",
                        "inverse-surface": "#e5e2e3",
                        "surface-tint": "#dcb8ff",
                        "surface-variant": "#353436",
                        "on-secondary": "#303032",
                        "tertiary": "#c8c6c8",
                        "secondary-container": "#474649",
                        "on-tertiary-fixed": "#1b1b1d",
                        "surface": "#131314",
                        "on-background": "#e5e2e3",
                        "tertiary-fixed": "#e4e2e4",
                        "primary": "#dcb8ff",
                        "secondary-fixed-dim": "#c8c6c8",
                        "error-container": "#93000a",
                        "on-secondary-fixed": "#1b1b1d",
                        "outline-variant": "#4c4354",
                        "on-tertiary-fixed-variant": "#474649",
                        "background": "#131314",
                        "surface-dim": "#131314",
                        "primary-container": "#8a2be2",
                        "outline": "#988ca0",
                        "surface-container-highest": "#353436",
                        "on-primary": "#480081",
                        "secondary": "#c8c6c8",
                        "tertiary-fixed-dim": "#c8c6c8",
                        "error": "#ffb4ab",
                        "surface-container": "#201f20",
                        "on-primary-container": "#eed9ff",
                        "on-surface-variant": "#cfc2d7",
                        "secondary-fixed": "#e5e1e4",
                        "on-error-container": "#ffdad6",
                        "surface-container-high": "#2a2a2b"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "3xl": "64px",
                        "xl": "32px",
                        "lg": "24px",
                        "2xl": "48px",
                        "xs": "4px",
                        "sm": "8px",
                        "md": "16px"
                    },
                    "fontFamily": {
                        "body-md": ["Geist"],
                        "display-lg-mobile": ["Geist"],
                        "caption": ["Geist"],
                        "display-lg": ["Geist"],
                        "headline-md": ["Geist"],
                        "label-md": ["Geist"],
                        "headline-lg": ["Geist"],
                        "body-lg": ["Geist"]
                    },
                    "fontSize": {
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "display-lg-mobile": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "caption": ["12px", { "lineHeight": "16px", "fontWeight": "400" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            -webkit-tap-highlight-color: transparent;
        }
        .bg-glass {
            background: linear-gradient(135deg, rgba(28, 27, 28, 0.6) 0%, rgba(14, 14, 15, 0.8) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .input-glass {
            background-color: var(--color-surface-container);
            border: 1px solid transparent;
            transition: all 0.2s ease-in-out;
        }
        .input-glass:focus {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 1px var(--color-primary);
            outline: none;
        }
        .input-error {
            border-color: var(--color-error);
        }
        .input-error:focus {
            border-color: var(--color-error);
            box-shadow: 0 0 0 1px var(--color-error);
        }
        .input-success {
            border-color: #4ade80; /* A green to denote success, outside standard theme for validation specific */
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md overflow-x-hidden w-full max-w-[390px] mx-auto relative antialiased">
<!-- Ambient Background Elements -->
<div class="fixed top-0 left-0 w-full h-full overflow-hidden z-0 pointer-events-none">
<div class="absolute top-[-10%] left-[-20%] w-[70%] h-[50%] bg-primary-container/10 rounded-full blur-[100px]"></div>
<div class="absolute bottom-[-10%] right-[-20%] w-[60%] h-[60%] bg-inverse-primary/5 rounded-full blur-[120px]"></div>
</div>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col px-[20px] pt-2xl pb-3xl relative z-10 w-full">
<!-- Back Navigation & Progress -->
<header class="flex items-center justify-between mb-xl w-full">
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container-low hover:bg-surface-variant transition-colors group">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-on-surface transition-colors">arrow_back</span>
</button>
<div class="flex items-center gap-2">
<span class="font-label-md text-label-md text-primary">Step 1 of 6</span>
<div class="flex gap-1">
<div class="w-8 h-1 bg-primary rounded-full"></div>
<div class="w-2 h-1 bg-surface-container-highest rounded-full"></div>
<div class="w-2 h-1 bg-surface-container-highest rounded-full"></div>
<div class="w-2 h-1 bg-surface-container-highest rounded-full"></div>
<div class="w-2 h-1 bg-surface-container-highest rounded-full"></div>
<div class="w-2 h-1 bg-surface-container-highest rounded-full"></div>
</div>
</div>
</header>
<!-- Header Content -->
<div class="mb-2xl w-full">
<h1 class="font-display-lg-mobile text-display-lg-mobile text-on-surface mb-sm">Create your partner account</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Join Delivery Pro and start earning today.</p>
</div>
<!-- Registration Form -->
<form class="flex flex-col gap-lg w-full mb-2xl flex-1">
<!-- Full Name (Valid State) -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="fullName">Full Name</label>
<div class="relative w-full">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant">person</span>
<input class="input-glass input-success w-full h-14 pl-12 pr-12 rounded-xl font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:ring-0" id="fullName" type="text" value="Alex Rivera"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-[#4ade80]" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
<!-- Phone Number (Focused State) -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="phone">Phone Number</label>
<div class="flex w-full gap-2">
<button class="input-glass flex items-center justify-center gap-1 h-14 px-3 rounded-xl min-w-[80px] border border-primary" type="button">
<span class="font-body-md text-body-md text-on-surface">+1</span>
<span class="material-symbols-outlined text-on-surface-variant text-[18px]">expand_more</span>
</button>
<div class="relative flex-1">
<input class="input-glass w-full h-14 px-4 rounded-xl font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:ring-0 border-primary focus:border-primary focus:shadow-[0_0_0_1px_var(--color-primary)]" id="phone" placeholder="000-000-0000" type="tel"/>
</div>
</div>
</div>
<!-- Email (Default State) -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="email">Email</label>
<div class="relative w-full">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant">mail</span>
<input class="input-glass w-full h-14 pl-12 pr-4 rounded-xl font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:ring-0" id="email" placeholder="alex@example.com" type="email"/>
</div>
</div>
<!-- Password (Invalid State) -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-error ml-1" for="password">Password</label>
<div class="relative w-full">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-error">lock</span>
<input class="input-glass input-error w-full h-14 pl-12 pr-12 rounded-xl font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:ring-0" id="password" type="password" value="short"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
<span class="font-caption text-caption text-error ml-1 flex items-center gap-1 mt-1">
<span class="material-symbols-outlined text-[14px]">error</span>
                    Password must be at least 8 characters
                </span>
</div>
<div class="mt-auto pt-lg flex flex-col gap-md w-full">
<button class="w-full h-14 bg-primary text-on-primary font-label-md text-label-md rounded-xl flex items-center justify-center transition-transform active:scale-95 shadow-[0_0_20px_rgba(220,184,255,0.15)]" type="button">
                    Create Account
                </button>
<button class="w-full h-14 bg-transparent border border-outline-variant text-on-surface font-label-md text-label-md rounded-xl flex items-center justify-center transition-transform active:scale-95 hover:bg-surface-variant/50" type="button">
                    Continue with OTP
                </button>
</div>
</form>
<div class="w-full text-center mt-auto">
<a class="font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors" href="#">
                Already have an account? <span class="text-primary font-bold">Sign In</span>
</a>
</div>
</main>
<!-- Suppressed TopAppBar and BottomNavBar as per Semantic Shell Mandate (Linear/Transactional Intent - Registration) -->
</body></html>
