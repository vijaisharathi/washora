<script>
        // Simple script to handle radio button styling
        document.querySelectorAll('input[name="payment_method"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                document.querySelectorAll('label').forEach(label => {
                    label.classList.remove('border-primary', 'border-2', 'bg-surface-container');
                    label.classList.add('border-outline-variant/30', 'bg-surface-container-low');
                });
                if(e.target.checked) {
                    const parent = e.target.closest('label');
                    parent.classList.remove('border-outline-variant/30', 'bg-surface-container-low');
                    parent.classList.add('border-primary', 'border-2', 'bg-surface-container');
                }
            });
        });
    </script>
