<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Payout History</title>

                        "on-secondary-fixed-variant": "#474649",
                        "primary": "#dcb8ff",

<style>
        body {
            background-color: #0A0A0B;
            color: #e5e2e3;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col max-w-[390px] mx-auto relative shadow-2xl overflow-x-hidden">
<!-- Header (Modeled after TopAppBar JSON intent, simplified for sub-page) -->
<header class="sticky top-0 z-50 bg-surface/80 backdrop-blur-xl border-b border-white/5 flex items-center justify-between px-md h-16 w-full">
<button aria-label="Go back" class="text-on-surface-variant hover:text-primary transition-colors p-2 -ml-2">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-surface font-bold text-center flex-1">Payout History</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<main class="flex-1 flex flex-col p-md gap-lg pb-3xl">
<!-- Search and Filter -->
<div class="flex gap-sm">
<div class="relative flex-1">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[20px]">search</span>
<input class="w-full bg-surface-container-high border border-outline-variant/30 rounded-full py-2 pl-10 pr-4 text-body-md text-on-surface placeholder:text-on-surface-variant focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" placeholder="Search payout ID..." type="text"/>
</div>
<button class="bg-surface-container-high border border-outline-variant/30 rounded-full p-2 flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined">tune</span>
</button>
</div>
<!-- Payout List -->
<div class="flex flex-col gap-sm">
<h2 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider mb-2">Recent Payouts</h2>
<!-- Payout Item: Completed -->
<div class="bg-surface rounded-xl p-md flex items-center justify-between shadow-[inset_0_0_0_1px_rgba(255,255,255,0.05)] hover:bg-surface-container-high transition-colors">
<div class="flex flex-col gap-xs">
<div class="flex items-center gap-sm">
<span class="font-label-md text-label-md text-on-surface">PO-10242</span>
</div>
<span class="font-caption text-caption text-on-surface-variant">Aug 29, 2023 • Bank Transfer</span>
</div>
<div class="flex flex-col items-end gap-xs">
<span class="font-body-md text-body-md text-on-surface font-semibold">₹860.00</span>
<div class="flex items-center gap-1 text-[#4ade80]">
<span class="material-symbols-outlined text-[14px]">check_circle</span>
<span class="font-caption text-caption uppercase font-medium tracking-wider">Completed</span>
</div>
</div>
</div>
<!-- Payout Item: Processing -->
<div class="bg-surface rounded-xl p-md flex items-center justify-between shadow-[inset_0_0_0_1px_rgba(255,255,255,0.05)] hover:bg-surface-container-high transition-colors">
<div class="flex flex-col gap-xs">
<div class="flex items-center gap-sm">
<span class="font-label-md text-label-md text-on-surface">PO-10241</span>
</div>
<span class="font-caption text-caption text-on-surface-variant">Aug 28, 2023 • UPI</span>
</div>
<div class="flex flex-col items-end gap-xs">
<span class="font-body-md text-body-md text-on-surface font-semibold">₹1,240.50</span>
<div class="flex items-center gap-1 text-[#fbbf24]">
<span class="material-symbols-outlined text-[14px] animate-spin">sync</span>
<span class="font-caption text-caption uppercase font-medium tracking-wider">Processing</span>
</div>
</div>
</div>
<!-- Payout Item: Failed -->
<div class="bg-surface rounded-xl p-md flex items-center justify-between shadow-[inset_0_0_0_1px_rgba(255,255,255,0.05)] hover:bg-surface-container-high transition-colors">
<div class="flex flex-col gap-xs">
<div class="flex items-center gap-sm">
<span class="font-label-md text-label-md text-on-surface">PO-10240</span>
</div>
<span class="font-caption text-caption text-on-surface-variant">Aug 25, 2023 • Bank Transfer</span>
</div>
<div class="flex flex-col items-end gap-xs">
<span class="font-body-md text-body-md text-on-surface font-semibold">₹450.00</span>
<div class="flex items-center gap-1 text-error">
<span class="material-symbols-outlined text-[14px]">error</span>
<span class="font-caption text-caption uppercase font-medium tracking-wider">Failed</span>
</div>
</div>
</div>
<h2 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider mt-md mb-2">Previous Month</h2>
<!-- Payout Item: Completed Old -->
<div class="bg-surface rounded-xl p-md flex items-center justify-between shadow-[inset_0_0_0_1px_rgba(255,255,255,0.05)] hover:bg-surface-container-high transition-colors">
<div class="flex flex-col gap-xs">
<div class="flex items-center gap-sm">
<span class="font-label-md text-label-md text-on-surface">PO-09852</span>
</div>
<span class="font-caption text-caption text-on-surface-variant">Jul 15, 2023 • UPI</span>
</div>
<div class="flex flex-col items-end gap-xs">
<span class="font-body-md text-body-md text-on-surface font-semibold">₹2,100.00</span>
<div class="flex items-center gap-1 text-[#4ade80]">
<span class="material-symbols-outlined text-[14px]">check_circle</span>
<span class="font-caption text-caption uppercase font-medium tracking-wider">Completed</span>
</div>
</div>
</div>
</div>
</main>
<!-- Bottom Navigation Bar from JSON (Suppressed since this is a sub-page/transactional view, prioritizing content canvas) -->
</body></html>
