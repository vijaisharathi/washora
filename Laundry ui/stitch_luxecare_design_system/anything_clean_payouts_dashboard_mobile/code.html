<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Payouts Dashboard</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Google Fonts: Geist -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Theme Configuration -->
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-secondary": "#303032",
                      "secondary-fixed-dim": "#c8c6c8",
                      "surface-variant": "#353436",
                      "on-error-container": "#ffdad6",
                      "on-secondary-fixed": "#1b1b1d",
                      "error-container": "#93000a",
                      "primary-fixed-dim": "#dcb8ff",
                      "surface-bright": "#3a393a",
                      "background": "#131314",
                      "on-tertiary-fixed-variant": "#474649",
                      "secondary-container": "#474649",
                      "primary-container": "#8a2be2",
                      "on-error": "#690005",
                      "tertiary-fixed-dim": "#c8c6c8",
                      "on-primary-container": "#eed9ff",
                      "outline": "#988ca0",
                      "surface-tint": "#dcb8ff",
                      "on-primary-fixed": "#2c0051",
                      "on-tertiary": "#303032",
                      "secondary": "#c8c6c8",
                      "surface-container-low": "#1c1b1c",
                      "on-secondary-fixed-variant": "#474649",
                      "primary": "#dcb8ff",
                      "on-tertiary-container": "#e3e0e2",
                      "surface-container-highest": "#353436",
                      "tertiary-fixed": "#e4e2e4",
                      "on-primary-fixed-variant": "#6700b5",
                      "error": "#ffb4ab",
                      "surface-dim": "#131314",
                      "on-background": "#e5e2e3",
                      "on-surface": "#e5e2e3",
                      "on-secondary-container": "#b7b4b7",
                      "tertiary": "#c8c6c8",
                      "outline-variant": "#4c4354",
                      "primary-fixed": "#efdbff",
                      "surface-container-lowest": "#0e0e0f",
                      "surface": "#131314",
                      "on-tertiary-fixed": "#1b1b1d",
                      "surface-container-high": "#2a2a2b",
                      "on-primary": "#480081",
                      "inverse-on-surface": "#313031",
                      "tertiary-container": "#646365",
                      "secondary-fixed": "#e5e1e4",
                      "inverse-surface": "#e5e2e3",
                      "inverse-primary": "#8422dc",
                      "surface-container": "#201f20",
                      "on-surface-variant": "#cfc2d7"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "lg": "24px",
                      "xl": "32px",
                      "2xl": "48px",
                      "xs": "4px",
                      "md": "16px",
                      "sm": "8px",
                      "3xl": "64px"
              },
              "fontFamily": {
                      "body-md": ["Geist"],
                      "display-lg-mobile": ["Geist"],
                      "label-md": ["Geist"],
                      "display-lg": ["Geist"],
                      "headline-md": ["Geist"],
                      "body-lg": ["Geist"],
                      "headline-lg": ["Geist"],
                      "caption": ["Geist"]
              },
              "fontSize": {
                      "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                      "display-lg-mobile": ["36px", {"lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                      "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500"}],
                      "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                      "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                      "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                      "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                      "caption": ["12px", {"lineHeight": "16px", "fontWeight": "400"}]
              }
            }
          }
        }
    </script>
<style>
        /* Fallback logic for webkit backdrop blur and general scrollbar hiding */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        /* Subtle glow animation for the primary balance card */
        @keyframes subtle-pulse {
            0% { box-shadow: 0 0 0 0 rgba(220, 184, 255, 0.1); }
            50% { box-shadow: 0 0 20px 0 rgba(220, 184, 255, 0.05); }
            100% { box-shadow: 0 0 0 0 rgba(220, 184, 255, 0.1); }
        }
        .animate-glow {
            animation: subtle-pulse 4s infinite ease-in-out;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md text-body-md min-h-screen flex flex-col antialiased">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl border-b border-white/5 flex items-center justify-between px-md h-16 w-full max-w-7xl mx-auto">
<div class="flex items-center gap-md">
<button class="text-primary hover:opacity-80 transition-opacity active:scale-95 flex items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">menu</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary">Delivery Portal</h1>
</div>
<button class="text-primary hover:opacity-80 transition-opacity active:scale-95 flex items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">account_circle</span>
</button>
</header>
<!-- Main Canvas Content - Restricted to mobile width approx 390px with 20px side margins -->
<main class="flex-grow pt-[88px] pb-[100px] px-[20px] max-w-[430px] w-full mx-auto flex flex-col gap-lg">
<!-- Available Balance Hero Card -->
<section class="relative bg-surface-container-high rounded-[20px] p-lg border border-outline-variant overflow-hidden animate-glow shadow-[0_4px_24px_rgba(0,0,0,0.2)]">
<!-- Decorative Background Element (Glass/Glow) -->
<div class="absolute top-0 right-0 -mt-xl -mr-xl w-3xl h-3xl bg-primary/10 rounded-full blur-[40px] pointer-events-none"></div>
<div class="relative z-10 flex flex-col gap-md">
<div>
<h2 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Available Balance</h2>
<div class="font-display-lg-mobile text-display-lg-mobile text-on-surface mt-xs tracking-tight">₹860</div>
</div>
<div class="flex items-center justify-between bg-surface-container-low rounded-lg p-sm border border-white/5 mt-xs">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-on-surface-variant text-[18px]">calendar_today</span>
<span class="font-caption text-caption text-on-surface-variant">Next Payout</span>
</div>
<span class="font-label-md text-label-md text-on-surface">Sep 1, 2026</span>
</div>
<button class="w-full mt-sm bg-primary text-on-primary font-label-md text-label-md py-[14px] rounded-xl hover:bg-primary-fixed-dim transition-colors active:scale-[0.98] flex items-center justify-center gap-sm font-semibold shadow-[0_0_15px_rgba(220,184,255,0.15)]">
                    Request Payout
                    <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</section>
<!-- Bank Account Info -->
<section class="bg-surface-container rounded-xl p-md border border-outline-variant/30 flex items-center justify-between shadow-sm">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-lg bg-surface flex items-center justify-center border border-white/5">
<span class="material-symbols-outlined text-primary">account_balance</span>
</div>
<div class="flex flex-col">
<span class="font-label-md text-label-md text-on-surface">State Bank</span>
<span class="font-caption text-caption text-on-surface-variant font-mono">XXXX 4521</span>
</div>
</div>
<div class="flex items-center gap-xs px-sm py-xs bg-primary/10 rounded-full border border-primary/20">
<span class="material-symbols-outlined text-primary text-[14px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-caption text-caption text-primary font-medium">Verified</span>
</div>
</section>
<!-- Summary Bento Grid -->
<section class="grid grid-cols-2 gap-md">
<!-- This Month Paid -->
<div class="bg-surface-container-low rounded-xl p-md border border-outline-variant/30 flex flex-col gap-sm">
<div class="w-8 h-8 rounded-full bg-surface-variant flex items-center justify-center mb-xs">
<span class="material-symbols-outlined text-on-surface text-[16px]">trending_up</span>
</div>
<h3 class="font-caption text-caption text-on-surface-variant">This Month Paid</h3>
<p class="font-headline-md text-headline-md text-on-surface">₹8,420</p>
</div>
<!-- Pending -->
<div class="bg-surface-container-low rounded-xl p-md border border-outline-variant/30 flex flex-col gap-sm">
<div class="w-8 h-8 rounded-full bg-surface-variant flex items-center justify-center mb-xs">
<span class="material-symbols-outlined text-on-surface text-[16px]">pending_actions</span>
</div>
<h3 class="font-caption text-caption text-on-surface-variant">Pending</h3>
<p class="font-headline-md text-headline-md text-on-surface">₹860</p>
</div>
</section>
<!-- Recent Payouts -->
<section class="flex flex-col gap-sm mt-sm">
<h3 class="font-label-md text-label-md text-on-surface-variant px-xs">Recent Payouts</h3>
<div class="bg-surface-container rounded-xl p-md border border-outline-variant/30 flex items-center justify-between hover:bg-surface-container-high transition-colors cursor-pointer active:scale-[0.99]">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-surface flex items-center justify-center border border-white/5">
<span class="material-symbols-outlined text-on-surface-variant">payments</span>
</div>
<div class="flex flex-col">
<span class="font-label-md text-label-md text-on-surface">Standard Payout</span>
<span class="font-caption text-caption text-on-surface-variant">Aug 1, 2026</span>
</div>
</div>
<div class="flex flex-col items-end">
<span class="font-label-md text-label-md text-on-surface font-semibold">₹4,200</span>
<span class="font-caption text-caption text-[#8422dc] font-medium tracking-wide">COMPLETED</span>
</div>
</div>
<!-- Dummy skeleton for visual balance indicating list continuation -->
<div class="bg-surface-container/50 rounded-xl p-md border border-outline-variant/10 flex items-center justify-between opacity-50">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-surface/50 border border-white/5"></div>
<div class="flex flex-col gap-xs">
<div class="h-4 w-24 bg-surface rounded"></div>
<div class="h-3 w-16 bg-surface rounded"></div>
</div>
</div>
</div>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center py-sm px-xs pb-safe bg-surface/90 backdrop-blur-xl border-t border-white/5 shadow-[0_-4px_20px_rgba(0,0,0,0.4)] z-50 rounded-t-xl">
<!-- Home -->
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant/20 rounded-lg transition-colors active:scale-90 duration-200 w-16 h-14">
<span class="material-symbols-outlined mb-1">home</span>
<span class="font-label-md text-label-md text-[10px] leading-tight">Home</span>
</button>
<!-- Deliveries -->
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant/20 rounded-lg transition-colors active:scale-90 duration-200 w-16 h-14">
<span class="material-symbols-outlined mb-1">local_shipping</span>
<span class="font-label-md text-label-md text-[10px] leading-tight">Deliveries</span>
</button>
<!-- Earnings (ACTIVE) -->
<button class="flex flex-col items-center justify-center text-primary font-bold hover:bg-surface-variant/20 rounded-lg transition-colors active:scale-90 duration-200 w-16 h-14 relative">
<!-- Active indicator dot (optional flair based on brand) -->
<div class="absolute top-1 right-3 w-1.5 h-1.5 bg-primary rounded-full blur-[1px]"></div>
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">payments</span>
<span class="font-label-md text-label-md text-[10px] leading-tight">Earnings</span>
</button>
<!-- Alerts -->
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant/20 rounded-lg transition-colors active:scale-90 duration-200 w-16 h-14">
<span class="material-symbols-outlined mb-1">notifications</span>
<span class="font-label-md text-label-md text-[10px] leading-tight">Alerts</span>
</button>
<!-- Profile -->
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant/20 rounded-lg transition-colors active:scale-90 duration-200 w-16 h-14">
<span class="material-symbols-outlined mb-1">person</span>
<span class="font-label-md text-label-md text-[10px] leading-tight">Profile</span>
</button>
</nav>
</body></html>
