<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Personal Information</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet"/>

                        "surface-container-lowest": "#0e0e0f",
                        "on-tertiary": "#303032",
                        "on-primary-fixed-variant": "#6700b5",
                        "on-primary-fixed": "#2c0051",
                        "inverse-surface": "#e5e2e3",
                        "surface-tint": "#dcb8ff",
                        "surface-variant": "#353436",
                        "on-secondary": "#303032",
                        "tertiary": "#c8c6c8",
                        "secondary-container": "#474649",
                        "on-tertiary-fixed": "#1b1b1d",

                        "on-background": "#e5e2e3",

                        "error-container": "#93000a",

                        "surface-dim": "#131314",

                        "outline": "#988ca0",
                        "surface-container-highest": "#353436",
                        "on-primary": "#480081",
                        "secondary": "#c8c6c8",
                        "tertiary-fixed-dim": "#c8c6c8",
                        "error": "#ffb4ab",
                        "surface-container": "#201f20",
                        "on-primary-container": "#eed9ff",
                        "on-surface-variant": "#cfc2d7",
                        "secondary-fixed": "#e5e1e4",
                        "on-error-container": "#ffdad6",
                        "surface-container-high": "#2a2a2b"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",

                    },
                    "spacing": {

                        "xl": "32px",
                        "lg": "24px",
                        "2xl": "48px",

                    },
                    "fontFamily": {
                        "body-md": ["Geist"],
                        "display-lg-mobile": ["Geist"],

                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }]

<style>
        body {
            background-color: #0A0A0B; /* Layer 0 Canvas */
            color: #e5e2e3;
            -webkit-font-smoothing: antialiased;
        }
        /* Custom Input Styles */
        .glass-input {
            background-color: #121214; /* Layer 1 Surface */
            border: 1px solid transparent;
            transition: all 0.3s ease;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.05); /* Subtle inner glow */
        }
        .glass-input:focus {
            border-color: #dcb8ff;
            outline: none;
            box-shadow: 0 0 15px rgba(220, 184, 255, 0.1), inset 0 0 0 1px rgba(220, 184, 255, 0.2);
        }
        
        .floating-label-group {
            position: relative;
            margin-bottom: 24px;
        }
        
        .floating-label-group input {
            width: 100%;
            padding: 24px 16px 8px 16px;
            border-radius: 12px;
            color: #e5e2e3;
        }
        
        .floating-label-group label {
            position: absolute;
            top: 16px;
            left: 16px;
            color: #b7b4b7;
            font-size: 14px;
            transition: all 0.2s ease;
            pointer-events: none;
        }
        
        .floating-label-group input:focus + label,
        .floating-label-group input:not(:placeholder-shown) + label {
            top: 6px;
            font-size: 11px;
            color: #dcb8ff;
        }

        /* Booking Stepper - thin line with glow */
        .stepper-container {
            position: relative;
            height: 2px;
            background: #2a2a2b;
            border-radius: 2px;
            overflow: hidden;
        }
        .stepper-progress {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 33.33%; /* Step 2 of 6 approx */
            background: #dcb8ff;
            box-shadow: 0 0 8px rgba(220, 184, 255, 0.5);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex flex-col max-w-[390px] mx-auto relative overflow-x-hidden">
<!-- Top AppBar for Onboarding (Linear/Transactional -> No bottom nav, simple top bar with back) -->
<header class="fixed top-0 w-full max-w-[390px] z-50 flex items-center justify-between px-5 h-16 bg-surface/80 backdrop-blur-xl border-b border-white/5 shadow-sm">
<button class="text-on-surface-variant hover:text-primary transition-colors p-2 -ml-2 rounded-full">
<span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<span class="font-headline-md text-body-md text-primary font-bold">Delivery Pro</span>
<div class="w-10"></div> <!-- Spacer for balance -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 mt-16 px-5 pt-6 pb-2xl flex flex-col">
<!-- Booking Stepper -->
<div class="mb-8">
<div class="flex justify-between items-center mb-2">
<span class="font-caption text-caption text-on-surface-variant uppercase tracking-wider">Step 2 of 6</span>
</div>
<div class="stepper-container w-full">
<div class="stepper-progress"></div>
</div>
</div>
<!-- Header -->
<div class="mb-xl">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-2">Tell us about yourself</h1>
<p class="font-body-md text-body-md text-on-surface-variant">This information helps us verify your identity and set up your delivery profile securely.</p>
</div>
<!-- Profile Photo Upload (Large Circular Component) -->
<div class="flex flex-col items-center mb-xl relative">
<div class="relative group cursor-pointer">
<div class="w-32 h-32 rounded-full overflow-hidden bg-surface-container-high border-2 border-dashed border-outline-variant flex items-center justify-center relative">
<!-- Placeholder for potential uploaded image -->
<span class="material-symbols-outlined text-[48px] text-on-surface-variant group-hover:text-primary transition-colors">add_a_photo</span>
</div>
<!-- Absolute positioned edit button -->
<div class="absolute bottom-0 right-0 bg-primary w-10 h-10 rounded-full flex items-center justify-center shadow-lg border-2 border-background">
<span class="material-symbols-outlined text-[20px] text-on-primary">edit</span>
</div>
</div>
</div>
<!-- Form Fields -->
<form class="flex-1 flex flex-col space-y-2">
<div class="floating-label-group">
<input class="glass-input font-body-md text-body-md" id="fullName" placeholder=" " type="text"/>
<label class="font-label-md" for="fullName">Full Legal Name</label>
</div>
<div class="floating-label-group">
<input class="glass-input font-body-md text-body-md" id="email" placeholder=" " type="email"/>
<label class="font-label-md" for="email">Email Address</label>
</div>
<div class="floating-label-group">
<input class="glass-input font-body-md text-body-md" id="phone" placeholder=" " type="tel"/>
<label class="font-label-md" for="phone">Phone Number</label>
</div>
<div class="my-4 pt-4 border-t border-white/5">
<h3 class="font-label-md text-label-md text-on-surface-variant mb-4 uppercase tracking-wider">Emergency Contact</h3>
</div>
<div class="floating-label-group">
<input class="glass-input font-body-md text-body-md" id="emergencyName" placeholder=" " type="text"/>
<label class="font-label-md" for="emergencyName">Contact Name</label>
</div>
<div class="floating-label-group">
<input class="glass-input font-body-md text-body-md" id="emergencyPhone" placeholder=" " type="tel"/>
<label class="font-label-md" for="emergencyPhone">Contact Phone</label>
</div>
</form>
</main>
<!-- Bottom Action Area (Fixed) -->
<div class="fixed bottom-0 w-full max-w-[390px] p-5 bg-surface/90 backdrop-blur-2xl border-t border-white/5 pb-[calc(1.25rem+env(safe-area-inset-bottom))]">
<button class="w-full bg-primary text-on-primary font-label-md text-label-md font-bold py-4 rounded-xl flex items-center justify-center space-x-2 active:scale-[0.98] transition-transform shadow-[0_0_20px_rgba(220,184,255,0.15)]">
<span>Continue</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</body></html>
