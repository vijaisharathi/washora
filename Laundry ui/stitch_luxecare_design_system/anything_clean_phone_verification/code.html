<script>
        // Simple OTP input navigation logic
        function moveToNext(current, nextFieldID) {
            // Remove active animation class from all
            const inputs = document.querySelectorAll('input[type="number"]');
            inputs.forEach(input => input.classList.remove('input-active'));

            if (current.value.length >= 1) {
                current.value = current.value.slice(0, 1); // Ensure only 1 char
                if (nextFieldID) {
                    const nextField = document.getElementById(nextFieldID);
                    nextField.focus();
                    nextField.classList.add('input-active');
                } else {
                    current.blur();
                    checkCompletion();
                }
            } else {
                current.classList.add('input-active');
            }
            checkCompletion();
        }

        function moveToPrev(e, current, prevFieldID) {
            if (e.key === 'Backspace' && current.value.length === 0 && prevFieldID) {
                const inputs = document.querySelectorAll('input[type="number"]');
                inputs.forEach(input => input.classList.remove('input-active'));
                
                const prevField = document.getElementById(prevFieldID);
                prevField.focus();
                prevField.classList.add('input-active');
                e.preventDefault();
            }
        }

        // Enable verify button when all 6 digits are filled
        function checkCompletion() {
            const inputs = document.querySelectorAll('#otp-container input');
            let isComplete = true;
            inputs.forEach(input => {
                if (input.value.length === 0) isComplete = false;
            });

            const verifyBtn = document.getElementById('verify-btn');
            if (isComplete) {
                verifyBtn.removeAttribute('disabled');
                inputs.forEach(input => input.classList.remove('input-active'));
            } else {
                verifyBtn.setAttribute('disabled', 'true');
            }
        }

        // Focus first input on load
        window.onload = () => {
            const firstInput = document.querySelector('input[type="number"]');
            firstInput.focus();
            firstInput.classList.add('input-active');
        };
    </script>
