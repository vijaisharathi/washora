<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Lumina Care - Choose Pickup Time</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-surface-variant": "#cfc2d7",
                    "error-red": "#ffb4ab",
                    "success-bg": "#1A3D24",
                    "primary-container": "#8a2be2",
                    "on-background": "#e5e2e3",
                    "secondary-container": "#49494b",
                    "error-container": "#93000a",
                    "surface-bright": "#39393a",
                    "error": "#ffb4ab",
                    "surface-container-high": "#2a2a2b",
                    "surface-container-low": "#1c1b1c",
                    "on-secondary-fixed-variant": "#474648",
                    "tertiary-fixed": "#e4e2e4",
                    "inverse-on-surface": "#313031",
                    "inverse-primary": "#8422dc",
                    "primary-fixed": "#efdbff",
                    "background": "#131314",
                    "surface-variant": "#353436",
                    "surface-tint": "#dcb8ff",
                    "on-tertiary": "#303032",
                    "primary": "#dcb8ff",
                    "tertiary": "#c8c6c8",
                    "on-secondary-container": "#b9b8ba",
                    "on-primary-container": "#eed9ff",
                    "secondary-fixed-dim": "#c8c6c8",
                    "on-error": "#690005",
                    "on-primary-fixed-variant": "#6700b5",
                    "on-error-container": "#ffdad6",
                    "surface-container-lowest": "#0e0e0f",
                    "on-tertiary-fixed": "#1b1b1d",
                    "surface-container": "#201f20",
                    "outline-variant": "#4c4354",
                    "tertiary-container": "#646365",
                    "primary-fixed-dim": "#dcb8ff",
                    "on-primary": "#480081",
                    "on-tertiary-fixed-variant": "#474648",
                    "on-secondary": "#303032",
                    "on-surface": "#e5e2e3",
                    "electric-violet": "#8a2be2",
                    "tertiary-fixed-dim": "#c8c6c8",
                    "surface-dim": "#131314",
                    "secondary": "#c8c6c8",
                    "on-tertiary-container": "#e3e0e2",
                    "on-secondary-fixed": "#1b1b1d",
                    "surface-container-highest": "#353436",
                    "surface": "#131314",
                    "secondary-fixed": "#e4e2e4",
                    "outline": "#988ca0",
                    "on-primary-fixed": "#2c0051",
                    "inverse-surface": "#e5e2e3",
                    "success-green": "#81C784"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "xl": "32px",
                    "lg": "24px",
                    "2xl": "48px",
                    "sm": "8px",
                    "3xl": "64px",
                    "xs": "4px",
                    "md": "16px"
            },
            "fontFamily": {
                    "label-md": ["Geist"],
                    "headline-lg": ["Geist"],
                    "h1": ["Geist"],
                    "h3": ["Geist"],
                    "caption": ["Geist"],
                    "display-lg": ["Geist"],
                    "mono-display": ["monospace"],
                    "body-md": ["Geist"]
            },
            "fontSize": {
                    "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "h1": ["28px", {"lineHeight": "36px", "fontWeight": "700"}],
                    "h3": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "caption": ["12px", {"lineHeight": "16px", "fontWeight": "400"}],
                    "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "mono-display": ["18px", {"letterSpacing": "0.05em", "fontWeight": "700"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
<style>
        body { background-color: theme('colors.background'); color: theme('colors.on-surface'); font-family: 'Geist', sans-serif; }
    </style>
</head>
<body class="bg-background text-on-surface antialiased min-h-screen flex flex-col justify-center items-center p-md sm:p-xl">
<!-- Transactional Canvas -->
<main class="w-full max-w-md bg-surface-container rounded-xl border border-outline-variant/20 shadow-2xl overflow-hidden flex flex-col">
<!-- Header -->
<header class="p-lg border-b border-outline-variant/30 flex items-center justify-between bg-surface-container-low">
<button aria-label="Go back" class="text-on-surface-variant hover:text-primary transition-colors flex items-center">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-h3 text-h3 text-on-surface">Choose Pickup Time</h1>
<div class="w-6"></div> <!-- Spacer for centering -->
</header>
<div class="p-lg flex-1 flex flex-col gap-lg">
<!-- Date Context -->
<div class="flex items-center justify-between bg-surface-container-high p-md rounded-lg border border-outline-variant/30">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary" data-icon="calendar_today">calendar_today</span>
<span class="font-label-md text-label-md text-on-surface">Tomorrow, Sep 1</span>
</div>
<button class="text-primary font-label-md text-label-md hover:text-electric-violet transition-colors">Change Date</button>
</div>
<!-- Time Slots -->
<div class="flex flex-col gap-sm">
<h2 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider mb-xs">Available Time Windows</h2>
<!-- Slot 1: Selected -->
<button class="w-full flex items-center justify-between p-md rounded-lg border-2 border-primary bg-primary/10 transition-all text-left">
<div class="flex items-center gap-md">
<span class="material-symbols-outlined text-primary" data-icon="schedule" data-weight="fill" style="font-variation-settings: 'FILL' 1;">schedule</span>
<div>
<p class="font-body-md text-body-md text-on-surface font-semibold">10:00 AM – 12:00 PM</p>
<p class="font-caption text-caption text-success-green">Available</p>
</div>
</div>
<span class="material-symbols-outlined text-primary" data-icon="check_circle" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
<!-- Slot 2: Available -->
<button class="w-full flex items-center justify-between p-md rounded-lg border border-outline-variant/50 hover:bg-surface-container-high transition-all text-left">
<div class="flex items-center gap-md">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="schedule">schedule</span>
<div>
<p class="font-body-md text-body-md text-on-surface">12:00 PM – 2:00 PM</p>
<p class="font-caption text-caption text-success-green">Available</p>
</div>
</div>
</button>
<!-- Slot 3: Limited -->
<button class="w-full flex items-center justify-between p-md rounded-lg border border-outline-variant/50 hover:bg-surface-container-high transition-all text-left">
<div class="flex items-center gap-md">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="schedule">schedule</span>
<div>
<p class="font-body-md text-body-md text-on-surface">2:00 PM – 4:00 PM</p>
<p class="font-caption text-caption text-electric-violet">Limited Slots</p>
</div>
</div>
</button>
<!-- Slot 4: Disabled -->
<button class="w-full flex items-center justify-between p-md rounded-lg border border-outline-variant/20 bg-surface-container-lowest opacity-50 cursor-not-allowed text-left" disabled="">
<div class="flex items-center gap-md">
<span class="material-symbols-outlined text-outline-variant" data-icon="block">block</span>
<div>
<p class="font-body-md text-body-md text-on-surface-variant line-through">4:00 PM – 6:00 PM</p>
<p class="font-caption text-caption text-error-red">Fully Booked</p>
</div>
</div>
</button>
</div>
</div>
<!-- Footer / CTA -->
<footer class="p-lg border-t border-outline-variant/30 bg-surface-container-low">
<button class="w-full py-md px-lg bg-electric-violet text-white font-label-md text-label-md rounded-lg shadow-lg shadow-primary/20 hover:bg-primary-container hover:text-on-primary-container transition-all flex items-center justify-center gap-sm">
<span>Continue</span>
<span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</footer>
</main>
</body></html>
