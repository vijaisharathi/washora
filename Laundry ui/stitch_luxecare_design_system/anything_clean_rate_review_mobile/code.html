<span class="material-symbols-outlined text-[40px] md:text-[48px]" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="material-symbols-outlined text-[40px] md:text-[48px]" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="material-symbols-outlined text-[40px] md:text-[48px]" style="font-variation-settings: 'FILL' 0;">star</span>

</div>
<div class="h-px bg-white/5 w-full"></div>

<button class="w-full max-w-[600px] bg-primary text-on-primary font-headline-md text-headline-md-mobile md:font-headline-md md:text-headline-md py-sm px-xl rounded-full hover:bg-primary-fixed-dim transition-colors active:scale-95 duration-150">
            Submit Review
        </button>
</div>
<script>
        // Simple JS for interactive star rating visual feedback
        document.querySelectorAll('.star-rating').forEach(ratingContainer => {
            const stars = ratingContainer.querySelectorAll('span');
            stars.forEach((star, index) => {
                star.addEventListener('click', () => {
                    // Reset all stars in this container
                    stars.forEach((s, i) => {
                        if (i <= index) {
                            s.style.fontVariationSettings = "'FILL' 1";
                            s.classList.remove('text-surface-variant');
                            s.classList.add(ratingContainer.dataset.category === 'overall' ? 'text-primary' : 'text-primary');
                        } else {
                            s.style.fontVariationSettings = "'FILL' 0";
                            s.classList.add('text-surface-variant');
                            s.classList.remove('text-primary');
                        }
                    });
                });
            });
        });

        // Initialize overall stars color to primary for filled ones (simulating pre-filled state from design)
        const overallStars = document.querySelector('[data-category="overall"]').querySelectorAll('span');
        overallStars.forEach((star, index) => {
            if(index < 4) {
                 star.classList.remove('text-surface-variant');
                 star.classList.add('text-primary');
            }
        });
    </script>
