<style>
        .star-rating label:hover ~ label span { color: theme('colors.surface-variant'); }
        .star-rating input:checked ~ label span { color: theme('colors.surface-variant'); }
        .star-rating label:hover span, .star-rating label:hover ~ label span { color: theme('colors.electric-violet'); }
        .star-rating input:checked + label span, .star-rating input:checked + label ~ label span { color: theme('colors.electric-violet'); }
    </style>
</head>
<body class="bg-surface text-on-surface font-body-md min-h-screen flex items-center justify-center p-md sm:p-xl">
<!-- Main Container -->
<main class="w-full max-w-2xl bg-surface-container rounded-xl border border-outline-variant/30 flex flex-col overflow-hidden">
<!-- Header Section -->
<div class="p-xl border-b border-outline-variant/30 text-center">
<h1 class="font-h1 text-h1 text-primary mb-sm">How was your experience?</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-md mx-auto">
                Your feedback helps us improve and helps other customers choose better.
            </p>
</div>
<!-- Service Summary Card -->
<div class="p-xl bg-surface-container-low border-b border-outline-variant/30 flex items-center gap-md">
<div class="w-16 h-16 rounded-lg bg-surface flex items-center justify-center border border-outline-variant/50 shrink-0">
<span class="material-symbols-outlined text-3xl text-primary" data-icon="cleaning_services">cleaning_services</span>
</div>
<div>
<h3 class="font-h3 text-h3 text-on-surface mb-xs">Sneaker Deep Clean</h3>
<p class="font-caption text-caption text-on-surface-variant">Premium Sneaker Clean • CleanX Service Center</p>
</div>
</div>
<!-- Rating Section -->
<div class="p-xl flex flex-col items-center">
<div class="flex flex-row-reverse justify-center gap-md mb-lg star-rating w-full max-w-sm">
<!-- 5 Excellent -->
<input class="hidden peer/5" id="star5" name="rating" type="radio" value="5"/>
<label class="cursor-pointer group flex flex-col items-center gap-xs" for="star5">
<span class="material-symbols-outlined text-5xl text-surface-variant transition-colors group-hover:text-electric-violet" data-icon="star" data-weight="fill" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="font-caption text-caption text-on-surface-variant opacity-0 group-hover:opacity-100 peer-checked/5:opacity-100 transition-opacity">Excellent</span>
</label>
<!-- 4 Good -->
<input class="hidden peer/4" id="star4" name="rating" type="radio" value="4"/>
<label class="cursor-pointer group flex flex-col items-center gap-xs" for="star4">
<span class="material-symbols-outlined text-5xl text-surface-variant transition-colors group-hover:text-electric-violet" data-icon="star" data-weight="fill" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="font-caption text-caption text-on-surface-variant opacity-0 group-hover:opacity-100 peer-checked/4:opacity-100 transition-opacity">Good</span>
</label>
<!-- 3 Okay -->
<input class="hidden peer/3" id="star3" name="rating" type="radio" value="3"/>
<label class="cursor-pointer group flex flex-col items-center gap-xs" for="star3">
<span class="material-symbols-outlined text-5xl text-surface-variant transition-colors group-hover:text-electric-violet" data-icon="star" data-weight="fill" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="font-caption text-caption text-on-surface-variant opacity-0 group-hover:opacity-100 peer-checked/3:opacity-100 transition-opacity">Okay</span>
</label>
<!-- 2 Poor -->
<input class="hidden peer/2" id="star2" name="rating" type="radio" value="2"/>
<label class="cursor-pointer group flex flex-col items-center gap-xs" for="star2">
<span class="material-symbols-outlined text-5xl text-surface-variant transition-colors group-hover:text-electric-violet" data-icon="star" data-weight="fill" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="font-caption text-caption text-on-surface-variant opacity-0 group-hover:opacity-100 peer-checked/2:opacity-100 transition-opacity">Poor</span>
</label>
<!-- 1 Very Poor -->
<input class="hidden peer/1" id="star1" name="rating" type="radio" value="1"/>
<label class="cursor-pointer group flex flex-col items-center gap-xs" for="star1">
<span class="material-symbols-outlined text-5xl text-surface-variant transition-colors group-hover:text-electric-violet" data-icon="star" data-weight="fill" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="font-caption text-caption text-on-surface-variant opacity-0 group-hover:opacity-100 peer-checked/1:opacity-100 transition-opacity text-center whitespace-nowrap">Very Poor</span>
</label>
</div>
<div class="h-6 font-label-md text-label-md text-electric-violet font-bold mb-xl" id="rating-label-display">
<!-- Javascript will inject active label here if needed, or rely on CSS above -->
</div>
<!-- Action Button -->
<button class="w-full sm:w-auto min-w-[200px] py-md px-xl bg-surface-variant text-on-surface-variant font-label-md text-label-md font-bold rounded-lg transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed" disabled="" id="continue-btn">
                Continue
            </button>
</div>
</main>
<script>
        const radioButtons = document.querySelectorAll('input[name="rating"]');
        const continueBtn = document.getElementById('continue-btn');

        radioButtons.forEach(radio => {
            radio.addEventListener('change', () => {
                if (document.querySelector('input[name="rating"]:checked')) {
                    continueBtn.disabled = false;
                    continueBtn.classList.remove('bg-surface-variant', 'text-on-surface-variant');
                    continueBtn.classList.add('bg-electric-violet', 'text-white', 'shadow-lg', 'shadow-electric-violet/20', 'hover:bg-primary-container');
                }
            });
        });
    </script>
