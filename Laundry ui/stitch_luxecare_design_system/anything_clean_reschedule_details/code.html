<body class="antialiased">
<!-- Mobile Device Simulator Wrapper (390px) -->
<div class="w-[390px] h-[844px] bg-background text-on-background font-body-md text-body-md relative overflow-hidden flex flex-col shadow-2xl border-x border-outline-variant/20">
<!-- Task-Focused Header (Navigation Shell Suppressed) -->
<header class="flex items-center px-4 h-16 bg-surface-dim/80 backdrop-blur-md border-b border-outline-variant/30 sticky top-0 z-20 flex-shrink-0">
<button class="w-10 h-10 flex items-center justify-center text-on-surface-variant hover:bg-surface-container-high rounded-full transition-colors active:scale-95">
<span class="material-symbols-outlined">close</span>
</button>
<h1 class="font-h3 text-h3 font-bold ml-2 text-on-surface">Reschedule Delivery</h1>
</header>
<!-- Main Scrollable Canvas -->
<main class="flex-1 overflow-y-auto px-4 py-6 pb-32 flex flex-col gap-8 relative z-10">
<!-- Context Section -->
<section class="flex flex-col gap-3">
<h2 class="font-label-md text-label-md text-on-surface-variant tracking-wider uppercase">Order Context</h2>
<div class="bg-surface-container rounded-xl p-4 border border-outline-variant/20 flex flex-col gap-4">
<div class="flex justify-between items-center">
<span class="text-on-surface-variant font-label-md text-label-md">Order ID</span>
<span class="font-mono-display text-mono-display text-primary">QH-20260902-1041</span>
</div>
<div class="h-px w-full bg-outline-variant/30"></div>
<div class="flex justify-between items-center">
<span class="text-on-surface-variant font-label-md text-label-md">Exception Reason</span>
<span class="text-error-red bg-error-container/20 px-3 py-1 rounded-full font-caption text-caption uppercase tracking-wider font-semibold border border-error-red/20 flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">person_off</span>
                            Customer Unavailable
                        </span>
</div>
</div>
</section>
<!-- New Schedule: Date -->
<section class="flex flex-col gap-3">
<h2 class="font-label-md text-label-md text-on-surface-variant tracking-wider uppercase">Select New Date</h2>
<div class="flex gap-3">
<button class="flex-1 py-3 border border-outline-variant/50 rounded-lg text-on-surface-variant hover:bg-surface-container transition-colors font-label-md text-label-md">
                        Today
                    </button>
<button class="flex-1 py-3 bg-primary-container/10 border border-primary text-primary rounded-lg font-label-md text-label-md font-bold relative overflow-hidden">
                        Tomorrow
                        <!-- Subtle selection indicator -->
<div class="absolute top-1 right-1 w-1.5 h-1.5 bg-primary rounded-full"></div>
</button>
<button class="w-[52px] h-[52px] flex items-center justify-center border border-outline-variant/50 rounded-lg text-on-surface-variant hover:bg-surface-container transition-colors shrink-0">
<span class="material-symbols-outlined">calendar_month</span>
</button>
</div>
</section>
<!-- New Schedule: Time -->
<section class="flex flex-col gap-3">
<h2 class="font-label-md text-label-md text-on-surface-variant tracking-wider uppercase">Select Time Slot</h2>
<div class="grid grid-cols-3 gap-3">
<button class="py-4 border border-outline-variant/50 rounded-lg text-on-surface-variant hover:bg-surface-container flex flex-col items-center gap-2 transition-colors">
<span class="material-symbols-outlined text-[24px]">light_mode</span>
<span class="font-caption text-caption">Morning</span>
</button>
<!-- Active Time Slot -->
<button class="py-4 bg-primary-container/10 border border-primary text-primary rounded-lg flex flex-col items-center gap-2 transition-colors relative">
<span class="material-symbols-outlined fill text-[24px]">partly_cloudy_day</span>
<span class="font-caption text-caption font-bold">Afternoon</span>
</button>
<button class="py-4 border border-outline-variant/50 rounded-lg text-on-surface-variant hover:bg-surface-container flex flex-col items-center gap-2 transition-colors opacity-50 cursor-not-allowed">
<span class="material-symbols-outlined text-[24px]">dark_mode</span>
<span class="font-caption text-caption">Evening</span>
</button>
</div>
</section>
<!-- Summary Block -->
<section class="mt-2 relative">
<div class="absolute inset-0 bg-gradient-to-b from-primary/5 to-transparent rounded-xl pointer-events-none"></div>
<div class="bg-surface-container-low rounded-xl p-5 border border-outline-variant/30 flex justify-between items-center relative overflow-hidden">
<!-- Decorative subtle grid background -->
<div class="absolute inset-0 opacity-[0.03]" style="background-image: radial-gradient(#fff 1px, transparent 1px); background-size: 16px 16px;"></div>
<div class="flex flex-col gap-1 relative z-10 w-[40%]">
<span class="font-caption text-caption text-on-surface-variant uppercase tracking-wider">Current</span>
<span class="font-body-md text-body-md text-on-surface line-through decoration-on-surface-variant/50">Today</span>
<span class="font-caption text-caption text-on-surface-variant">Afternoon</span>
</div>
<div class="relative z-10 w-8 h-8 rounded-full bg-surface-container-highest flex items-center justify-center border border-outline-variant/40 shrink-0">
<span class="material-symbols-outlined text-primary text-[18px]">arrow_forward</span>
</div>
<div class="flex flex-col gap-1 relative z-10 text-right w-[40%]">
<span class="font-caption text-caption text-primary uppercase tracking-wider">New Schedule</span>
<span class="font-body-md text-body-md text-primary font-bold">Tomorrow</span>
<span class="font-caption text-caption text-primary/80">Afternoon</span>
</div>
</div>
</section>
</main>
<!-- Fixed Bottom Action Area -->
<div class="absolute bottom-0 w-full p-4 bg-background/90 backdrop-blur-md border-t border-outline-variant/30 z-20 pb-safe shadow-[0_-10px_30px_rgba(0,0,0,0.5)]">
<button class="w-full bg-electric-violet hover:bg-primary text-white font-label-md text-label-md font-bold py-4 rounded-xl shadow-[0_0_20px_rgba(138,43,226,0.25)] transition-all active:scale-[0.98] flex items-center justify-center gap-2 h-14" id="confirmBtn">
<span>Confirm Reschedule</span>
<span class="material-symbols-outlined text-[20px]">event_available</span>
</button>
</div>
<!-- Success Toast Notification -->
<div class="absolute top-20 left-4 right-4 bg-success-bg border border-success-green/30 px-4 py-3 rounded-lg flex items-center gap-3 shadow-2xl opacity-0 translate-y-[-20px] transition-all duration-300 pointer-events-none z-50 backdrop-blur-sm" id="toast">
<span class="material-symbols-outlined text-success-green fill">check_circle</span>
<span class="font-label-md text-label-md text-success-green">Delivery rescheduled.</span>
</div>
</div>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const confirmBtn = document.getElementById('confirmBtn');
            const toast = document.getElementById('toast');

            confirmBtn.addEventListener('click', () => {
                // Button loading state simulation
                const originalText = confirmBtn.innerHTML;
                confirmBtn.innerHTML = `<span class="material-symbols-outlined animate-spin">sync</span><span>Processing...</span>`;
                confirmBtn.classList.add('opacity-80', 'pointer-events-none');
                
                setTimeout(() => {
                    // Revert button
                    confirmBtn.innerHTML = originalText;
                    confirmBtn.classList.remove('opacity-80', 'pointer-events-none');
                    
                    // Show toast
                    toast.classList.remove('opacity-0', 'translate-y-[-20px]');
                    toast.classList.add('opacity-100', 'translate-y-0');

                    // Hide toast after 3 seconds
                    setTimeout(() => {
                        toast.classList.remove('opacity-100', 'translate-y-0');
                        toast.classList.add('opacity-0', 'translate-y-[-20px]');
                    }, 3000);
                }, 800);
            });
        });
    </script>
