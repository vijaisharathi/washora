<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Saved Address Selection</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-surface-variant": "#cfc2d7",
                        "error-red": "#ffb4ab",
                        "success-bg": "#1A3D24",
                        "primary-container": "#8a2be2",
                        "on-background": "#e5e2e3",
                        "secondary-container": "#49494b",
                        "error-container": "#93000a",
                        "surface-bright": "#39393a",
                        "error": "#ffb4ab",
                        "surface-container-high": "#2a2a2b",
                        "surface-container-low": "#1c1b1c",
                        "on-secondary-fixed-variant": "#474648",
                        "tertiary-fixed": "#e4e2e4",
                        "inverse-on-surface": "#313031",
                        "inverse-primary": "#8422dc",
                        "primary-fixed": "#efdbff",
                        "background": "#131314",
                        "surface-variant": "#353436",
                        "surface-tint": "#dcb8ff",
                        "on-tertiary": "#303032",
                        "primary": "#dcb8ff",
                        "tertiary": "#c8c6c8",
                        "on-secondary-container": "#b9b8ba",
                        "on-primary-container": "#eed9ff",
                        "secondary-fixed-dim": "#c8c6c8",
                        "on-error": "#690005",
                        "on-primary-fixed-variant": "#6700b5",
                        "on-error-container": "#ffdad6",
                        "surface-container-lowest": "#0e0e0f",
                        "on-tertiary-fixed": "#1b1b1d",
                        "surface-container": "#201f20",
                        "outline-variant": "#4c4354",
                        "tertiary-container": "#646365",
                        "primary-fixed-dim": "#dcb8ff",
                        "on-primary": "#480081",
                        "on-tertiary-fixed-variant": "#474648",
                        "on-secondary": "#303032",
                        "on-surface": "#e5e2e3",
                        "electric-violet": "#8a2be2",
                        "tertiary-fixed-dim": "#c8c6c8",
                        "surface-dim": "#131314",
                        "secondary": "#c8c6c8",
                        "on-tertiary-container": "#e3e0e2",
                        "on-secondary-fixed": "#1b1b1d",
                        "surface-container-highest": "#353436",
                        "surface": "#131314",
                        "secondary-fixed": "#e4e2e4",
                        "outline": "#988ca0",
                        "on-primary-fixed": "#2c0051",
                        "inverse-surface": "#e5e2e3",
                        "success-green": "#81C784"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xl": "32px",
                        "lg": "24px",
                        "2xl": "48px",
                        "sm": "8px",
                        "3xl": "64px",
                        "xs": "4px",
                        "md": "16px"
                    },
                    "fontFamily": {
                        "label-md": ["Geist"],
                        "headline-lg": ["Geist"],
                        "h1": ["Geist"],
                        "h3": ["Geist"],
                        "caption": ["Geist"],
                        "display-lg": ["Geist"],
                        "mono-display": ["monospace"],
                        "body-md": ["Geist"]
                    },
                    "fontSize": {
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "h1": ["28px", { "lineHeight": "36px", "fontWeight": "700" }],
                        "h3": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "caption": ["12px", { "lineHeight": "16px", "fontWeight": "400" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "mono-display": ["18px", { "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1;
        }
    </style>
</head>
<body class="bg-background text-on-surface min-h-screen flex flex-col font-body-md">
<!-- Top Navigation (Suppressed due to transactional nature of the page, but adding a minimal header as per design) -->
<header class="w-full max-w-[1200px] mx-auto px-xl py-md flex items-center justify-between">
<div class="flex items-center gap-sm">
<button class="text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-h1 text-h1 text-primary">Select an Address</h1>
</div>
<div class="text-on-surface-variant font-label-md text-label-md">
            Step 2 of 4 (Location)
        </div>
</header>
<!-- Progress Bar -->
<div class="w-full max-w-[1200px] mx-auto px-xl mb-lg">
<div class="h-2 w-full bg-surface-container rounded-full overflow-hidden flex">
<div class="h-full bg-electric-violet w-1/4 rounded-full"></div>
<div class="h-full bg-electric-violet w-1/4 rounded-full ml-1"></div>
<div class="h-full bg-surface-variant w-1/4 rounded-full ml-1"></div>
<div class="h-full bg-surface-variant w-1/4 rounded-full ml-1"></div>
</div>
</div>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-[800px] mx-auto px-xl py-lg flex flex-col gap-lg">
<!-- Selected Address Card -->
<label class="block cursor-pointer group">
<input checked="" class="peer sr-only" name="address" type="radio" value="home"/>
<div class="relative bg-surface-container-low border border-outline-variant/30 rounded-lg p-lg hover:border-primary/50 transition-colors peer-checked:border-primary peer-checked:bg-primary/10">
<div class="flex items-start justify-between">
<div class="flex items-center gap-sm mb-md">
<span class="material-symbols-outlined text-primary" data-icon="home">home</span>
<h3 class="font-h3 text-h3 text-on-surface">HOME</h3>
</div>
<!-- Checkmark for selected state -->
<span class="material-symbols-outlined text-electric-violet opacity-0 peer-checked:opacity-100 transition-opacity" data-icon="check_circle">check_circle</span>
</div>
<div class="text-on-surface-variant">
<p class="font-label-md text-label-md mb-xs text-on-surface">Arun Kumar</p>
<p class="font-body-md text-body-md">12, Example Street, Anna Nagar</p>
<p class="font-body-md text-body-md">Chennai - 600040</p>
</div>
</div>
</label>
<!-- Unselected Address Card -->
<label class="block cursor-pointer group">
<input class="peer sr-only" name="address" type="radio" value="work"/>
<div class="relative bg-surface-container-low border border-outline-variant/30 rounded-lg p-lg hover:border-primary/50 transition-colors peer-checked:border-primary peer-checked:bg-primary/10">
<div class="flex items-start justify-between">
<div class="flex items-center gap-sm mb-md">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors" data-icon="work">work</span>
<h3 class="font-h3 text-h3 text-on-surface">WORK</h3>
</div>
<span class="material-symbols-outlined text-electric-violet opacity-0 peer-checked:opacity-100 transition-opacity" data-icon="check_circle">check_circle</span>
</div>
<div class="text-on-surface-variant">
<p class="font-label-md text-label-md mb-xs text-on-surface">Example Office</p>
<p class="font-body-md text-body-md">Nungambakkam</p>
<p class="font-body-md text-body-md">Chennai - 600034</p>
</div>
</div>
</label>
<!-- Add New Address Button -->
<button class="w-full flex items-center justify-center gap-sm py-md bg-surface-container border border-outline-variant/50 rounded-lg text-primary font-label-md text-label-md hover:bg-surface-variant transition-colors border-dashed">
<span class="material-symbols-outlined" data-icon="add">add</span>
            Add New Address
        </button>
</main>
<!-- Bottom Action Bar -->
<div class="w-full border-t border-outline-variant/30 bg-surface/90 backdrop-blur-md fixed bottom-0 left-0 right-0 p-lg">
<div class="max-w-[800px] mx-auto flex justify-end">
<button class="bg-electric-violet text-on-primary px-xl py-md rounded-lg font-label-md text-label-md font-bold shadow-lg shadow-electric-violet/20 hover:bg-electric-violet/90 transition-colors">
                Continue
            </button>
</div>
</div>
<!-- Spacer for fixed bottom bar -->
<div class="h-[100px]"></div>
</body></html>
