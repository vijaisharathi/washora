<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>

<title>Add Service - Lumina</title>

                        "inverse-on-surface": "#313031",
                        "surface-variant": "#353436",

                    borderRadius: {

<style type="text/tailwindcss">
        @layer utilities {
            .scrollbar-hide::-webkit-scrollbar {
                display: none;
            }
            .scrollbar-hide {
                -ms-overflow-style: none;
                scrollbar-width: none;
            }
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body-md min-h-screen antialiased flex flex-col md:flex-row overflow-x-hidden selection:bg-primary/30 selection:text-primary">
<!-- Content Canvas -->
<main class="flex-1 flex flex-col min-h-screen w-full relative">
<!-- Header area for intent focus (No full nav shell as per instructions for transactional/onboarding flow) -->
<header class="h-16 border-b border-outline-variant/30 px-xl flex items-center justify-between bg-surface/80 backdrop-blur-md z-30 sticky top-0">
<div class="flex items-center gap-md">
<button class="w-10 h-10 rounded-full flex items-center justify-center text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-[20px]" data-icon="close">close</span>
</button>
<div class="font-h3 text-h3 font-bold text-on-surface tracking-tight">Add Service</div>
</div>
<button class="font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors">Save Draft</button>
</header>
<!-- Main Content Area -->
<div class="flex-1 max-w-[800px] w-full mx-auto px-md py-xl md:px-xl">
<!-- Progress Stepper -->
<div class="mb-xl">
<div class="flex items-center justify-between relative">
<!-- Connecting line -->
<div class="absolute left-0 top-1/2 -translate-y-1/2 w-full h-[2px] bg-surface-container-high z-0 rounded-full"></div>
<div class="absolute left-0 top-1/2 -translate-y-1/2 h-[2px] bg-primary z-0 rounded-full w-[10%]"></div>
<!-- Steps -->
<div class="flex flex-col items-center gap-sm relative z-10">
<div class="w-8 h-8 rounded-full bg-primary text-background flex items-center justify-center font-label-md shadow-[0_0_12px_rgba(220,184,255,0.4)]">1</div>
<span class="font-caption text-caption text-primary font-medium">Details</span>
</div>
<div class="flex flex-col items-center gap-sm relative z-10">
<div class="w-8 h-8 rounded-full bg-surface-container border-2 border-outline-variant text-on-surface-variant flex items-center justify-center font-label-md">2</div>
<span class="font-caption text-caption text-on-surface-variant">Pricing</span>
</div>
<div class="flex flex-col items-center gap-sm relative z-10">
<div class="w-8 h-8 rounded-full bg-surface-container border-2 border-outline-variant text-on-surface-variant flex items-center justify-center font-label-md">3</div>
<span class="font-caption text-caption text-on-surface-variant">Add-ons</span>
</div>
<div class="flex flex-col items-center gap-sm relative z-10">
<div class="w-8 h-8 rounded-full bg-surface-container border-2 border-outline-variant text-on-surface-variant flex items-center justify-center font-label-md">4</div>
<span class="font-caption text-caption text-on-surface-variant">Availability</span>
</div>
<div class="flex flex-col items-center gap-sm relative z-10 hidden sm:flex">
<div class="w-8 h-8 rounded-full bg-surface-container border-2 border-outline-variant text-on-surface-variant flex items-center justify-center font-label-md">5</div>
<span class="font-caption text-caption text-on-surface-variant">Preview</span>
</div>
</div>
</div>
<!-- Form Container -->
<div class="bg-surface-container rounded-xl border border-outline-variant/20 p-lg md:p-xl shadow-sm space-y-xl">
<div class="space-y-sm">
<h2 class="font-h3 text-h3 text-on-surface">Service Details</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Provide the foundational information about the service you are offering.</p>
</div>
<!-- Form Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-lg">
<!-- Category -->
<div class="space-y-sm col-span-1 md:col-span-2">
<label class="font-label-md text-label-md text-on-surface block">Category</label>
<div class="relative group">
<select class="w-full bg-surface-container-low border border-outline-variant/50 rounded-lg px-md py-sm h-12 text-on-surface appearance-none focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all duration-200">
<option selected="" value="shoe_cleaning">Shoe Cleaning</option>
<option value="apparel">Apparel</option>
<option value="accessories">Accessories</option>
</select>
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none group-focus-within:text-primary transition-colors">expand_more</span>
</div>
</div>
<!-- Service Name -->
<div class="space-y-sm col-span-1 md:col-span-2">
<label class="font-label-md text-label-md text-on-surface block">Service Name</label>
<input class="w-full bg-surface-container-low border border-outline-variant/50 rounded-lg px-md py-sm h-12 text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all duration-200" placeholder="e.g. Standard Wash" type="text" value="Sneaker Deep Clean"/>
</div>
<!-- Short Description -->
<div class="space-y-sm col-span-1 md:col-span-2">
<label class="font-label-md text-label-md text-on-surface block">Short Description</label>
<input class="w-full bg-surface-container-low border border-outline-variant/50 rounded-lg px-md py-sm h-12 text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all duration-200" placeholder="A brief one-liner summarizing the service" type="text" value="Deep cleaning service for everyday and premium sneakers."/>
</div>
<!-- Full Description -->
<div class="space-y-sm col-span-1 md:col-span-2">
<div class="flex justify-between items-end mb-xs">
<label class="font-label-md text-label-md text-on-surface block">Service Description</label>
<span class="font-caption text-caption text-on-surface-variant">108/500</span>
</div>
<textarea class="w-full bg-surface-container-low border border-outline-variant/50 rounded-lg px-md py-md min-h-[120px] text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all duration-200 resize-y" placeholder="Detailed description of what is included...">Professional sneaker cleaning focused on removing dirt, stains and odor while preserving the material.</textarea>
</div>
</div>
<hr class="border-outline-variant/20"/>
<!-- Service Type (Radio Cards) -->
<div class="space-y-md">
<label class="font-label-md text-label-md text-on-surface block mb-sm">Service Type <span class="text-on-surface-variant font-normal ml-sm text-sm">How is this priced?</span></label>
<div class="grid grid-cols-2 md:grid-cols-3 gap-md">
<!-- Card 1 -->
<label class="relative flex cursor-pointer rounded-lg border bg-surface-container-low p-md focus:outline-none border-outline-variant/50 hover:border-outline-variant transition-colors">
<input class="sr-only peer" name="service_type" type="radio" value="per_item"/>
<span class="flex flex-col gap-sm w-full">
<span class="material-symbols-outlined text-on-surface-variant peer-checked:text-primary transition-colors">sell</span>
<span class="font-label-md text-label-md text-on-surface block">Per Item</span>
</span>
<span aria-hidden="true" class="pointer-events-none absolute -inset-px rounded-lg peer-checked:border-2 peer-checked:border-primary transition-all"></span>
</label>
<!-- Card 2 -->
<label class="relative flex cursor-pointer rounded-lg border bg-surface-container-low p-md focus:outline-none border-outline-variant/50 hover:border-outline-variant transition-colors">
<input class="sr-only peer" name="service_type" type="radio" value="per_kg"/>
<span class="flex flex-col gap-sm w-full">
<span class="material-symbols-outlined text-on-surface-variant peer-checked:text-primary transition-colors">scale</span>
<span class="font-label-md text-label-md text-on-surface block">Per KG</span>
</span>
<span aria-hidden="true" class="pointer-events-none absolute -inset-px rounded-lg peer-checked:border-2 peer-checked:border-primary transition-all"></span>
</label>
<!-- Card 3 (Active) -->
<label class="relative flex cursor-pointer rounded-lg border bg-surface-container-low p-md focus:outline-none border-primary bg-primary/5 transition-colors">
<input checked="" class="sr-only peer" name="service_type" type="radio" value="per_pair"/>
<span class="flex flex-col gap-sm w-full">
<span class="material-symbols-outlined text-primary">steps</span>
<span class="font-label-md text-label-md text-on-surface block">Per Pair</span>
</span>
<span aria-hidden="true" class="pointer-events-none absolute -inset-px rounded-lg border-2 border-primary transition-all"></span>
<!-- Active indicator dot -->
<span class="absolute top-md right-md w-2 h-2 rounded-full bg-primary shadow-[0_0_8px_rgba(220,184,255,0.6)]"></span>
</label>
<!-- Card 4 -->
<label class="relative flex cursor-pointer rounded-lg border bg-surface-container-low p-md focus:outline-none border-outline-variant/50 hover:border-outline-variant transition-colors">
<input class="sr-only peer" name="service_type" type="radio" value="per_vehicle"/>
<span class="flex flex-col gap-sm w-full">
<span class="material-symbols-outlined text-on-surface-variant peer-checked:text-primary transition-colors">directions_car</span>
<span class="font-label-md text-label-md text-on-surface block">Per Vehicle</span>
</span>
<span aria-hidden="true" class="pointer-events-none absolute -inset-px rounded-lg peer-checked:border-2 peer-checked:border-primary transition-all"></span>
</label>
<!-- Card 5 -->
<label class="relative flex cursor-pointer rounded-lg border bg-surface-container-low p-md focus:outline-none border-outline-variant/50 hover:border-outline-variant transition-colors">
<input class="sr-only peer" name="service_type" type="radio" value="per_helmet"/>
<span class="flex flex-col gap-sm w-full">
<span class="material-symbols-outlined text-on-surface-variant peer-checked:text-primary transition-colors">sports_motorsports</span>
<span class="font-label-md text-label-md text-on-surface block">Per Helmet</span>
</span>
<span aria-hidden="true" class="pointer-events-none absolute -inset-px rounded-lg peer-checked:border-2 peer-checked:border-primary transition-all"></span>
</label>
</div>
</div>
<hr class="border-outline-variant/20"/>
<!-- Additional Details -->
<div class="grid grid-cols-1 gap-lg">
<!-- Item Eligibility (Chips) -->
<div class="space-y-sm">
<label class="font-label-md text-label-md text-on-surface block">Item Eligibility</label>
<div class="flex flex-wrap gap-sm">
<div class="inline-flex items-center gap-xs px-sm py-[6px] rounded-full bg-surface-container-low border border-outline-variant/50 text-on-surface font-label-md group hover:border-outline transition-colors cursor-pointer">
<span>Sneakers</span>
<span class="material-symbols-outlined text-[16px] text-on-surface-variant group-hover:text-error transition-colors">close</span>
</div>
<div class="inline-flex items-center gap-xs px-sm py-[6px] rounded-full bg-surface-container-low border border-outline-variant/50 text-on-surface font-label-md group hover:border-outline transition-colors cursor-pointer">
<span>Canvas Shoes</span>
<span class="material-symbols-outlined text-[16px] text-on-surface-variant group-hover:text-error transition-colors">close</span>
</div>
<div class="inline-flex items-center gap-xs px-sm py-[6px] rounded-full bg-surface-container-low border border-outline-variant/50 text-on-surface font-label-md group hover:border-outline transition-colors cursor-pointer">
<span>Mesh Shoes</span>
<span class="material-symbols-outlined text-[16px] text-on-surface-variant group-hover:text-error transition-colors">close</span>
</div>
<div class="inline-flex items-center gap-xs px-sm py-[6px] rounded-full bg-surface-container-low border border-dashed border-outline-variant text-on-surface-variant font-label-md hover:text-on-surface hover:border-outline transition-colors cursor-pointer">
<span class="material-symbols-outlined text-[16px]">add</span>
<span>Add Item</span>
</div>
</div>
</div>
<!-- Care Handling -->
<div class="space-y-sm">
<label class="font-label-md text-label-md text-on-surface block">Care / Handling</label>
<div class="relative group max-w-sm">
<select class="w-full bg-surface-container-low border border-outline-variant/50 rounded-lg px-md py-sm h-12 text-on-surface appearance-none focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all duration-200">
<option value="standard">Standard</option>
<option value="delicate">Delicate</option>
<option selected="" value="special_care">Special Care</option>
</select>
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none group-focus-within:text-primary transition-colors">expand_more</span>
</div>
</div>
</div>
</div>
<!-- Bottom Action Bar -->
<div class="mt-xl pt-lg border-t border-outline-variant/20 flex justify-end gap-md pb-2xl">
<button class="px-lg py-sm h-12 rounded-lg border border-outline-variant text-on-surface font-label-md hover:bg-surface-container-high transition-colors duration-200">
                    Cancel
                </button>
<button class="px-lg py-sm h-12 rounded-lg bg-electric-violet text-white font-label-md font-bold shadow-[0_4px_14px_rgba(138,43,226,0.25)] hover:shadow-[0_6px_20px_rgba(138,43,226,0.4)] transition-all duration-200 flex items-center gap-sm">
                    Save &amp; Continue
                    <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</div>
</main>
</body></html>
