<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Error - Delivery Pro</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

                        "surface-container-high": "#2a2a2b",
                        "on-surface": "#e5e2e3",
                        "on-primary": "#480081",
                        "on-tertiary-container": "#e3e0e2",
                        "outline": "#988ca0",
                        "on-primary-fixed": "#2c0051",
                        "inverse-surface": "#e5e2e3",
                        "primary-fixed-dim": "#dcb8ff",
                        "outline-variant": "#4c4354",
                        "inverse-primary": "#8422dc",
                        "on-secondary-fixed": "#1b1b1d",
                        "surface-container-highest": "#353436",
                        "tertiary": "#c8c6c8",
                        "on-tertiary-fixed": "#1b1b1d",
                        "tertiary-container": "#646365",
                        "secondary-container": "#474649",
                        "on-surface-variant": "#cfc2d7",
                        "primary": "#dcb8ff",
                        "inverse-on-surface": "#313031",
                        "on-secondary": "#303032",
                        "secondary-fixed-dim": "#c8c6c8",
                        "surface-container": "#201f20",
                        "on-background": "#e5e2e3",
                        "tertiary-fixed": "#e4e2e4",
                        "surface": "#131314",
                        "primary-fixed": "#efdbff",
                        "secondary-fixed": "#e5e1e4",
                        "surface-tint": "#dcb8ff",
                        "on-primary-fixed-variant": "#6700b5",
                        "surface-container-lowest": "#0e0e0f",
                        "on-error": "#690005",
                        "surface-bright": "#3a393a",
                        "primary-container": "#8a2be2",

                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xl": "32px",
                        "2xl": "48px",
                        "3xl": "64px",
                        "md": "16px",
                        "lg": "24px",
                        "sm": "8px",
                        "xs": "4px"
                    },
                    "fontFamily": {
                        "headline-md": ["Geist", "sans-serif"],
                        "display-lg-mobile": ["Geist", "sans-serif"],
                        "body-lg": ["Geist", "sans-serif"],

                    "fontSize": {

<style>
        body {
            font-family: 'Geist', sans-serif;
            background-color: #0A0A0B; /* Layer 0 */
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col antialiased">
<!-- Top Navigation (Hidden on small screens, as this is a transactional/error screen) -->
<header class="fixed top-0 w-full z-50 border-b border-white/5 bg-surface/80 backdrop-blur-md shadow-sm h-16 hidden md:flex items-center justify-between px-md w-full">
<div class="flex items-center space-x-4">
<button aria-label="Menu" class="p-2 text-on-surface-variant hover:bg-surface-variant/50 rounded-full active:scale-95 transition-transform">
<span class="material-symbols-outlined">menu</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary">Delivery Pro</h1>
</div>
<div>
<button aria-label="Offline Mode" class="p-2 text-on-surface-variant hover:bg-surface-variant/50 rounded-full active:scale-95 transition-transform">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">offline_bolt</span>
</button>
</div>
</header>
<!-- Main Content Canvas (Suppressed navigation for focused journey/dead end) -->
<main class="flex-grow flex items-center justify-center p-md lg:p-2xl w-full max-w-[1280px] mx-auto mt-0 md:mt-16">
<!-- Error State Container (Glassmorphism & Tonal Layers) -->
<div class="w-full max-w-md bg-surface-container-low rounded-xl border border-white/[0.05] p-xl flex flex-col items-center text-center shadow-lg relative overflow-hidden">
<!-- Subtle background glow -->
<div class="absolute inset-0 bg-primary/5 blur-[50px] rounded-full pointer-events-none"></div>
<!-- Icon Container -->
<div class="w-24 h-24 rounded-full bg-surface-variant border border-white/10 flex items-center justify-center mb-lg relative z-10">
<span class="material-symbols-outlined text-4xl text-outline-variant" style="font-variation-settings: 'wght' 200;">info</span>
</div>
<!-- Typography -->
<h2 class="font-headline-lg text-headline-lg md:font-display-lg md:text-display-lg text-on-surface mb-sm relative z-10">
                Something went wrong.
            </h2>
<p class="font-body-lg text-body-lg text-on-surface-variant mb-xl max-w-sm relative z-10">
                We couldn’t complete that action. Please try again.
            </p>
<!-- Reference Code -->
<div class="bg-surface-dim rounded-md px-4 py-2 border border-white/[0.05] mb-2xl relative z-10">
<span class="font-caption text-caption text-outline uppercase tracking-wider">Ref Code: ERR-2048</span>
</div>
<!-- Actions Container -->
<div class="flex flex-col w-full space-y-md relative z-10">
<button class="w-full h-12 bg-primary text-on-primary font-label-md text-label-md rounded-lg flex items-center justify-center hover:bg-primary-fixed transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background active:scale-[0.98]">
                    TRY AGAIN
                </button>
<button class="w-full h-12 bg-transparent text-secondary border border-secondary/30 font-label-md text-label-md rounded-lg flex items-center justify-center hover:bg-surface-variant hover:text-on-surface transition-colors focus:outline-none focus:ring-2 focus:ring-secondary focus:ring-offset-2 focus:ring-offset-background active:scale-[0.98]">
                    GO TO HOME
                </button>
</div>
</div>
</main>
</body></html>
