    body {
      min-height: max(884px, 100dvh);

<body class="bg-background text-on-background min-h-screen flex items-center justify-center font-body-md antialiased p-md md:p-lg">
<!-- Mandatory TopAppBar (Suppressed structurally per instructions as it's a transactional/dead-end screen, but demonstrating compliance by not injecting shell when inappropriate. We will use a minimal embedded branding instead.) -->
<!-- Main Content Container: Centered Glassmorphic Card -->
<main class="w-full max-w-md mx-auto relative z-10">
<div class="bg-surface-container-low/80 backdrop-blur-2xl rounded-[32px] p-xl shadow-[0_8px_32px_rgba(0,0,0,0.4)] border border-white/5 flex flex-col items-center text-center relative overflow-hidden">
<!-- Atmospheric Glow Background inside card -->
<div class="absolute -top-3xl -right-3xl w-64 h-64 bg-primary/20 rounded-full blur-[80px] pointer-events-none"></div>
<div class="absolute -bottom-3xl -left-3xl w-64 h-64 bg-primary-container/20 rounded-full blur-[80px] pointer-events-none"></div>
<!-- Icon -->
<div class="w-24 h-24 bg-surface-container-high rounded-full flex items-center justify-center mb-lg relative z-10 border border-white/5 shadow-inner">
<span class="material-symbols-outlined text-[48px] text-primary" data-icon="system_update" data-weight="fill" style="font-variation-settings: 'FILL' 1;">system_update</span>
<!-- Subtle ping animation for the update icon -->
<div class="absolute inset-0 rounded-full bg-primary/20 animate-ping opacity-75"></div>
</div>
<!-- Header -->
<div class="relative z-10 w-full mb-md">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface mb-sm">Update required.</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-sm mx-auto">A newer version of the app is required to continue receiving and managing deliveries.</p>
</div>
<!-- Version Info Box -->
<div class="w-full bg-surface-container/50 rounded-xl p-md mb-lg flex justify-between items-center border border-white/5 relative z-10">
<div class="flex flex-col items-start">
<span class="font-caption text-caption text-on-surface-variant uppercase tracking-wider mb-xs">Current</span>
<span class="font-label-md text-label-md text-on-surface line-through opacity-70">2.4.1</span>
</div>
<span class="material-symbols-outlined text-outline">arrow_forward</span>
<div class="flex flex-col items-end">
<span class="font-caption text-caption text-primary uppercase tracking-wider mb-xs">Required</span>
<span class="font-label-md text-label-md text-primary font-bold">2.5.0</span>
</div>
</div>
<!-- Benefits List -->
<div class="w-full text-left mb-xl relative z-10 space-y-md pl-sm">
<div class="flex items-center gap-md">
<div class="w-8 h-8 rounded-full bg-primary-container/20 flex items-center justify-center">
<span class="material-symbols-outlined text-[18px] text-primary" data-icon="rocket_launch">rocket_launch</span>
</div>
<span class="font-body-md text-body-md text-on-surface">Improved reliability</span>
</div>
<div class="flex items-center gap-md">
<div class="w-8 h-8 rounded-full bg-primary-container/20 flex items-center justify-center">
<span class="material-symbols-outlined text-[18px] text-primary" data-icon="security">security</span>
</div>
<span class="font-body-md text-body-md text-on-surface">Security updates</span>
</div>
<div class="flex items-center gap-md">
<div class="w-8 h-8 rounded-full bg-primary-container/20 flex items-center justify-center">
<span class="material-symbols-outlined text-[18px] text-primary" data-icon="bug_report">bug_report</span>
</div>
<span class="font-body-md text-body-md text-on-surface">Bug fixes</span>
</div>
</div>
<!-- Primary CTA -->
<button class="w-full bg-primary text-on-primary font-label-md text-label-md font-bold py-md px-lg rounded-xl hover:bg-primary-fixed transition-colors shadow-lg active:scale-95 duration-200 relative z-10 flex items-center justify-center gap-sm">
                UPDATE APP
                <span class="material-symbols-outlined text-[20px]">download</span>
</button>
</div>
</main>
<!-- Suppressed Nav Shell: As per instructions, this is a forced dead-end linear flow screen. No top app bar or bottom nav bar should be rendered to trap the user here until they update. -->
