<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Add your vehicle</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "primary-fixed-dim": "#dcb8ff",
                      "on-surface": "#e5e2e3",
                      "on-secondary-container": "#b7b4b7",
                      "on-error": "#690005",
                      "inverse-primary": "#8422dc",
                      "on-secondary-fixed-variant": "#474649",
                      "primary-fixed": "#efdbff",
                      "on-tertiary-container": "#e3e0e2",
                      "surface-bright": "#3a393a",
                      "inverse-on-surface": "#313031",
                      "tertiary-container": "#646365",
                      "surface-container-low": "#1c1b1c",
                      "surface-container-lowest": "#0e0e0f",
                      "on-tertiary": "#303032",
                      "on-primary-fixed-variant": "#6700b5",
                      "on-primary-fixed": "#2c0051",
                      "inverse-surface": "#e5e2e3",
                      "surface-tint": "#dcb8ff",
                      "surface-variant": "#353436",
                      "on-secondary": "#303032",
                      "tertiary": "#c8c6c8",
                      "secondary-container": "#474649",
                      "on-tertiary-fixed": "#1b1b1d",
                      "surface": "#131314",
                      "on-background": "#e5e2e3",
                      "tertiary-fixed": "#e4e2e4",
                      "primary": "#dcb8ff",
                      "secondary-fixed-dim": "#c8c6c8",
                      "error-container": "#93000a",
                      "on-secondary-fixed": "#1b1b1d",
                      "outline-variant": "#4c4354",
                      "on-tertiary-fixed-variant": "#474649",
                      "background": "#131314",
                      "surface-dim": "#131314",
                      "primary-container": "#8a2be2",
                      "outline": "#988ca0",
                      "surface-container-highest": "#353436",
                      "on-primary": "#480081",
                      "secondary": "#c8c6c8",
                      "tertiary-fixed-dim": "#c8c6c8",
                      "error": "#ffb4ab",
                      "surface-container": "#201f20",
                      "on-primary-container": "#eed9ff",
                      "on-surface-variant": "#cfc2d7",
                      "secondary-fixed": "#e5e1e4",
                      "on-error-container": "#ffdad6",
                      "surface-container-high": "#2a2a2b"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "3xl": "64px",
                      "xl": "32px",
                      "lg": "24px",
                      "2xl": "48px",
                      "xs": "4px",
                      "sm": "8px",
                      "md": "16px"
              },
              "fontFamily": {
                      "body-md": ["Geist"],
                      "display-lg-mobile": ["Geist"],
                      "caption": ["Geist"],
                      "display-lg": ["Geist"],
                      "headline-md": ["Geist"],
                      "label-md": ["Geist"],
                      "headline-lg": ["Geist"],
                      "body-lg": ["Geist"]
              },
              "fontSize": {
                      "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                      "display-lg-mobile": ["36px", {"lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                      "caption": ["12px", {"lineHeight": "16px", "fontWeight": "400"}],
                      "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                      "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                      "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500"}],
                      "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                      "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}]
              }
            }
          }
        }
    </script>
<style>
        body {
            font-family: 'Geist', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        /* Hide scrollbar for vehicle type selector */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex justify-center selection:bg-primary-container selection:text-on-primary-container">
<div class="w-full max-w-[390px] relative bg-surface-dim min-h-screen pb-[100px] flex flex-col shadow-2xl overflow-hidden ring-1 ring-white/5 mx-auto">
<!-- Header -->
<header class="flex items-center justify-between px-md h-16 w-full fixed top-0 z-50 bg-surface/80 backdrop-blur-xl border-b border-white/5 shadow-sm transition-transform">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-variant/50 text-on-surface-variant active:scale-95 transition-transform">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary font-bold">Add your vehicle</h1>
<div class="w-10 h-10 flex items-center justify-center">
<span class="font-label-md text-label-md text-on-surface-variant">3/6</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 mt-16 px-md py-lg flex flex-col gap-lg overflow-y-auto">
<!-- Progress Stepper -->
<div class="w-full h-1 bg-surface-container rounded-full overflow-hidden flex">
<div class="h-full bg-primary w-1/2 shadow-[0_0_8px_rgba(220,184,255,0.5)]"></div>
</div>
<!-- Vehicle Type Selection (Horizontal Scroll) -->
<section class="flex flex-col gap-sm">
<h2 class="font-label-md text-label-md text-on-surface-variant mb-xs">Vehicle Type</h2>
<div class="flex gap-sm overflow-x-auto no-scrollbar pb-xs -mx-md px-md">
<!-- Bike (Active) -->
<div class="flex-shrink-0 w-24 h-24 rounded-xl bg-surface-container border border-primary relative flex flex-col items-center justify-center gap-xs cursor-pointer active:scale-95 transition-all shadow-[0_0_12px_rgba(138,43,226,0.15)] overflow-hidden group">
<div class="absolute inset-0 bg-primary/5 group-hover:bg-primary/10 transition-colors"></div>
<span class="material-symbols-outlined text-primary text-3xl z-10" data-icon="motorcycle" style="font-variation-settings: 'FILL' 1;">motorcycle</span>
<span class="font-label-md text-label-md text-primary z-10">Bike</span>
<div class="absolute top-2 right-2 w-4 h-4 bg-primary rounded-full flex items-center justify-center z-10">
<span class="material-symbols-outlined text-[10px] text-on-primary font-bold" data-icon="check">check</span>
</div>
</div>
<!-- Scooter -->
<div class="flex-shrink-0 w-24 h-24 rounded-xl bg-surface-container border border-white/5 relative flex flex-col items-center justify-center gap-xs cursor-pointer active:scale-95 transition-all hover:bg-surface-container-high">
<span class="material-symbols-outlined text-on-surface-variant text-3xl" data-icon="moped">moped</span>
<span class="font-label-md text-label-md text-on-surface-variant">Scooter</span>
</div>
<!-- Cycle -->
<div class="flex-shrink-0 w-24 h-24 rounded-xl bg-surface-container border border-white/5 relative flex flex-col items-center justify-center gap-xs cursor-pointer active:scale-95 transition-all hover:bg-surface-container-high">
<span class="material-symbols-outlined text-on-surface-variant text-3xl" data-icon="pedal_bike">pedal_bike</span>
<span class="font-label-md text-label-md text-on-surface-variant">Cycle</span>
</div>
<!-- Other -->
<div class="flex-shrink-0 w-24 h-24 rounded-xl bg-surface-container border border-white/5 relative flex flex-col items-center justify-center gap-xs cursor-pointer active:scale-95 transition-all hover:bg-surface-container-high">
<span class="material-symbols-outlined text-on-surface-variant text-3xl" data-icon="directions_car">directions_car</span>
<span class="font-label-md text-label-md text-on-surface-variant">Other</span>
</div>
</div>
</section>
<!-- Form Fields -->
<section class="flex flex-col gap-md">
<!-- Registration Number -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-xs">Vehicle registration number</label>
<div class="relative flex items-center bg-surface-container rounded-xl border border-white/5 focus-within:border-primary focus-within:ring-1 focus-within:ring-primary transition-all group">
<span class="material-symbols-outlined text-on-surface-variant pl-md group-focus-within:text-primary transition-colors" data-icon="tag">tag</span>
<input class="w-full bg-transparent border-none font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:ring-0 py-md px-sm uppercase" placeholder="e.g. AB12 CDE" type="text" value="DL01 AB 1234"/>
</div>
</div>
<!-- Vehicle Model -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-xs">Vehicle model</label>
<div class="relative flex items-center bg-surface-container rounded-xl border border-white/5 focus-within:border-primary focus-within:ring-1 focus-within:ring-primary transition-all group">
<span class="material-symbols-outlined text-on-surface-variant pl-md group-focus-within:text-primary transition-colors" data-icon="directions_bike">directions_bike</span>
<input class="w-full bg-transparent border-none font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:ring-0 py-md px-sm" placeholder="e.g. Honda Activa 6G" type="text"/>
</div>
</div>
<!-- Vehicle Color -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-xs">Vehicle color</label>
<div class="relative flex items-center bg-surface-container rounded-xl border border-white/5 focus-within:border-primary focus-within:ring-1 focus-within:ring-primary transition-all group">
<span class="material-symbols-outlined text-on-surface-variant pl-md group-focus-within:text-primary transition-colors" data-icon="palette">palette</span>
<input class="w-full bg-transparent border-none font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:ring-0 py-md px-sm" placeholder="e.g. Matte Black" type="text"/>
</div>
</div>
</section>
<!-- Vehicle Photo Upload -->
<section class="flex flex-col gap-sm mt-sm">
<div class="flex justify-between items-end mb-xs">
<h2 class="font-label-md text-label-md text-on-surface-variant">Vehicle photo</h2>
<span class="font-caption text-caption text-on-surface-variant/70">Required</span>
</div>
<div class="w-full h-32 rounded-xl border-2 border-dashed border-white/10 hover:border-primary/50 bg-surface-container flex flex-col items-center justify-center gap-sm cursor-pointer transition-all active:scale-[0.98] group relative overflow-hidden">
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center group-hover:bg-primary/20 transition-colors z-10">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors" data-icon="add_a_photo">add_a_photo</span>
</div>
<span class="font-label-md text-label-md text-on-surface-variant group-hover:text-primary transition-colors z-10">Tap to upload photo</span>
<!-- Decorative subtle glow -->
<div class="absolute inset-0 bg-gradient-to-b from-primary/0 to-primary/5 opacity-0 group-hover:opacity-100 transition-opacity"></div>
</div>
</section>
</main>
<!-- Fixed Bottom Action -->
<div class="fixed bottom-0 w-full max-w-[390px] p-md bg-gradient-to-t from-surface-dim via-surface-dim/95 to-transparent pt-lg z-40">
<button class="w-full h-14 bg-primary text-on-primary rounded-xl font-headline-md text-headline-md flex items-center justify-center hover:opacity-90 active:scale-[0.98] transition-all shadow-[0_4px_16px_rgba(220,184,255,0.2)]">
                Continue
            </button>
</div>
</div>
</body></html>
