<body class="bg-surface text-on-surface font-body-md min-h-screen flex items-center justify-center p-md sm:p-xl">
<!-- Transactional Screen - No Nav Shells rendered -->
<main class="w-full max-w-2xl mx-auto bg-surface-container rounded-xl border border-outline-variant/20 p-xl shadow-2xl relative overflow-hidden">
<!-- Subtle gradient orb for visual interest -->
<div class="absolute -top-32 -right-32 w-64 h-64 bg-electric-violet/10 rounded-full blur-3xl pointer-events-none"></div>
<!-- Header Section -->
<header class="mb-lg relative z-10">
<!-- Back Action (Transactional exit) -->
<button class="mb-lg text-on-surface-variant hover:text-primary transition-colors flex items-center gap-xs font-label-md text-label-md">
<span class="material-symbols-outlined" data-icon="arrow_back" style="font-size: 20px;">arrow_back</span>
                Back
            </button>
<h1 class="font-headline-lg text-headline-lg text-primary mb-sm">Write a Review</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Tell us what you liked or what we could improve.</p>
</header>
<!-- Main Form Content -->
<div class="space-y-xl relative z-10">
<!-- Text Area Section -->
<div class="flex flex-col gap-sm relative">
<label class="sr-only" for="review-text">Your Review</label>
<!-- Match input field style: background surface-container-low, border outline-variant/50, focus primary -->
<textarea class="w-full bg-surface-container-low border border-outline-variant/50 rounded-lg p-md font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:border-primary focus:ring-1 focus:ring-primary focus:outline-none transition-all resize-none" id="review-text" maxlength="500" oninput="document.getElementById('char-count').innerText = this.value.length + '/500'" placeholder="Share your experience..." rows="6"></textarea>
<div class="flex justify-end">
<span class="font-caption text-caption text-on-surface-variant" id="char-count">0/500</span>
</div>
</div>
<!-- Suggestion Chips -->
<div>
<p class="font-label-md text-label-md text-on-surface mb-md">Quick Suggestions</p>
<div class="flex flex-wrap gap-sm">
<!-- Chip -->
<button class="chip px-md py-sm rounded-full border border-outline-variant text-on-surface-variant font-label-md text-label-md hover:border-primary hover:text-primary transition-colors duration-200">
                        Great quality
                    </button>
<!-- Chip -->
<button class="chip px-md py-sm rounded-full border border-outline-variant text-on-surface-variant font-label-md text-label-md hover:border-primary hover:text-primary transition-colors duration-200">
                        Fast service
                    </button>
<!-- Chip -->
<button class="chip px-md py-sm rounded-full border border-outline-variant text-on-surface-variant font-label-md text-label-md hover:border-primary hover:text-primary transition-colors duration-200">
                        Friendly provider
                    </button>
<!-- Chip -->
<button class="chip px-md py-sm rounded-full border border-outline-variant text-on-surface-variant font-label-md text-label-md hover:border-primary hover:text-primary transition-colors duration-200">
                        Good value
                    </button>
<!-- Chip -->
<button class="chip px-md py-sm rounded-full border border-outline-variant text-on-surface-variant font-label-md text-label-md hover:border-primary hover:text-primary transition-colors duration-200">
                        Careful handling
                    </button>
<!-- Chip -->
<button class="chip px-md py-sm rounded-full border border-outline-variant text-on-surface-variant font-label-md text-label-md hover:border-primary hover:text-primary transition-colors duration-200">
                        Easy pickup
                    </button>
<!-- Chip -->
<button class="chip px-md py-sm rounded-full border border-outline-variant text-on-surface-variant font-label-md text-label-md hover:border-primary hover:text-primary transition-colors duration-200">
                        Clean finish
                    </button>
</div>
</div>
<!-- Actions -->
<div class="flex flex-col-reverse sm:flex-row items-center justify-end gap-md pt-md border-t border-outline-variant/30 mt-xl">
<!-- Secondary CTA -->
<button class="w-full sm:w-auto px-lg py-sm rounded-lg border border-outline-variant bg-transparent text-on-surface font-label-md text-label-md hover:bg-surface-container transition-colors duration-200">
                    Skip Review
                </button>
<!-- Primary CTA -->
<button class="w-full sm:w-auto px-lg py-sm rounded-lg bg-electric-violet text-white font-label-md text-label-md font-bold shadow-lg shadow-primary/20 hover:bg-inverse-primary transition-colors duration-200">
                    Continue
                </button>
</div>
</div>
</main>
<script>
        // Simple micro-interaction for suggestion chips
        document.querySelectorAll('.chip').forEach(chip => {
            chip.addEventListener('click', function() {
                const textarea = document.getElementById('review-text');
                const text = this.innerText;
                const currentVal = textarea.value;
                
                // Toggle state logic for visual feedback
                if (this.classList.contains('bg-primary/10')) {
                    this.classList.remove('bg-primary/10', 'border-primary', 'text-primary');
                    this.classList.add('border-outline-variant', 'text-on-surface-variant');
                    // Very rudimentary text removal for demo
                    textarea.value = currentVal.replace(text + '. ', '').replace(text, '');
                } else {
                    this.classList.remove('border-outline-variant', 'text-on-surface-variant');
                    this.classList.add('bg-primary/10', 'border-primary', 'text-primary');
                    
                    if(currentVal.length > 0 && !currentVal.endsWith(' ')) {
                         textarea.value = currentVal + ' ' + text + '. ';
                    } else {
                        textarea.value = currentVal + text + '. ';
                    }
                }
                
                // Update counter
                document.getElementById('char-count').innerText = textarea.value.length + '/500';
            });
        });
    </script>
