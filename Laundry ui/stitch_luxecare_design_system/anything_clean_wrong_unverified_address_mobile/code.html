<body class="antialiased font-body-md h-screen flex flex-col">
<!-- TopAppBar -->
<header class="bg-surface/80 backdrop-blur-xl border-b border-white/5 shadow-sm sticky top-0 z-50 flex items-center justify-between px-md h-16 w-full max-w-full">
<div class="flex items-center gap-xs">
<button aria-label="Go Back" class="text-on-surface-variant dark:text-on-surface-variant hover:opacity-80 transition-all duration-200 active:scale-95 p-2 rounded-full">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<div class="flex flex-col">
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed-dim leading-tight">Address needs verification</h1>
<span class="font-caption text-caption text-on-surface-variant">Order #QH1024</span>
</div>
</div>
<button aria-label="Help" class="text-on-surface-variant dark:text-on-surface-variant hover:opacity-80 transition-all duration-200 active:scale-95 p-2 rounded-full">
<span class="material-symbols-outlined" data-icon="help_outline">help_outline</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 overflow-y-auto pb-2xl mobile-container py-md space-y-md">
<!-- Amber Warning Card -->
<div class="bg-[#2C1F0C] border border-[#FF9900]/30 rounded-xl p-md flex items-start gap-md">
<span class="material-symbols-outlined text-[#FF9900] flex-shrink-0" data-icon="warning">warning</span>
<div>
<p class="font-body-md text-body-md text-[#FF9900] mb-1">Unverified Destination</p>
<p class="font-caption text-caption text-on-surface-variant">We couldn't verify this destination. Check the map and contact the customer before continuing.</p>
</div>
</div>
<!-- Map Section -->
<div class="rounded-xl overflow-hidden bg-surface-container-low border border-white/5 h-64 relative">
<div class="w-full h-full bg-cover bg-center" data-alt="A stylized, highly detailed dark-mode digital map interface centered on a specific urban location. The map uses deep charcoal and near-black tones for landmasses, with slightly lighter grey-violet lines for roads. Two distinct glowing neon violet markers stand out, connected by a dashed line indicating a very short route (0.3 km away). The visual style aligns perfectly with a premium, sleek delivery app interface, utilizing subtle glassmorphic overlays in the corners." data-location="Riverfront Drive" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAWmfz8iETCxOrsseOBItgctIs7rO7ne8XHeFPjZida2QGp0Ju_wzYr3STyRVYzClM0sCIMviIqCxkm-a9AnlgIRiHCT0meJQ1JUOAVmLUc-DvpuqP7SNG0kdNKBNgDC3vWy-8IYr4Ogf1rJ-xn0__KpGbxniGg6PLgM1tTkPKEl3jSrBNNyj-Wn3urPnH4eCaxKyJ0scHHYFnnbNnVVbJLCO3oDQ2x6Azy-HKMZ9ZXPeaFT-MD7AParw')"></div>
<!-- Map Overlay Info -->
<div class="absolute bottom-md left-md right-md bg-surface/80 backdrop-blur-md p-sm rounded-lg border border-white/5 flex justify-between items-center shadow-lg">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary text-[20px]" data-icon="my_location">my_location</span>
<span class="font-caption text-caption text-on-surface">You</span>
</div>
<div class="h-px bg-outline-variant flex-1 mx-sm relative">
<span class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-surface px-1 font-caption text-caption text-on-surface-variant rounded">0.3 km</span>
</div>
<div class="flex items-center gap-sm">
<span class="font-caption text-caption text-on-surface">Destination</span>
<span class="material-symbols-outlined text-[#FF9900] text-[20px]" data-icon="location_on">location_on</span>
</div>
</div>
</div>
<!-- Address Card -->
<div class="bg-surface-container-low rounded-xl p-md border border-white/5">
<div class="flex justify-between items-start mb-sm">
<h2 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Expected Destination</h2>
<span class="material-symbols-outlined text-outline" data-icon="content_copy">content_copy</span>
</div>
<p class="font-body-lg text-body-lg text-on-surface">1042 Riverfront Drive<br/>Apt 4B</p>
</div>

<button class="w-full bg-primary hover:bg-primary/90 text-on-primary font-label-md text-label-md py-md rounded-lg transition-colors flex justify-center items-center gap-sm">
<span class="material-symbols-outlined" data-icon="phone">phone</span>
