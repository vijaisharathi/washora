<!-- Simulated Route overlay elements for visual context -->
<div class="absolute inset-0 pointer-events-none">
<!-- Simulated path -->
<svg class="absolute inset-0 z-10 opacity-70" height="100%" width="100%" xmlns="http://www.w3.org/2000/svg">
<path class="animate-[dash_30s_linear_infinite]" d="M 150 400 Q 200 300 250 200 T 350 150" fill="transparent" stroke="#dcb8ff" stroke-dasharray="8 8" stroke-width="4"></path>
</svg>
<!-- Current Location Pin -->
<div class="absolute left-[150px] top-[400px] transform -translate-x-1/2 -translate-y-1/2 z-20">
<div class="w-12 h-12 bg-primary/20 rounded-full flex items-center justify-center animate-pulse">
<div class="w-4 h-4 bg-primary rounded-full shadow-[0_0_15px_rgba(220,184,255,0.8)]"></div>
</div>
</div>
<!-- Destination Pin -->
<div class="absolute left-[350px] top-[150px] transform -translate-x-1/2 -translate-y-full z-20">
<span class="material-symbols-outlined text-4xl text-primary" style="font-variation-settings: 'FILL' 1;">location_on</span>
</div>
</div>
</div>
<!-- Top Navigation (Transactional intent -> no global nav shell, custom header) -->
<header class="fixed top-0 w-full z-50 glass-panel shadow-sm px-md h-16 flex items-center justify-between">
<button class="w-10 h-10 flex items-center justify-center rounded-full text-on-surface hover:bg-surface-variant/50 transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="text-center">
<span class="block font-caption text-caption text-on-surface-variant tracking-wider uppercase">Order</span>
<span class="block font-label-md text-label-md font-bold text-on-surface">#QH1024</span>
</div>
<button class="w-10 h-10 flex items-center justify-center rounded-full text-on-surface hover:bg-surface-variant/50 transition-colors">
<span class="material-symbols-outlined">more_vert</span>
</button>
</header>
<!-- Main Content Area (Spacer to push bottom card down) -->
<main class="flex-1 relative z-10 flex flex-col justify-end pointer-events-none pb-sm">
<!-- Bottom Info Card -->
<div class="px-md pointer-events-auto w-full max-w-[600px] mx-auto">
<div class="glass-panel rounded-xl shadow-[0_-4px_20px_rgba(0,0,0,0.4)] overflow-hidden flex flex-col">
<!-- Status & ETA Banner -->
<div class="bg-primary/10 px-lg py-sm flex justify-between items-center border-b border-white/5">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-sm">navigation</span>
<span class="font-label-md text-label-md text-primary font-bold">NAVIGATING TO PICKUP</span>
</div>
<div class="text-right">
<span class="font-headline-md text-headline-md font-bold text-on-surface block">7 min</span>
<span class="font-caption text-caption text-on-surface-variant block">1.4 km</span>
</div>
</div>
<!-- Location Details -->
<div class="p-lg flex flex-col gap-md relative">
<!-- Progress Line -->
<div class="absolute left-[39px] top-[40px] bottom-[40px] w-px bg-surface-variant"></div>
<!-- Origin (Current Location implicit, focus on Destination) -->
<div class="flex items-start gap-md z-10 relative">
<div class="w-8 h-8 rounded-full bg-surface-variant flex items-center justify-center shrink-0 mt-1">
<span class="material-symbols-outlined text-on-surface-variant text-sm" style="font-variation-settings: 'FILL' 1;">store</span>
</div>
<div class="flex-1">
<h3 class="font-headline-md text-headline-md-mobile text-on-surface mb-1">CleanX Service Center</h3>
<p class="font-body-md text-body-md text-on-surface-variant">142, 2nd Main Rd, Anna Nagar</p>
</div>
<button class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center text-primary shrink-0 hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-[20px]">call</span>
</button>
</div>
<!-- Item Details -->
<div class="flex items-start gap-md z-10 relative pt-2">
<div class="w-8 h-8 rounded-full bg-surface-container flex items-center justify-center shrink-0 mt-1">
<span class="material-symbols-outlined text-on-surface-variant text-sm">inventory_2</span>
</div>
<div class="flex-1">
<span class="font-caption text-caption text-on-surface-variant block mb-1">PICKUP ITEM</span>
<span class="font-body-lg text-body-lg text-on-surface block">1x White Sneaker (Deep Clean)</span>
</div>
</div>
</div>

<div class="px-lg pb-lg pt-sm">
<button class="w-full bg-primary text-on-primary font-label-md text-label-md font-bold py-md rounded-lg flex items-center justify-center gap-2 hover:bg-primary-fixed transition-colors active:scale-[0.98]">
<span class="material-symbols-outlined">directions</span>
                        NAVIGATE TO PICKUP
                    </button>
</div>
</div>
</div>
