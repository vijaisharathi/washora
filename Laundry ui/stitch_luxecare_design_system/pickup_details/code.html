<!-- Script for interactive elements (optional micro-interactions) -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const checkboxes = document.querySelectorAll('input[type="checkbox"]:not([disabled])');
            const otpCheckbox = document.querySelector('input[type="checkbox"][disabled]').closest('label');
            const otpInput = otpCheckbox.querySelector('input');
            const otpLabel = otpCheckbox.querySelector('span:first-of-type');
            
            function checkProgress() {
                let allChecked = true;
                checkboxes.forEach(cb => {
                    if (!cb.checked) allChecked = false;
                });
                
                if (allChecked) {
                    otpCheckbox.classList.remove('opacity-50', 'pointer-events-none');
                    otpInput.disabled = false;
                    const badge = otpCheckbox.querySelector('.bg-surface-variant');
                    if(badge) badge.style.display = 'none';
                } else {
                    otpCheckbox.classList.add('opacity-50', 'pointer-events-none');
                    otpInput.disabled = true;
                    otpInput.checked = false;
                    const badge = otpCheckbox.querySelector('.bg-surface-variant');
                    if(badge) badge.style.display = 'block';
                }
            }

            checkboxes.forEach(cb => {
                cb.addEventListener('change', checkProgress);
            });
        });
    </script>
