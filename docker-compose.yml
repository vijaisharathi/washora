version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Managed Database
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: washora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-washora_prod}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./prisma/migrations:/docker-entrypoint-initdb.d/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-washora_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - washora-network

  # ----------------------------------------------------------------------------
  # WASHORA Application (Backend API & Frontend Portals)
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: washora-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
      - "4000:4000"
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_pass}@postgres:5432/${POSTGRES_DB:-washora_prod}?schema=public&connection_limit=20&pool_timeout=30"
      DIRECT_DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_pass}@postgres:5432/${POSTGRES_DB:-washora_prod}?schema=public"
      PORT: 4000
      NEXT_PUBLIC_API_BASE_URL: "http://localhost:4000"
      NEXT_PUBLIC_API_VERSION: "v1"
      NEXT_PUBLIC_APP_ENV: "production"
      NEXT_PUBLIC_USE_LIVE_API: "true"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      CORS_ORIGINS: "http://localhost:3000,http://localhost:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:4000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - washora-network

volumes:
  postgres_data:
    driver: local

networks:
  washora-network:
    driver: bridge
